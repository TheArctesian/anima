[package]
name = "anima-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The command line of Anima: devices, checks, sessions and the MCP server of a hub"
repository = "https://github.com/TheArctesian/anima.ing"
readme = "README.md"
rust-version = "1.100"
keywords = ["anima", "devices", "self-hosted", "mcp"]
categories = ["command-line-utilities"]
# The only crate of this repository that is published (INS-011, R-151). The operator publishes
# it (task R8d); an agent runs `cargo publish` only with `--dry-run`.
publish = true
# The package builds from its own files: `schema.graphql` is the copy of K1
# (contracts/schema.graphql) that `schema-copy.sh` makes and a test compares. No test file.
include = ["/src/**", "/build.rs", "/release_version.rs", "/schema.graphql", "/README.md"]

[lints]
workspace = true

[lib]
name = "anima_cli"

[[bin]]
name = "anima"
path = "src/main.rs"

[dependencies]
# One body type for every request: the serialised document is wiped when it drops.
bytes.workspace = true
# API-key expiry from a number of days (`key create --expires 90d`).
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
# `anima ssh` and the hidden prompts (CMD-010): raw mode and the window size, restored on
# every exit (K4 Section 8).
crossterm = { workspace = true, features = ["windows"] }
# The stream and sink halves of the subscription and tunnel WebSockets (CMD-003).
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
graphql_client.workspace = true
# The body of a file upload, read from the disk part by part (`hub/attachments.rs`, FIL-005).
http-body = "1.1"
http-body-util.workspace = true
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
# The OS key store holds the token (CMD-012): the macOS Keychain, the Linux Secret Service.
keyring.workspace = true
# Plain `rustls-tls` with the web PKI roots; no redirect, no proxy, no cookie (CMD-003).
reqwest.workspace = true
# The sockets' TLS (`hub/wire.rs`): ring, no OpenSSL, the web PKI roots.
rustls.workspace = true
# `anima mcp`: the MCP protocol on standard input and output (MCP-001); `elicitation` asks the
# person to approve a call of a tool in state `ask` (MCP-013).
rmcp = { workspace = true, features = ["elicitation"] }
# The MCP tools' input schemas (MCP-009).
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The token file and the configuration are written to a temporary file, then renamed (CMD-012).
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "signal"] }
# The sockets' TLS handshake (`hub/wire.rs`).
tokio-rustls.workspace = true
# `graphql-transport-ws` for subscriptions, over the same `hub/wire.rs` stream as the tunnels (CMD-003).
tokio-tungstenite.workspace = true
# A device given by ID rather than by name (`device get`).
uuid.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The end-to-end suite (`tests/it/end_to_end/`) serves the real hub in the test, with its
# test switches; never a dependency of the program.
anima-hub = { path = "../hub", features = ["test-support"] }
axum.workspace = true
# The parser of `--input name=value` is property-tested: no refusal shows a value (LOG-007).
proptest = "1.12"
base64.workspace = true
graphql-parser.workspace = true
# The end-to-end suite's authenticator app (RFC 6238) and SSH device with its `sftp` subsystem.
hmac.workspace = true
# A throwaway GitHub App key for the end-to-end Projects flow, made in the test; never a key file.
rsa = { version = "0.9", features = ["getrandom"] }
russh.workspace = true
russh-sftp.workspace = true
sha1.workspace = true
# Each end-to-end test gets its own migrated database on the throwaway server (R-009, R-019).
sqlx.workspace = true
tokio = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for other programs' configuration files (MCP-034).
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
anima-windows = { path = "../anima-windows" }
keyring = { workspace = true, features = ["windows-native"] }
