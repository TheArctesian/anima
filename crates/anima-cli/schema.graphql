  githubConnect: GithubConnectAttempt

  # Tool inventory (operator, 2026-11-15, CAP-020 to CAP-031; ruling number to be assigned)
  "Each device whose daemon sent a tool inventory, by device name (byte order). tool: only the devices where that tool is usable. buildTarget: only the devices with that Rust target. A name the hub does not know matches no device (CAP-030). Open to a read key."
  capabilities(tool: String, buildTarget: String): [DeviceCapabilities!]!

  # The use of the AI agent programs (R-135; AIS-020, AIS-021, AIS-024)
  "The use of the AI agent programs (Claude Code, Codex) on the devices whose daemon sends it, summed by the dimensions of by over the UTC days of filter (default: the 30 days that end today), with an estimate of the cost from public list prices and each daemon's usage state. by empty: one row of everything. VALIDATION for a bad deviceId, repository or day, a first day after the last, more than 366 days, or more than 20000 groups before the rows are cut to 1000. Open to a read key."
  agentUsage(filter: AgentUsageFilter, by: [AgentUsageDimension!]! = []): AgentUsage!
  "The containers of a device, running or not, newest first (HOST-001). CONFLICT when the device has no SSH credential in Anima, SSH is off, no host key is accepted, or it has no docker command. UNAVAILABLE when the device or Docker does not answer. NOT_FOUND for an unknown device."
  containers(deviceId: ID!): [Container!]!
  "The last lines of the log of one container (HOST-001). containerId is 12 to 64 lower-case hexadecimal characters; lines is 1 to 1000, default 200. The errors of containers apply; NOT_FOUND also when the device has no such container. A log can hold a secret: Login or browser token only (D-23, R-100), and no MCP tool returns it (MCP-004)."
  containerLog(deviceId: ID!, containerId: String!, lines: Int): ContainerLog!
  "The details of one container (HOST-017): its command, restart policy, health check, mounts, networks, labels and processes, and the names of its environment variables with no value. containerId is 12 to 64 lower-case hexadecimal characters. The errors of containers apply; NOT_FOUND also when the device has no such container. A command or a label can hold a secret: Login or browser token only (D-23, R-100), and no MCP tool returns it (MCP-004)."
  containerDetail(deviceId: ID!, containerId: String!): ContainerDetail!
  "The images and the volumes of a device, with the size of each, the containers that use it and the space that a clean-up can free (HOST-020). Read-only: it removes nothing. Docker measures each volume, so the read can take up to 30 seconds. The errors of containers apply. Open to a read key."
  containerStorage(deviceId: ID!): ContainerStorage!
  "The networks of Docker on a device, each with the containers on it (HOST-020). The errors of containers apply. Open to a read key."
  containerNetworks(deviceId: ID!): [ContainerNetwork!]!
  "Whether a newer image exists for each container of a device (HOST-021): the hub compares the digest that the device has for the tag of the image with the digest that the public registry of the image gives now. The hub sends no credential to a registry and reads no private image. It updates nothing (ETH-004). A registry that is not read is no error: the container has the state NOT_KNOWN. The read can take up to 40 seconds. Each read asks the registries again: the hub keeps no answer. The errors of containers apply. Open to a read key."
  containerImageUpdates(deviceId: ID!): [ContainerImageUpdate!]!
  "The check of the syntax of a Compose file before an install (HOST-022): is the text YAML, and does it have the form of a Compose file. It is a check of the syntax only: it does not say that a machine accepts the file. The hub reaches no device, runs nothing and keeps nothing; it writes the text to no log, no event and no error (LOG-007), and a problem holds no text of the file. A text of more than 256 KiB has the one problem TOO_LARGE. Complexity 100: one request holds at most four. Open to a read key."
  composeFileCheck(file: String!): ComposeFileCheck!
  "The Compose file of one `docker run` command (HOST-022). The hub reads the words of the command with its own reader: it expands nothing, runs nothing, reaches no device and keeps nothing; it writes the command to no log, no event and no error (LOG-007). A command that the reader cannot read has a refusal, not an error. An option with no key in a Compose file is in notConverted. Complexity 100: one request holds at most four. Open to a read key."
  composeFromDockerRun(command: String!): ComposeFromDockerRun!

  # The catalogue (HOST-047, R-300, R-299; task H38)
