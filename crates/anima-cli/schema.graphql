  UP_TO_DATE
  NEWER_IMAGE
  NOT_KNOWN
}

"""
Why the hub cannot say whether a newer image exists (HOST-021). PINNED_DIGEST: the container names its image by a
digest. OTHER_REGISTRY: the image is of a registry that Anima does not read (it reads Docker Hub, ghcr.io, quay.io and
mcr.microsoft.com, with no account). NO_NAME: the container names an identifier, or a name no registry accepts.
NO_LOCAL_DIGEST: Docker keeps no registry digest for the tag (the image was built on the device, or the tag is not on
the device now). NOT_AT_REGISTRY: the registry has no such tag for a reader with no account (private, or gone).
REGISTRY_NOT_READ: the registry did not answer as a registry does or in time, the hub may not reach it, or the device
has more than 40 different tags.
"""
enum ContainerImageUpdateReason {
  PINNED_DIGEST
  OTHER_REGISTRY
  NO_NAME
  NO_LOCAL_DIGEST
  NOT_AT_REGISTRY
  REGISTRY_NOT_READ
}

