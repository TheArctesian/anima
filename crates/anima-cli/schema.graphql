  DEVICE
  SOURCE
  "The model of each token count. Sessions, prompts and tool calls count under the model of their session: the model with the most output tokens in it, the first by name on a tie; none for a session with no tokens."
  MODEL
  REPOSITORY
  "The UTC day. A session with use on two days counts on each."
  DAY
}

"Which use agentUsage sums. Each part narrows the rows; null parts admit all."
