# The use of the AI agent programs (R-135; AIS-018 to AIS-024; K8 Section 4 agentUsage).
"The AI agent program a session comes from (AIS-018)."
enum AgentSource {
  CLAUDE_CODE
  CODEX
}

"What a device's daemon can read of the sessions of the AI agent programs, as it sent last (AIS-024)."
enum AgentUsageState {
  "It reads the session files of its user."
  READING
  "It runs as the systemd system unit: This daemon runs as a system unit and cannot see the sessions of a user."
  SYSTEM_UNIT
  "The operator turned the function off on the device, or its settings file cannot be read."
