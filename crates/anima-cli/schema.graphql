}

"""
What is wrong in a Compose file, as a fixed code (HOST-022; R-150). Errors: TOO_LARGE (the text is larger than 256 KiB),
NOT_YAML, TOO_DEEP (deeper than 64 levels), TOO_MANY_NODES (more than the check reads), MORE_THAN_ONE_DOCUMENT,
TOP_LEVEL_NOT_MAPPING, KEY_NOT_TEXT, DUPLICATE_KEY, NO_SERVICES (and no `include`), SERVICES_NOT_MAPPING, SERVICES_EMPTY,
SERVICE_NOT_MAPPING, NO_IMAGE_OR_BUILD (a service with no `image`, `build`, `extends`, `provider` or merge key),
WRONG_TYPE (the value of a known key of a service has a form that Compose does not accept), RESTART_NOT_KNOWN (the
value of `restart` is not a restart policy). Warnings: UNKNOWN_TOP_LEVEL_KEY, UNKNOWN_SERVICE_KEY (Compose does not
know the key; a key that starts with `x-` is not a problem), VERSION_OBSOLETE (Compose ignores `version`).
"""
enum ComposeFileProblemCode {
  TOO_LARGE
  NOT_YAML
  TOO_DEEP
  TOO_MANY_NODES
  MORE_THAN_ONE_DOCUMENT
  TOP_LEVEL_NOT_MAPPING
  KEY_NOT_TEXT
  DUPLICATE_KEY
  NO_SERVICES
  SERVICES_NOT_MAPPING
  SERVICES_EMPTY
  SERVICE_NOT_MAPPING
  NO_IMAGE_OR_BUILD
  WRONG_TYPE
  RESTART_NOT_KNOWN
  UNKNOWN_TOP_LEVEL_KEY
  UNKNOWN_SERVICE_KEY
  VERSION_OBSOLETE
}

"ERROR: Compose refuses the file. WARNING: Compose reads the file and ignores the part (HOST-022)."
enum ComposeFileProblemSeverity {
  ERROR
  WARNING
}

"One problem of a Compose file (HOST-022). It holds no text that the operator wrote, because a value, and also a name in the wrong place, can be a secret (LOG-007): a service has its number, and a key its name only when Compose defines that name."
type ComposeFileProblem {
  code: ComposeFileProblemCode!
  severity: ComposeFileProblemSeverity!
  "The line of the problem in the file, from 1."
  line: Int!
  "The column of the problem in its line, from 1."
  column: Int!
  "The number of the service in the order of `services`, from 1, when the problem is in one."
  serviceNumber: Int
  "The name of the key, when the problem is about a key that Compose defines (such as `ports`). Null for an unknown key, an extension and the name of a service."
  key: String
}

"The result of the syntax check of a Compose file (HOST-022). It is a check of the syntax only: it does not say that a machine accepts the file (the rules of HOST-028 are a different check)."
type ComposeFileCheck {
  "True when the check found no error. A warning does not make it false."
  syntaxValid: Boolean!
  "The problems in the order of the file, errors and warnings. At most 100."
  problems: [ComposeFileProblem!]!
  "True when the file has more problems than the 100 that are given."
  cut: Boolean!
}

"""
Why a `docker run` command was not changed into a Compose file, as a fixed code (HOST-022; R-150). TOO_LARGE: the
command is larger than 64 KiB. NO_COMMAND: the text is empty. NOT_DOCKER_RUN: the command is not `docker run` or
`docker container run` (an optional `sudo` first). COMMAND_SUBSTITUTION: `$(` or a backtick. PIPE. MORE_THAN_ONE_COMMAND:
`;`, `&&`, `||`, `&`, or a line break with no backslash before it. REDIRECTION: `<` or `>`. SHELL_SYNTAX: a group in
round brackets or a comment. VARIABLE_NOT_KEPT: a variable that cannot stay as text in a Compose file (`$1`, `$?`,
`${NAME%x}`, a quote in `${...}`); `$NAME`, `${NAME}` and `${NAME:-text}` stay. ARITHMETIC_EXPANSION: `$[`.
BRACE_EXPANSION: a list or a range in braces out of quotes, such as `{80,443}`. TILDE_EXPANSION: a `~` out of quotes at the
start of a word or after `=` or `:`. PATTERN: `*`, `?` or `[` out of quotes. UNCLOSED_QUOTE. CONTROL_CHARACTER (also a
carriage return that is not part of a line end). OPTION_WITHOUT_VALUE: the last option needs a value. NO_IMAGE: the
command names no image. TOO_MANY_NETWORKS: more than 32 networks or more than 32 network aliases. FILE_TOO_LARGE: the
Compose file would be larger than 256 KiB, the most that composeFileCheck reads.
"""
enum ComposeRunRefusal {
  TOO_LARGE
  NO_COMMAND
  NOT_DOCKER_RUN
  COMMAND_SUBSTITUTION
  PIPE
  MORE_THAN_ONE_COMMAND
  REDIRECTION
  SHELL_SYNTAX
  VARIABLE_NOT_KEPT
  ARITHMETIC_EXPANSION
  BRACE_EXPANSION
  TILDE_EXPANSION
  PATTERN
  UNCLOSED_QUOTE
  CONTROL_CHARACTER
  OPTION_WITHOUT_VALUE
  NO_IMAGE
  TOO_MANY_NETWORKS
  FILE_TOO_LARGE
}

"""
What the caller must know about the Compose file of a `docker run` command (HOST-022). DETACH_NOT_NEEDED: `-d` changes
nothing, Compose starts a service in the background. REMOVE_NOT_KEPT: `--rm` has no key in a Compose file.
VARIABLES_KEPT: a `$NAME` or `${NAME}` stays as text, and Compose fills it when it starts the project. DOLLAR_WRITTEN: a
`$` that is a character is written `$$`. EXTERNAL_NETWORK: a network of the command is `external`, it must exist before
the project starts. VOLUME_NAME_KEPT: a volume keeps its name of Docker, so the project uses the same volume.
UNKNOWN_OPTION_READ_AS_FLAG: an option that Docker does not have was read as an option with no value; make sure that
the image is the right word.
"""
enum ComposeRunNote {
  DETACH_NOT_NEEDED
  REMOVE_NOT_KEPT
  VARIABLES_KEPT
  DOLLAR_WRITTEN
  EXTERNAL_NETWORK
  VOLUME_NAME_KEPT
  UNKNOWN_OPTION_READ_AS_FLAG
}

"The Compose file of one `docker run` command, or why there is none (HOST-022). The file has one service."
type ComposeFromDockerRun {
  "The text of the Compose file. Null when refusal is not null. It holds the values of the command, also a secret that the command holds."
  composeFile: String
  "The name of the one service: from `--name`, or from the last part of the name of the image."
  service: String
  "Not null when the command was not converted."
  refusal: ComposeRunRefusal
  "The position in the command where the converter stopped, in characters from 1. Null when refusal is null."
