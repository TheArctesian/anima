  addIssueComment(repository: ID!, number: Int!, body: String!): IssueComment!
  "Closes or opens an issue. reason only with open false. No change when it is already so. VALIDATION when the number is a pull request. Writes an audit entry (PRJ-028)."
  setIssueOpen(repository: ID!, number: Int!, open: Boolean!, reason: IssueCloseReason): Issue!
  "CONFLICT when the head moved, it cannot merge, GitHub has not computed it, or the method is not allowed. FORBIDDEN for a pull request from a fork without forkConfirmed, and for any pull request from a fork when the request declares an AI agent (PRO-013). Returns it unchanged when it is already merged. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  mergePullRequest(input: MergePullRequestInput!): PullRequest!
  "1 to 20 pull requests, no pair twice, merged one after another in the order given; a failure does not stop the rest. One result for each, in the same order (PRJ-033). Only CLEAN ones; never one from a fork. One audit entry for each one the hub sent to GitHub. Login or browser token only (D-23, R-100)."
  mergePullRequests(pullRequests: [PullRequestTargetInput!]!, method: MergeMethod!): [PullRequestMerge!]!
  "Runs every job again. CONFLICT when it is not rerunnable or expectedHeadSha is not its head commit (PRJ-034). Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  rerunWorkflowRun(repository: ID!, runId: ID!, expectedHeadSha: String!): WorkflowRun!
  "Runs only the failed jobs again. CONFLICT as rerunWorkflowRun. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  rerunFailedWorkflowJobs(repository: ID!, runId: ID!, expectedHeadSha: String!): WorkflowRun!
  "CONFLICT when it is not cancellable or expectedHeadSha is not its head commit. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  cancelWorkflowRun(repository: ID!, runId: ID!, expectedHeadSha: String!): WorkflowRun!
  "Starts a workflow by hand on a branch (PRJ-035). VALIDATION when GitHub refuses the branch or the inputs; CONFLICT when the workflow is not active. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  dispatchWorkflow(input: DispatchWorkflowInput!): WorkflowDispatch!
  "Writes a commit status under an anima/ context (PRO-010). Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  setCommitStatus(input: CommitStatusInput!): CommitStatus!

  # S6: the device link (FRN-009, OR-S6-3)
  "An invite for a new device named name (1 to 64 visible characters). Shown once; it works once and expires (LNK-003). The response is no-store. Writes an audit entry without the invite (LOG-005, LOG-007). Login or browser token only (D-23)."
  createLinkInvite(name: String!): LinkInvite!
  "Removes the device with this key from the link and closes its streams; returns how many it closed (LNK-004). NOT_FOUND when the link does not list the key. Writes an audit entry. Login or browser token only (D-23)."
  revokeLinkDevice(key: String!): Int!
  # The hosted mode: the Anima.ing account is the only way in (hosted-mode.md HMD-037, R-129)
  "An invite and a one-time claim for the device named name, for the Anima.ing cloud only: cloudKey is the key of ANIMA_HOSTED_CLOUD_KEY_FILE. A device already on the link gets a claim and no invite. A new claim for a name ends the open claim of that name. Needs no token. FORBIDDEN on a hub that is not hosted, UNAUTHENTICATED for a wrong key. The response is no-store."
  hostedDeviceInvite(cloudKey: String!, name: String!): HostedDeviceInvite!
  "A login token for the device that sends this through the link, when it joined with the invite of claim. The claim works once, until its invite expires. Needs no token. FORBIDDEN on a hub that is not hosted, UNAUTHENTICATED for any other refusal. The response is no-store."
  claimDeviceToken(claim: String!): AuthPayload!
  "A one-time ticket for a browser of the account, for the Anima.ing cloud only: cloudKey is the key of ANIMA_HOSTED_CLOUD_KEY_FILE. Needs no token. FORBIDDEN on a hub that is not hosted, UNAUTHENTICATED for a wrong key, UNAVAILABLE when too many tickets are open. Writes nothing to a log or an entry (LOG-007; HMD-061)."
  hostedBrowserTicket(cloudKey: String!): HostedBrowserTicket!
  "The browser session of this hub in trade for ticket: the answer sets the __Host-anima cookie (Secure, HttpOnly, SameSite=Strict, Path=/, Max-Age 12 hours). The gateway of the pool sends it for the browser, with Origin of the public origin of the hub, and passes the Set-Cookie on; the ticket is never in an address. The ticket works once. Needs no token. FORBIDDEN on a hub that is not hosted and for a request that does not come from the public origin; UNAUTHENTICATED for a ticket that is used, expired or wrong. Writes an audit entry and an event (HMD-061, HMD-062)."
  hostedBrowserSignIn(ticket: String!): HostedBrowserSignIn!

  # Timeline and record links (operator, 2026-11-16; ruling number to be assigned; K-E4)
  "Links two records. A second call with the same source, target and kind returns the stored link and writes nothing; with a new label it replaces the label. VALIDATION for text that is not kind:id, for a record linked to itself, and for a repository, place, person or date key that is not in its one form (RLK-004)."
  linkRecords(input: RecordLinkInput!): RecordLink!
  "Removes one link and returns its ID. The two records are not changed. NOT_FOUND when no link has this ID."
  unlinkRecords(id: ID!): ID!

  # Files and extraction proposals (R-148; K-E4 Section 13). Each change writes one audit entry and one event.
  "Removes one file and returns its ID; its piece goes when no other file has the same bytes and key. NOT_FOUND when no file has this ID; UNAVAILABLE with no file store."
  deleteAttachment(id: ID!): ID!
  "Makes an archive, the unit of deletion of one import (FIL-004). VALIDATION for an owner that is not kind:id or a name that is not one line of 1 to 200 characters."
  createArchive(owner: String!, name: String!): Archive!
  "Deletes an archive with each of its files and each record that came from it, then the pieces that no file uses (FIL-004); returns its ID. NOT_FOUND when there is none."
  deleteArchive(id: ID!): ID!
  "Stores the result of one extraction as a proposal (VIS-001). VALIDATION with extensions.fields for a bad form, field, attachment or extension, and for origin HUB on a Class A form (VIS-002)."
  proposeExtraction(input: ProposeExtractionInput!): ExtractionProposal!
  "Confirms a proposal with the fields as the operator left them. NOT_FOUND; CONFLICT when it is decided."
  confirmExtraction(id: ID!, fields: [ExtractedFieldInput!]!): ExtractionProposal!
  "Rejects a proposal. NOT_FOUND; CONFLICT when it is decided."
  rejectExtraction(id: ID!): ExtractionProposal!

  # Location samples (R-145; K-E4 Sections 11 and 13)
  "Stores samples of an Anima phone app, at most 500 in one call, and returns how many were new. Safe to repeat. VALIDATION with extensions.fields; UNAVAILABLE when the hub has no sealing keys."
  recordLocationSamples(samples: [LocationSampleInput!]!): Int!
  "Login or browser token only (D-23, R-100). Makes an ingest token for the OwnTracks path and shows its value this one time. VALIDATION for a name that is not one line of 1 to 64 characters."
  createLocationIngestToken(name: String!): IssuedLocationIngestToken!
  "Revokes an ingest token: the OwnTracks path refuses it from now on. NOT_FOUND."
  revokeLocationIngestToken(id: ID!): LocationIngestToken!

  # Reminders (R-148; K-E6 Section 6)
  "Makes a reminder rule. VALIDATION with extensions.fields for a bad name, message, trigger, unless, limit, place or channel."
  createReminderRule(input: ReminderRuleInput!): ReminderRule!
  "Replaces a reminder rule and adds 1 to its revision: a firing that was due before the change is not sent (REM-005). NOT_FOUND; VALIDATION."
  updateReminderRule(id: ID!, input: ReminderRuleInput!): ReminderRule!
  "Deletes a reminder rule with its firings and returns its ID. NOT_FOUND."
  removeReminderRule(id: ID!): ID!
  "Sets a reminder rule on or off. NOT_FOUND."
  setReminderRuleEnabled(id: ID!, enabled: Boolean!): ReminderRule!
  "Makes one firing of the rule, which the hub sends in the next minute. No cooldown and no limit apply, and none is used up. NOT_FOUND."
  testReminderRule(id: ID!): ReminderFiring!
  "Snoozes a firing that was sent: the hub sends it again after minutes (1 to 10080) (REM-007). NOT_FOUND; CONFLICT when the firing was not sent or is decided."
  snoozeReminder(firing: ID!, minutes: Int!): ReminderFiring!
  "Acknowledges a firing that was sent: the hub does not send it again (REM-007). NOT_FOUND; CONFLICT."
  acknowledgeReminder(firing: ID!): ReminderFiring!
  "Stores the bytes that a client sealed for one owner record. A second call for the same owner replaces the bytes. `VALIDATION` names each field to fix."
  storeSealedRecord(input: SealedRecordInput!): SealedRecord!
  "Deletes the sealed record of `owner`. `true` when there was one."
  deleteSealedRecord(owner: String!): Boolean!
  "Keeps a vault key that one client sealed to its key exchange with a new client, as base64 of at most 4096 bytes, and gives the ID of the offer. The offer is read one time in the next 5 minutes. The hub cannot open it."
  offerVaultKey(sealed: String!): ID!

  # Places (operator, 2026-11-18; R-148; K-E4 Section 8)
  "Makes a place (PLC-001, PLC-002). VALIDATION with extensions.fields."
  createPlace(input: PlaceInput!): Place!
  "Changes a place. A name from a geocoder never replaces name (PLC-003). CONFLICT for a merged place."
  updatePlace(id: ID!, input: PlaceChangeInput!): Place!
  "Moves every reference of from to into and returns the remaining place (PLC-004)."
  mergePlaces(from: ID!, into: ID!): Place!
  "Makes a new top-level place from input.new and moves the named children, sites and links of the place to it. Returns the new place (PLC-004)."
  splitPlace(id: ID!, input: PlaceSplitInput!): Place!
  "Deletes a place that has no reference. A place with references is merged into replacement; with none given the answer is CONFLICT with extensions.references, the count of each sort of reference (PLC-005). Returns the ID of the place."
  deletePlace(id: ID!, replacement: ID): ID!
  "Links a site to a place, or with a null place removes the link. Returns the place, or null when the link was removed (PLC-006). NOT_FOUND when the site or the place does not exist."
  setSitePlace(site: ID!, place: ID): Place

  # Operational keys (R-147; K-E5 Section 2.2). A value goes in and never comes out: only a daemon gets one (K8). Each change writes one audit entry and one event, neither with a value.
  "Makes the key with its first value as version 1. VALIDATION for a field or a value of a length a key cannot have; CONFLICT when a key, removed or not, has the name. Login or browser token only (D-23, R-147)."
  createOperationalKey(input: CreateOperationalKeyInput!): OperationalKey!
  "Replaces the metadata. NOT_FOUND for an unknown name. Login or browser token only (D-23, R-147)."
  updateOperationalKey(name: String!, input: UpdateOperationalKeyInput!): OperationalKey!
  "Ends the active version and the retrieval of the key; the name stays taken. The answer holds the key as it was and the consumers that held the ended version. Login or browser token only (D-23, R-147)."
  removeOperationalKey(name: String!): OperationalKeyEnding!
  "Makes value the active version and supersedes the old one at once (R-147). rotatedAtProvider records what the operator says: the hub changes nothing at the provider, so a client says recorded, not rotated, when it is false. Login or browser token only (D-23, R-147)."
  rotateOperationalKey(name: String!, value: String!, rotatedAtProvider: Boolean!): OperationalKeyEnding!
  "Ends the active version with no new one. Login or browser token only (D-23, R-147)."
  revokeOperationalKey(name: String!): OperationalKeyEnding!
  "Lets the daemon of device fetch the key for workload: a trust decision. No change when the grant exists. NOT_FOUND for an unknown name or device. Login or browser token only (D-23, R-147)."
  grantOperationalKey(name: String!, device: ID!, workload: String!): OperationalKey!
  "Ends a grant; the daemon drops the key at its next report. NOT_FOUND when there is no such grant. Login or browser token only (D-23, R-147)."
  ungrantOperationalKey(name: String!, device: ID!, workload: String!): OperationalKey!

  # The catalogue (HOST-047, R-234; task H38)
  "Asks for the install of an entry of the catalogue on a device. The answer is a refusal with a fixed reason until task H6 exists (INSTALL_NOT_BUILT); an entry with the mark ENGINE_SOCKET is never installed (R-247). No machine is reached, nothing is kept and no audit entry is written. VALIDATION for a deviceId that is not an ID of a device. Open to a write API key and an AI agent (R-234)."
  installCatalogueEntry(entryId: String!, deviceId: ID!): CatalogueInstall!
}

type Subscription {
  deviceStatusChanged(deviceId: ID): DeviceStatusChange!
  heartbeatAdded(checkId: ID, deviceId: ID): HeartbeatAdded!
  eventAdded(minSeverity: Severity = INFO): Event!
  "Every start and end of a session, from every client (RA-034)."
  sessionChanged: SessionChange!
  metricsAdded(deviceId: ID): MetricsAdded!
  "Every change to a build job, with the log lines it added (BLD-081)."
  buildJobUpdated(jobId: ID): BuildJobUpdate!
  "Each new VPN picture, about once a minute."
  vpnChanged: VpnPicture!
  "Each change of an account: a sync that starts or ends, a pause, a new key. (operator, 2026-11-13; ruling number to be assigned; K-E1)"
  sourceAccountChanged(id: ID): SourceAccount!
  "Each change of the open attempt to connect GitHub. Open to a read key (operator, 2026-11-14; ruling number to be assigned; K-E1 Section 7a)."
  githubConnectChanged: GithubConnectAttempt!
  "Each firing when it is sent. While one subscription is open, the hub queues no reminder to a channel: the application shows it. For a firing about a private record the text is `You have a reminder.` and the subject is empty; `reminderFirings` of the query gives the firing itself."
  reminderFirings: ReminderFiring!
}

type DeviceStatusChange {
  deviceId: ID!
  status: Status!
  at: DateTime!
}

type HeartbeatAdded {
  checkId: ID!
  deviceId: ID!
  heartbeat: Heartbeat!
}

# Operational keys (R-147; K-E5 Section 2). No type holds a value.

"An operational key: a credential or a runtime secret that a server of the operator needs. No field holds its value."
type OperationalKey {
  id: ID!
  "1 to 80 of a-z, 0-9, _, . and -; starts with a letter."
  name: String!
  provider: String!
  purpose: String!
  "How to rotate the key at its provider; at most 4000 characters."
  instructions: String!
  "An https address at the provider."
  providerLink: String
  rotationDays: Int
  expiresAt: DateTime
  due: OperationalKeyDue!
  "The number of the active version; null when no version is active."
  activeVersion: Int
  "When the newest version was recorded, and the operator who recorded it."
  lastRotatedAt: DateTime!
  lastRotatedBy: String!
  createdAt: DateTime!
  createdBy: String!
  "Newest first."
  versions: [OperationalKeyVersion!]!
  consumers: [OperationalKeyConsumer!]!
}

"DUE: the last rotation is older than rotationDays. EXPIRING: in the 14 days before expiresAt. EXPIRED: after it; the key is given no more."
enum OperationalKeyDue {
  CURRENT
  DUE
  EXPIRING
  EXPIRED
}

"A key has at most one ACTIVE version. A version that ended is never active again; its sealed value is deleted 30 days after it ended."
enum OperationalKeyVersionState {
  ACTIVE
  SUPERSEDED
  REVOKED
  EXPIRED
}

type OperationalKeyVersion {
  number: Int!
  state: OperationalKeyVersionState!
  createdAt: DateTime!
  createdBy: String!
  endedAt: DateTime
  "What the operator said: the key was also changed at its provider."
  rotatedAtProvider: Boolean!
}

"A server that may fetch the key: the device of its daemon and the workload that uses the key there."
type OperationalKeyConsumer {
  deviceId: ID!
  "1 to 40 of a-z, 0-9, _, . and -; starts with a letter."
  workload: String!
  grantedAt: DateTime!
  grantedBy: String!
  "The version in the daemon's cache at its last report (heldSeenAt); null when it held none."
  heldVersion: Int
  heldSeenAt: DateTime
  fetchedVersion: Int
  fetchedAt: DateTime
}

"The answer of a change that ends a version."
type OperationalKeyEnding {
  key: OperationalKey!
  "The version that ended; null when no version was active."
  endedVersion: Int
  "The consumers whose daemon held the ended version at its last report. A connected daemon drops it at its next report; a server with no contact keeps its copy, so revoke the key at the provider when a server is lost."
  stillHeldBy: [OperationalKeyConsumer!]!
}

input CreateOperationalKeyInput {
  name: String!
  provider: String!
  purpose: String!
  instructions: String! = ""
  providerLink: String
  rotationDays: Int
  expiresAt: DateTime
  "The first value: 1 to 16384 bytes."
  value: String!
}

"The whole metadata; it replaces the stored one."
input UpdateOperationalKeyInput {
  provider: String!
  purpose: String!
  instructions: String!
  providerLink: String
  rotationDays: Int
  expiresAt: DateTime
}
