  latitude: Float
  longitude: Float
  radiusM: Int
  category: String
  icon: String
  aliases: [String!]
  "Null removes the geocoder name."
  geocoderName: String
}

input PlaceSplitInput {
  "The new top-level place."
  new: PlaceInput!
  "Child places of the place that move into the new place."
  children: [ID!]
  "Sites that move to the new place."
  sites: [ID!]
  "Record links that move to the new place."
  links: [ID!]
}

