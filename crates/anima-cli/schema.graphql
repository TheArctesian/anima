  "The sealed record of `owner` (`kind:id`), or null. The bytes are as the client sealed them; the hub cannot open them."
  sealedRecord(owner: String!): SealedRecord
  "The sealed bytes of a vault key offer, as base64, one time: the read deletes the offer. Null for an offer that was read, that is older than 5 minutes, or that never was."
  vaultKeyOffer(id: ID!): String

  # Places (operator, 2026-11-18; R-148; K-E4 Section 8)
  "The places that are not merged, by name."
  places: [Place!]!
  "One place. A place that was merged gives the place it was merged into (PLC-004)."
  place(id: ID!): Place

  # Projects: work, code and history (operator, 2026-11-13; ruling number to be assigned; PRJ-027 to PRJ-035, OD-E14)
  # Every field below: CONFLICT while Projects is off or while ProjectRepository.access is not READY; NOT_FOUND for an
  # unknown repository ID or a number, run or path GitHub does not have; VALIDATION (with extensions.fields) for a bad
