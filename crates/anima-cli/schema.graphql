}

"A device's storage, drive by drive, never one total (MET-026)."
type Storage {
  "Mounted drives by name, then mounts on no known drive by path, then unmounted drives by name."
  drives: [Drive!]!
}

# Tool inventory (operator, 2026-11-15, CAP-020 to CAP-031; ruling number to be assigned).
"A device's capabilities: today the tool inventory its daemon last sent (CAP-020, CAP-026, CAP-030). Every text comes from the device."
type DeviceCapabilities {
  device: Device!
  "aarch64 or x86_64."
  architecture: String!
  "macos or linux."
  os: String!
  "For example 27.0 (macOS) or 24.04 (the Linux distribution; the kernel release when it has none). 1 to 64 bytes of [0-9A-Za-z.+_-]."
  osVersion: String!
  "The tools the daemon found, in the order of the probe list; a tool it did not find is not listed (CAP-023)."
  tools: [Tool!]!
  "The installed Rust targets (rustup), in byte order."
  buildTargets: [String!]!
  "When the hub stored this inventory."
  foundAt: DateTime!
}

"One tool the daemon found (CAP-024, CAP-025)."
type Tool {
  "git, rustc, cargo, cargo-nextest, sccache, bun, node, xcodebuild, docker, podman, nix, claude or codex."
  name: String!
  "1 to 64 bytes of [0-9A-Za-z.+_-]; null when the tool is not usable."
  version: String
  "False when the tool was found but its version probe timed out, failed or printed no version."
  usable: Boolean!
  "Why the tool is not usable; null when it is (CAP-024)."
  reason: NotUsableReason
}

"Why a found tool is not usable: a fixed code, never text from the device (CAP-024)."
enum NotUsableReason {
  "Its version probe ran past its time limit."
  TIMED_OUT
  "It could not start, or exited with a failure."
  EXITED
  "It ran but printed no version the daemon reads."
  NO_VERSION
  "A reason this hub does not know (a newer daemon's)."
  FAILED
}

# The containers of a device (R-149; HOST-001, HOST-010; stage 1 of hosted applications). Read now from the device
# through the hub's SSH link with fixed docker commands; the hub keeps nothing of them (LOG-007).
"What Docker says a container is doing. UNKNOWN is a state this hub does not know."
enum ContainerState {
  RUNNING
  EXITED
  RESTARTING
  PAUSED
  CREATED
  REMOVING
  DEAD
  UNKNOWN
}

"What the status text of a container says of its health check. NONE: no health check, or not running."
enum ContainerHealth {
  HEALTHY
  UNHEALTHY
  STARTING
  NONE
}

"""
The one state of a Compose project, which the hub makes from the states of its containers (HOST-019; R-150).
The first rule that applies gives the state: FAILING, a container restarts or is dead; UNKNOWN, a container has a
state this hub does not know; PAUSED, no container runs and one is paused; STOPPED, no container runs;
PARTLY_RUNNING, some containers run and some do not; UNHEALTHY, every container runs and one fails its health check;
RUNNING. A container that ended is one that does not run, with any exit status: the list of Docker cannot tell a
set-up step that finished from a service that was stopped.
"""
enum ComposeProjectState {
  RUNNING
  UNHEALTHY
  PARTLY_RUNNING
  FAILING
  PAUSED
  STOPPED
  UNKNOWN
}

"One container of a device (HOST-001). Every text is from the device."
type Container {
  "The full identifier of Docker: 64 hexadecimal characters."
  id: String!
  name: String!
  image: String!
  state: ContainerState!
  "The status text of Docker, for example: Up 3 hours (healthy)."
  status: String!
  health: ContainerHealth!
