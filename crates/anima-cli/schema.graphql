# ---------------------------------------------------------------- metrics (WP-28)

enum MetricKind {
  CPU_PERCENT
  MEMORY_PERCENT
  MEMORY_BYTES
  DISK_PERCENT
  DISK_BYTES
  NETWORK_IN_BPS
  NETWORK_OUT_BPS
  UPTIME_SECONDS
