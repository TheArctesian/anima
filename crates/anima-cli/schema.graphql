  "The days summed, YYYY-MM-DD, both included."
  firstDay: String!
  lastDay: String!
  "One row for each group, newest day first, then by device name (byte order), source, model and repository, a missing model or repository last. At most 1000."
  rows: [AgentUsageRow!]!
  "How many groups are not in rows because of the limit of 1000."
  rowsLeftOut: Int!
  "Everything the filter admits, in one row with no dimension."
  total: AgentUsageRow!
  "Each device whose daemon sent a usage state, by device name; only the device of filter.deviceId when it is given."
  devices: [AgentUsageDevice!]!
  "The day of the public list prices of estimatedCostUsd, YYYY-MM-DD."
  pricesAsOf: String!
}

"The sums of one group. A dimension that by does not name is null; MODEL and REPOSITORY are also null for use with no model or no repository. Every text comes from a device. Counts are whole numbers; a Float holds a count above 2^31 exactly up to 2^53."
type AgentUsageRow {
  device: Device
  source: AgentSource
  model: String
  repository: String
  "YYYY-MM-DD."
  day: String
  "The sessions with use in the group."
  sessions: Int!
  prompts: Float!
  toolCalls: Float!
  "Input tokens not read from or written to the cache."
  inputTokens: Float!
  "Output tokens, reasoning included."
  outputTokens: Float!
  cacheReadTokens: Float!
  cacheWriteTokens: Float!
  "An estimate in US dollars: the tokens of each model times its public list price of pricesAsOf (AIS-021). It is not the bill of a subscription. Null when no token of the group has a known price; never a guess for a model with no known price."
  estimatedCostUsd: Float
  "The tokens of models with no known price, which estimatedCostUsd leaves out."
  unpricedTokens: Float!
}

