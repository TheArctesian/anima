  "The links that start or end at record (kind:id), newest first, at most 200. VALIDATION when record is not kind:id."
  recordLinks(record: String!): [RecordLink!]!
  # Files and extraction proposals (R-148; K-E4 Section 13)
  "The files of owner (kind:id), newest first, at most 200. VALIDATION when owner is not kind:id."
  attachments(owner: String!): [Attachment!]!
  "The proposals of owner (or of every record) in state (or any), newest first, at most 200."
