  # Location samples and the context of a transfer event (R-145; K-E4 Section 13)
  "The samples observed from from to to, oldest first, at most first (1 to 1000; 1000 when not given). VALIDATION when to is not after from or the span is longer than 31 days. Each read writes one audit entry with the span and the count, not the positions. UNAVAILABLE when the hub has no sealing keys."
  locationSamples(from: DateTime!, to: DateTime!, first: Int): [LocationSample!]!
  "The ingest tokens of the OwnTracks path, newest first, without their values."
  locationIngestTokens: [LocationIngestToken!]!
  "The context of a transfer event: the stored roles, and the evidence for the position of the operator, computed at the read. Null when the event is not a transfer."
