query ProjectList($leftOut: Boolean, $first: Int, $after: String, $browse: ProjectBrowse) {
  projects(leftOut: $leftOut, first: $first, after: $after, browse: $browse) {
    edges {
      cursor
      node {
        id
        slug
        name
        subjectKey
        repositories {
          id
          fullName
          url
          defaultBranch
          private
          archived
          fork
          description
          pushedAt
          leftOut
          gone
        }
        resources {
          id
          kind
          state
          evidence {
            sign
            path
          }
          foundAt
          confirmedAt
        }
        syncedAt
        group {
          id
          name
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
