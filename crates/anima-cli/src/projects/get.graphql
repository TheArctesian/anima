query ProjectGet($slug: String!) {
  project(slug: $slug) {
    id
    slug
    name
    subjectKey
    repositories {
      id
      fullName
      url
      defaultBranch
      private
      archived
      fork
      description
      pushedAt
      leftOut
      gone
    }
    resources {
      id
      kind
      state
      evidence {
        sign
        path
      }
      foundAt
      confirmedAt
    }
    syncedAt
  }
}
