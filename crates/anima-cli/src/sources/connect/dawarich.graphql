# The input holds the API key: the variables derive no Debug (CMD-014).
mutation SourceConnectDawarich($input: DawarichInput!) {
  connectDawarich(input: $input) {
    id
    sourceKey
    label
    instanceKey
    credentialStored
    health
    pausedBy
    lastSyncAt
    lastError
    failureCount
    nextSyncAt
    syncing
    createdAt
  }
}
