# `anima source connect github --state` (K1 githubConnect).
query GithubConnectState {
  githubConnect {
    id
    phase
    startedBy
    startedAt
    expiresAt
    pageUrl
    appId
    appSlug
    ownerLogin
    installUrl
    appSettingsUrl
    failure
    message
    account {
      id
      sourceKey
      label
      instanceKey
      credentialStored
      health
      pausedBy
      lastSyncAt
      lastError
      failureCount
      nextSyncAt
      syncing
      createdAt
    }
  }
}
