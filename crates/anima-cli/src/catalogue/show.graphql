query CatalogueShow($id: String!) {
  catalogueEntry(id: $id) {
    id
    name
    description
    kind
    version
    author
    tags
    iconUrl
    documentationUrl
    marks
    networkPorts {
      port
      protocols
    }
    class
    tier
    origin {
      publisher
      read
    }
    reviewedBy
    reviewedOn
    streams {
      port
      protocols
    }
    optionalParts {
      kind
      path
      on
      needsMachineSetting
    }
    digests
    lastMachineTest
    pinned
    install {
      refusal
      reason
      needsOpenToNetwork
    }
    environmentVariables
    composeFile
  }
}
