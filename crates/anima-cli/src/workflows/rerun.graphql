mutation WorkflowRunRerun($repository: ID!, $runId: ID!, $expectedHeadSha: String!) {
  rerunWorkflowRun(repository: $repository, runId: $runId, expectedHeadSha: $expectedHeadSha) {
    repository
    id
    workflowId
    name
    runNumber
    attempt
    event
    status
    conclusion
    branch
    headSha
    commitTitle
    url
  }
}
