query AuditList($first: Int, $after: String, $actorKind: ActorKind) {
  audit(first: $first, after: $after, actorKind: $actorKind) {
    edges {
      cursor
      node {
        id
        at
        operatorName
        action
        targetType
        targetId
        clientAddr
        change
        actorKind
        tokenKind
        apiKeyName
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
