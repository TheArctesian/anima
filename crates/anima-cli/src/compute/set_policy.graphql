mutation SetDevicePolicy($deviceId: ID!, $input: DevicePolicyInput!) {
  setDevicePolicy(deviceId: $deviceId, input: $input) {
    device {
      id
      name
    }
    memorySharePercent
    diskSharePercent
    quietHours {
      start
      end
      timeZone
    }
    mainsOnly
    idleOnly
    isDefault
    takesModelWork
    stopReason
  }
}
