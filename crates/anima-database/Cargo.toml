[package]
name = "anima-database"
description = "The PostgreSQL that the desktop application carries: its folders, its server and its roles (DB-001 to DB-003, OR-6)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom.workspace = true
# The shutdown signal to the server, as the hub and the desktop shell send theirs.
nix = { version = "0.31", default-features = false, features = ["fs", "signal", "user"] }
# The roles step signs in over the socket. No TLS: the server has no network listener.
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
static_assertions.workspace = true
tempfile.workspace = true
