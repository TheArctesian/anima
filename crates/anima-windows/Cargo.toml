[package]
name = "anima-windows"
description = "Native Windows file access and operating-system boundaries for Anima (WIN2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

uuid.workspace = true
winreg = "0.56"
uds_windows = "1.1"
tokio = { workspace = true, features = ["net", "io-util", "signal"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
mod_module_files = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
