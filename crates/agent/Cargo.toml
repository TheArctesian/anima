[package]
name = "anima-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "anima_agent"

[[bin]]
name = "anima-agent"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core" }
bytes.workspace = true
chrono.workspace = true
# The spread of the retry wait (K8 Section 7) comes from the OS random source.
getrandom.workspace = true
# Plain `rustls-tls` (web PKI roots, no OpenSSL); no `cookies`, no `json`, no proxy support is
# used: the client turns the proxy off (MET-020, K8 Section 1).
reqwest.workspace = true
# `enrol -` reads the code with echo off when stdin is a terminal.
rpassword.workspace = true
# `install` reads a folder's POSIX ACL (an xattr) and opens the system token with
# O_NOFOLLOW | O_NONBLOCK | O_NOCTTY (MET-019). Safe wrappers: the workspace forbids `unsafe`, so
# raw `libc` calls are out. Already in Cargo.lock through tempfile.
rustix = { version = "1.1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# `process` runs the fixed read-only commands, `signal` ends the agent on SIGTERM, `fs` reads /proc.
tokio = { workspace = true, features = ["process", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

# The macOS Keychain holds the agent token (MET-013). Linux uses a 0600 file and never builds this.
[target.'cfg(target_os = "macos")'.dependencies]
keyring.workspace = true

[dev-dependencies]
agent-core = { path = "../agent-core", features = ["test-support"] }
axum.workspace = true
plist.workspace = true
