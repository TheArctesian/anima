services:
  heimdall:
    image: lscr.io/linuxserver/heimdall@sha256:47f70751f900be4499017a48c01206c02ab9d18f34a580c6213a13d24cdc1a4a
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    ports:
      - target: 80
        published: 8081
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 443
        published: 8445
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: config
        target: /config
volumes:
  config:
