services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      WEBUI_PORT: ${WEBUI_PORT}
      TORRENTING_PORT: ${TORRENTING_PORT}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    ports:
      - target: 8080
        published: 8082
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 6881
        published: 6881
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 6881
        published: 6881
        host_ip: 127.0.0.1
        protocol: udp
    volumes:
      - type: volume
        source: config
        target: /config
      - type: volume
        source: downloads
        target: /downloads
volumes:
  config:
  downloads:
