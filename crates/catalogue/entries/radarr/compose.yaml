services:
  radarr:
    image: lscr.io/linuxserver/radarr@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    ports:
      - target: 7878
        published: 7878
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: config
        target: /config
      - type: volume
        source: movies
        target: /movies
      - type: volume
        source: downloads
        target: /downloads
volumes:
  config:
  movies:
  downloads:
