services:
  freshrss:
    image: lscr.io/linuxserver/freshrss@sha256:2a7656d689b115cf5ade58b9dac1de5692df8e89fe92d77cc7f32b3d11622950
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    ports:
      - target: 80
        published: 8080
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: config
        target: /config
volumes:
  config:
