services:
  code-server:
    image: lscr.io/linuxserver/code-server@sha256:20ffca4512fcfc85dcd5612fb769233c1553192392d2ec417f0859135805f40c
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      PASSWORD: ${PASSWORD}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    ports:
      - target: 8443
        published: 8444
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: config
        target: /config
volumes:
  config:
