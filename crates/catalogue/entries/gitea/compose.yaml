services:
  gitea:
    image: gitea/gitea@sha256:aa90e8f00b755b0d665214ab9c14447ea44d3190dbe6b6d0cb46cd9c4f55d309
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    ports:
      - target: 3000
        published: 3002
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 22
        published: 2222
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: gitea
        target: /data
volumes:
  gitea:
