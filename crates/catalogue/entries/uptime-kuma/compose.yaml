services:
  uptime-kuma:
    image: louislam/uptime-kuma@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
    restart: unless-stopped
    ports:
      - target: 3001
        published: ${KUMA_PORT:-3001}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: kuma
        target: /app/data
volumes:
  kuma:
