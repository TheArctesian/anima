[package]
name = "anima-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `events/process_log/echoes.rs` matches async-graphql 7.2's message prefixes (syntax,
# argument value, coercion, unknown operation); its tests pin them and fail on drift.
async-graphql.workspace = true
async-graphql-axum.workspace = true
axum = { workspace = true, features = ["ws"] }
thiserror.workspace = true
# `signal`: the hub ends its sessions on SIGTERM or Ctrl-C before it stops (R-040).
tokio = { workspace = true, features = ["time", "io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde.workspace = true
sqlx.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
ipnet.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
sha2.workspace = true
base64.workspace = true
surge-ping.workspace = true
hickory-resolver.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
rand.workspace = true
ring.workspace = true
rustls-pki-types.workspace = true
argon2.workspace = true
getrandom.workspace = true
rpassword.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# The WebSocket errors axum wraps, to tell an oversize or non-UTF-8 message from a lost
# client (R-039). Same semver range as axum's own, so the lockfile keeps one copy.
tungstenite = { version = "0.29", default-features = false }
agent-core = { path = "../agent-core" }
guac-protocol = { path = "../guac-protocol" }
russh.workspace = true
russh-sftp.workspace = true
hmac.workspace = true
aes = { version = "0.9.4", features = ["zeroize"] }
sha1.workspace = true
subtle.workspace = true
hyper.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
lettre.workspace = true
# The updater key the hub signs each published updater file with, and the check of that
# signature by the updater's own verifier (R-117, BLD-045, BLD-046, BLD-064).
updater-signature = { path = "../updater-signature" }
# Sources (K-E1): the types the engine and the providers share, the GitHub declaration the
# wiring registers, and the boxed futures of the `Intake` trait object.
source-exchange = { path = "../providers/exchange" }
provider-github = { path = "../providers/github" }
async-trait = "0.1"

[features]
# `access::Identity::for_tests`, for integration tests of guarded domains (D-6). Turned on
# only by the dev-dependency below, so it is in `cargo test` builds and never in
# `cargo build --release --bin anima-hub`.
test-support = []

# `process`: prctl(PR_SET_DUMPABLE, 0) keeps the hub's keys out of core dumps (WP-36 D-45).
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process"] }

[dev-dependencies]
agent-core = { path = "../agent-core", features = ["test-support"] }
anima-hub = { path = ".", features = ["test-support"] }
http-body-util.workspace = true
tower.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
proptest = "1.12"
# The reference minisign implementation makes the test updater keys and checks the hub's
# signatures (BLD-045, BLD-064), so the hub is proved against it and not only against itself.
minisign = "0.10"
rcgen.workspace = true
# Makes the throwaway RSA App keys of the sources tests in the test itself; never a key file.
rsa = { version = "0.9", features = ["getrandom"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
