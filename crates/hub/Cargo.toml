[package]
name = "anima-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `events/process_log/echoes.rs` matches async-graphql 7.2's message prefixes (syntax,
# argument value, coercion, unknown operation); its tests pin them and fail on drift.
async-graphql.workspace = true
async-graphql-axum.workspace = true
axum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde.workspace = true
sqlx.workspace = true
chrono.workspace = true
ipnet.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
sha2.workspace = true
base64.workspace = true
argon2.workspace = true
getrandom.workspace = true
rpassword.workspace = true

[features]
# `access::Identity::for_tests`, for integration tests of guarded domains (D-6). Turned on
# only by the dev-dependency below, so it is in `cargo test` builds and never in
# `cargo build --release --bin anima-hub`.
test-support = []

[dev-dependencies]
anima-hub = { path = ".", features = ["test-support"] }
http-body-util.workspace = true
tower.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
