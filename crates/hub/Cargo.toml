[package]
name = "anima-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-graphql.workspace = true
async-graphql-axum.workspace = true
axum = { workspace = true, features = ["ws"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde.workspace = true
sqlx.workspace = true
chrono.workspace = true
ipnet.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
sha2.workspace = true
base64.workspace = true
argon2.workspace = true
getrandom.workspace = true
rpassword.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# The WebSocket errors axum wraps, to tell an oversize or non-UTF-8 message from a lost
# client (R-039). Same semver range as axum's own, so the lockfile keeps one copy.
tungstenite = { version = "0.29", default-features = false }
guac-protocol = { path = "../guac-protocol" }
anima-theme = { path = "../theme" }
russh.workspace = true

[features]
# `access::Identity::for_tests`, for integration tests of guarded domains (D-6). Turned on
# only by the dev-dependency below; never in a release build.
test-support = []

[dev-dependencies]
anima-hub = { path = ".", features = ["test-support"] }
http-body-util.workspace = true
tower.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
proptest = "1.12"
tokio-tungstenite = "0.29"
# ECDSA host keys for the in-process SSH server of the connection test (WP-10 T3).
rand = "0.10"
