[package]
name = "anima-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `events/process_log/echoes.rs` matches async-graphql 7.2's message prefixes (syntax,
# argument value, coercion, unknown operation); its tests pin them and fail on drift.
async-graphql.workspace = true
async-graphql-axum.workspace = true
axum = { workspace = true, features = ["ws"] }
thiserror.workspace = true
# `signal`: the hub ends its sessions on SIGTERM or Ctrl-C before it stops (R-040).
tokio = { workspace = true, features = ["time", "io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde.workspace = true
sqlx.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
ipnet.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
sha2.workspace = true
base64.workspace = true
surge-ping.workspace = true
hickory-resolver.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
rand.workspace = true
argon2.workspace = true
getrandom.workspace = true
rpassword.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# The WebSocket errors axum wraps, to tell an oversize or non-UTF-8 message from a lost
# client (R-039). Same semver range as axum's own, so the lockfile keeps one copy.
tungstenite = { version = "0.29", default-features = false }
guac-protocol = { path = "../guac-protocol" }
anima-theme = { path = "../theme" }
russh.workspace = true
hmac.workspace = true
sha1.workspace = true
subtle.workspace = true
hyper.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[features]
# `access::Identity::for_tests`, for integration tests of guarded domains (D-6). Turned on
# only by the dev-dependency below, so it is in `cargo test` builds and never in
# `cargo build --release --bin anima-hub`.
test-support = []

[dev-dependencies]
anima-hub = { path = ".", features = ["test-support"] }
http-body-util.workspace = true
tower.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
proptest = "1.12"
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
