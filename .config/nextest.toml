# cargo-nextest settings for gate 3 (WP-55, R-112). Same tests as `cargo test`, one process each.

[profile.default]
# `anima-desktop::pinning` is not libtest (`harness = false`: Tauri's event loop must own the main
# thread), so nextest cannot list it. Gate 5 runs it with `cargo test --workspace --test pinning`.
default-filter = "not binary_id(anima-desktop::pinning)"
# No retries: a test that passes only on a second try is a failure (a retry would hide a flake).
retries = 0
# Stop starting tests after the first failure, as `cargo test` stops after the first failing binary.
fail-fast = true

# Each of these tests runs a PostgreSQL server of its own (one-click plan S3 and S4). macOS has 32
# System V shared-memory segments for the whole computer and each server takes one, so with
# every test at once `initdb` and `postgres` fail with "No space left on device".
[test-groups]
bundled-postgres = { max-threads = 4 }

[[profile.default.overrides]]
# The modules named here are pure or touch files only; they start no server.
filter = "(package(anima-database) & not test(/^(layout|password|urls|owner_only)::/)) | (package(anima-hub) & test(listening::bundled)) | (package(anima-local-hub) & binary(it))"
test-group = "bundled-postgres"
