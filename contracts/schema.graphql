"""
On update, a secret field that is null keeps the stored value; an empty string clears it where it is optional.
When the target changes (webhook origin, ntfy server, email host or port, Apprise server), every stored secret must
be sent again or cleared, or the update is VALIDATION. `headers`: null keeps, [] removes all, a list replaces all.
The kind of a channel never changes. URLs and servers are https only; a server is an origin only (CR-14).
"""
input WebhookSettingsInput {
  url: String
  method: WebhookMethod = POST
  headers: [HttpHeaderInput!]
}

input NtfySettingsInput {
  server: String = "https://ntfy.sh"
  topic: String
  token: String
  priority: Int = 3
}

input EmailSettingsInput {
  host: String!
  port: Int = 587
  security: SmtpSecurity = STARTTLS
  username: String
  password: String
  from: String!
  to: [String!]!
}

input AppriseSettingsInput {
  server: String!
  mode: AppriseMode = STATELESS_URLS
  urls: [String!]
  key: String
  tags: [String!] = []
}

input ChannelSettingsInput @oneOf {
  webhook: WebhookSettingsInput
  ntfy: NtfySettingsInput
  email: EmailSettingsInput
  apprise: AppriseSettingsInput
}

input NotificationTemplateInput {
  title: String!
  body: String!
}

input NotificationChannelInput {
  name: String!
  onByDefault: Boolean = false
  settings: ChannelSettingsInput!
  "Null: the default template."
  template: NotificationTemplateInput
}

input CheckNotificationsInput {
  channelIds: [ID!]!
  "Send again after each N Down heartbeats, 0..1000; 0: never (NOT-005)."
  resendEveryBeats: Int = 0
}

input NotificationSettingsInput {
  "Days 1..365, in any order; at most 5 once duplicates are removed; stored largest first (NOT-006, D-22)."
  certificateDays: [Int!]!
  template: NotificationTemplateInput!
}

# ---------------------------------------------------------------- retention (WP-46)
# HUB-005, D-25.

enum RetentionSubject {
  HEARTBEATS
  METRICS
  EVENTS
  RECORDINGS
  DELIVERIES
}

type RetentionPeriod {
  subject: RetentionSubject!
  days: Int!
  minDays: Int!
  maxDays: Int!
  defaultDays: Int!
}

# ---------------------------------------------------------------- sessions (WP-10)

enum Protocol {
  SSH
  RDP
  VNC
}

enum SessionEndReason {
  OPERATOR
  REMOTE_CLOSED
  GATEWAY_ERROR
  AUTH_FAILED
  HOST_KEY_MISMATCH
  "The client sent an instruction that does not decode (GW-011, R-034)."
  PROTOCOL_ERROR
  TIMEOUT
  HUB_SHUTDOWN
  "The RDP certificate differs from the accepted one (D-5)."
  SERVER_CERTIFICATE_MISMATCH
}

type Session {
  id: ID!
  deviceId: ID
  deviceName: String!
  protocol: Protocol!
  operatorName: String!
  startedAt: DateTime!
  endedAt: DateTime
  endReason: SessionEndReason
  # RA-034: which computer holds it
  clientAddr: IpAddr!
  recording: RecordingState! @pending
  "Live sessions only; empty after the end."
  shares: [SessionShare!]!
}

type SessionEdge {
  cursor: String!
  node: Session!
}

type SessionConnection {
  edges: [SessionEdge!]!
  pageInfo: PageInfo!
}

"Single-use ticket for the WebSocket tunnel (API-009). See contracts/tunnel.md."
type SessionTicket {
  sessionId: ID!
  token: String!
  tunnelPath: String!
  expiresAt: DateTime!
  "A Wake-on-LAN packet was sent; the opening waits longer (K4 §1)."
  wakeSent: Boolean!
  "The session is recorded; the client shows the badge (RA-040)."
  recording: Boolean! @pending
}

type WakeResult {
  sentAt: DateTime!
  relayName: String!
}

type SessionChange {
  session: Session!
}

# Phase 3 (WP-47, WP-48). RA-035, RA-040, RA-041.

enum ShareAccess {
  VIEW
  CONTROL
}

enum RecordingState @pending {
  OFF
  ON
  STOPPED
}

enum RecordingFormat @pending {
  GUACAMOLE
  ASCIICAST
}

type SessionShare {
  id: ID!
  sessionId: ID!
  access: ShareAccess!
  maxViewers: Int!
  "Viewers connected now."
  viewers: Int!
  createdAt: DateTime!
  expiresAt: DateTime!
}

type ShareLink {
  share: SessionShare!
  "Shown once: <public origin>/shared#<token>. The token is only in the fragment (D-7)."
  url: String!
}

input ShareInput {
  access: ShareAccess = VIEW
  "5..1440."
  expiresInMinutes: Int = 60
  "1..10."
  maxViewers: Int = 3
}

"What a viewer gets from joinShare. It names no session ID and no operator."
type WatchTicket @pending {
  token: String!
  "/watch"
  tunnelPath: String!
  expiresAt: DateTime!
  protocol: Protocol!
  access: ShareAccess!
  deviceName: String!
  recording: Boolean!
}

type Recording @pending {
  id: ID!
  sessionId: ID!
  deviceId: ID
  deviceName: String!
  protocol: Protocol!
  format: RecordingFormat!
  startedAt: DateTime!
  endedAt: DateTime
  "Bytes of plaintext; Float above 2^31."
  sizeBytes: Float!
  "False when the hub stopped before the last part (K4 §11)."
  complete: Boolean!
  expiresAt: DateTime!
}

type RecordingEdge @pending {
  cursor: String!
  node: Recording!
}

type RecordingConnection @pending {
  edges: [RecordingEdge!]!
  pageInfo: PageInfo!
}

# ---------------------------------------------------------------- web interfaces (WP-30)

enum OpenIn {
  ANIMA_TAB
  SYSTEM_BROWSER
}

type WebInterface {
  id: ID!
  deviceId: ID!
  label: String!
  url: String!
  openIn: OpenIn!
  "Pinned on accept (WEB-008)."
  pinnedFingerprintSha256: String
  pinnedAt: DateTime
}

type WebInterfaceSuggestion {
  checkId: ID!
  url: String!
  label: String!
}

input WebInterfaceInput {
  "Defaults to the URL's host."
  label: String
  url: String!
  openIn: OpenIn = ANIMA_TAB
}

input DisplayInput {
  "Only these values come from the client (GW-012)."
  widthPx: Int!
  heightPx: Int!
  dpi: Int = 96
  timezone: String
}

input StartSessionInput {
  deviceId: ID!
  protocol: Protocol!
  display: DisplayInput!
}

# ---------------------------------------------------------------- builds (WP-36, R-102)

"What a release is built for (BLD-001, BLD-003)."
enum BuildTarget {
  "An AppImage, built on Linux on x86_64."
  LINUX_X86_64
  "An app and a DMG, built on macOS on aarch64."
  DARWIN_UNIVERSAL
}

"Section 3.10.1 says which changes are permitted (BLD-010)."
enum BuildJobState {
  QUEUED
  CLAIMED
  BUILDING
  UPLOADING
  PUBLISHED
  FAILED
  CANCELLED
}

enum BuilderOs {
  LINUX
  MACOS
}

"As Tauri names it."
enum BuilderArch {
  X86_64
  AARCH64
}

type BuilderPlatform {
  os: BuilderOs!
  arch: BuilderArch!
}

input BuilderPlatformInput {
  os: BuilderOs!
  arch: BuilderArch!
}

type Release {
  id: ID!
  version: String!
  "40 lower-case hex digits."
  commit: String!
  createdAt: DateTime!
  "The operator who started it."
  createdBy: String!
  "One job for each selected target."
  jobs: [BuildJob!]!
}

type ReleaseEdge {
  cursor: String!
  node: Release!
}

type ReleaseConnection {
  edges: [ReleaseEdge!]!
  pageInfo: PageInfo!
}

type BuildJob {
  id: ID!
  releaseId: ID!
  target: BuildTarget!
  version: String!
  commit: String!
  state: BuildJobState!
  failureReason: String
  "Leases that ended without a report (BLD-006)."
  attempts: Int!
  builderId: ID
  "The builder that last claimed it."
  builderName: String
  leaseEndsAt: DateTime
  queuedAt: DateTime!
  claimedAt: DateTime
  buildingAt: DateTime
  uploadingAt: DateTime
  publishedAt: DateTime
  failedAt: DateTime
  cancelledAt: DateTime
  "When it entered its current state (BLD-080)."
  stateChangedAt: DateTime!
}

type BuildLogLine {
  sequence: Int!
  "Redacted before it was stored (BLD-049)."
  text: String!
}

type BuildJobUpdate {
  job: BuildJob!
  "The log lines this change added."
  logLines: [BuildLogLine!]!
}

type Builder {
  id: ID!
  name: String!
  platform: BuilderPlatform!
  "The VPN address it enrolled from and must call from (BLD-024)."
  clientAddr: IpAddr!
  enrolledAt: DateTime!
  lastSeenAt: DateTime
  "It called within the last 60 seconds (BLD-007)."
  online: Boolean!
}

type BuilderEnrolment {
  builder: Builder!
  "The builder token, shown once (BLD-023)."
  token: String!
  expiresAt: DateTime!
}

input BuildFileInput {
  name: String!
  "64 hex digits."
  sha256: String!
  "In bytes."
  size: Int!
}

# ---------------------------------------------------------------- root types

type Query {
  me: Operator!

  sites: [Site!]!
  device(id: ID!): Device
  devices(filter: DeviceFilter, sort: DeviceSort = NAME, first: Int = 50, after: String): DeviceConnection!
  tags: [String!]!

  check(id: ID!): Check

  maintenanceWindows: [MaintenanceWindow!]!

  events(filter: EventFilter, first: Int = 100, after: String): EventConnection!
  audit(first: Int = 100, after: String): AuditConnection!

  sessions(deviceId: ID, live: Boolean, first: Int = 50, after: String): SessionConnection!

  # Phase 3
  "Login or browser token only (D-23, R-100)."
  apiKeys: [ApiKey!]!
  checkDefaults: CheckDefaults!
  notificationChannels: [NotificationChannel!]!
  notificationSettings: NotificationSettings!
  deliveries(channelId: ID, first: Int = 50, after: String): DeliveryConnection!
  retention: [RetentionPeriod!]!
  recordings(deviceId: ID, first: Int = 50, after: String): RecordingConnection! @pending

  # Phase 3: builds (WP-36, R-102)
  "Newest first (BLD-080)."
  releases(first: Int = 20, after: String): ReleaseConnection!
  "The highest version published or under way with the patch plus 1; null before the first."
  nextReleaseVersion: String
  builders: [Builder!]!
  "Up to `first` (1 to 1000) stored lines after sequence `after`, oldest first (BLD-048)."
  buildJobLog(id: ID!, after: Int, first: Int = 500): [BuildLogLine!]!
}

type Mutation {
  login(input: LoginInput!): AuthPayload!
  "Login or browser token only (D-23, R-100)."
  logout: Boolean!

  createSite(name: String!, subnet: Cidr!): Site!
  createDevice(input: CreateDeviceInput!): Device!
  "Login or browser token only (D-23, R-100)."
  updateDevice(id: ID!, input: UpdateDeviceInput!): Device!
  "Deletes credentials, checks, heartbeats and metrics too (DEV-015). Returns the deleted ID. Login or browser token only (D-23, R-100)."
  deleteDevice(id: ID!): ID!
  "Login or browser token only (D-23, R-100)."
  setSshCredential(deviceId: ID!, credential: SshCredentialInput!): SshSettings!
  "Login or browser token only (D-23, R-100)."
  clearSshCredential(deviceId: ID!): SshSettings!
  testConnection(input: ConnectionTestInput!): ConnectionTestResult!
  "The fingerprint must equal the one the hub saw, or the hub returns CONFLICT. Login or browser token only (D-23, R-100)."
  acceptHostKey(deviceId: ID!, fingerprintSha256: String!): HostKey!

  createCheck(input: CreateCheckInput!): Check!
  updateCheck(id: ID!, input: UpdateCheckInput!): Check!
  deleteCheck(id: ID!): ID!
  setCheckPaused(id: ID!, paused: Boolean!): Check!

  createMaintenanceWindow(input: MaintenanceWindowInput!): MaintenanceWindow!
  updateMaintenanceWindow(id: ID!, input: MaintenanceWindowInput!): MaintenanceWindow!
  deleteMaintenanceWindow(id: ID!): ID!
  setManualWindowActive(id: ID!, active: Boolean!): MaintenanceWindow!

  "Login or browser token only (D-23, R-100)."
  startSession(input: StartSessionInput!): SessionTicket!
  endSession(id: ID!): Session!

  setSiteWakeRelay(siteId: ID!, deviceId: ID): Site!
  "Login or browser token only (D-23, R-100)."
  setRdpCredential(deviceId: ID!, credential: PasswordCredentialInput!): RdpSettings!
  "Login or browser token only (D-23, R-100)."
  clearRdpCredential(deviceId: ID!): RdpSettings!
  "Login or browser token only (D-23, R-100)."
  setVncCredential(deviceId: ID!, credential: PasswordCredentialInput!): VncSettings!
  "Login or browser token only (D-23, R-100)."
  clearVncCredential(deviceId: ID!): VncSettings!
  "The fingerprint must equal the one the hub saw, or CONFLICT. Login or browser token only (D-23, R-100)."
  acceptServerCertificate(deviceId: ID!, fingerprintSha256: String!): ServerCertificate!
  "A ticket for the files tunnel of a live SSH session (K4 §9). Login or browser token only (D-23, R-100)."
  openFiles(sessionId: ID!): SessionTicket!
  wakeDevice(deviceId: ID!): WakeResult!
  createWebInterface(deviceId: ID!, input: WebInterfaceInput!): WebInterface!
  updateWebInterface(id: ID!, input: WebInterfaceInput!): WebInterface!
  deleteWebInterface(id: ID!): ID!
  acceptWebInterfaceSuggestion(checkId: ID!): WebInterface!
  dismissWebInterfaceSuggestion(checkId: ID!): ID!
  "Pins the certificate and writes an audit entry (WEB-008, WEB-009). Login or browser token only (D-23, R-100)."
  acceptWebCertificate(id: ID!, fingerprintSha256: String!): WebInterface!

  # Phase 3
  "Signed out (D-4), or a login or browser token; never an API key (D-23, R-100). Sets the __Host-anima cookie; refused unless Origin is the public origin."
  signInBrowser(input: LoginInput!): BrowserSignIn!
  "Login or browser token only (D-23, R-100)."
  createApiKey(input: ApiKeyInput!): ApiKeyCreated!
  "Login or browser token only (D-23, R-100)."
  revokeApiKey(id: ID!): ID!
  "Login or browser token only (INT-003, D-23, R-100). A new code makes the device's earlier unused codes useless."
  enrolAgent(deviceId: ID!): AgentEnrolment!
  "Login or browser token only (D-23, R-100). The source stays AGENT, shown as stale, until the operator changes it (R-092 D-7)."
  revokeAgentToken(deviceId: ID!): Device!

  setCheckDefaults(input: CheckDefaultsInput!): CheckDefaults!

  createNotificationChannel(input: NotificationChannelInput!): NotificationChannel!
  updateNotificationChannel(id: ID!, input: NotificationChannelInput!): NotificationChannel!
  deleteNotificationChannel(id: ID!): ID!
  "Sends at once and waits at most 8 seconds (NOT-004)."
  sendTestNotification(id: ID!): Delivery!
  setCheckNotifications(checkId: ID!, input: CheckNotificationsInput!): CheckNotifications!
  setNotificationSettings(input: NotificationSettingsInput!): NotificationSettings!

  "Login or browser token only (D-23, R-100)."
  setRetention(subject: RetentionSubject!, days: Int!): RetentionPeriod!

  "The session must be live and the caller's (RA-035). Login or browser token only (D-23, R-100)."
  shareSession(sessionId: ID!, input: ShareInput!): ShareLink!
  endShare(id: ID!): ID!
  "Signed out (D-7), or a login or browser token; never an API key (D-23, R-100). Failed attempts count in the login throttle by client address."
  joinShare(token: String!, name: String, display: DisplayInput!): WatchTicket! @pending
  "A ticket for the playback tunnel (K4 §12). Login or browser token only (D-23, R-100)."
  openRecording(id: ID!): SessionTicket! @pending
  "Deletes the key first, then the file (D-13). Login or browser token only (D-23, R-100)."
  deleteRecording(id: ID!): ID! @pending

  # Phase 3: builds (WP-36, R-102)
  "One queued job for each target; VALIDATION for a version that is not new (BLD-001, BLD-002). Login or browser token only (D-23, R-102)."
  createRelease(version: String!, commit: String!, targets: [BuildTarget!]!): Release!
  "Only a QUEUED job; CONFLICT otherwise (BLD-008). Login or browser token only (D-23, R-102)."
  cancelBuildJob(id: ID!): BuildJob!
  "Records the builder at the request's address; returns its token once (BLD-023, D-1). Login or browser token only (D-23, R-102)."
  enrolBuilder(name: String!, platform: BuilderPlatformInput!): BuilderEnrolment!
  "Deletes the builder and revokes its token (BLD-025). Returns the ID. Login or browser token only (D-23, R-102)."
  revokeBuilder(id: ID!): ID!

  "Builder token only (D-1). Null when no job waits or the builder holds a lease (BLD-004, BLD-029)."
  claimBuildJob(platform: BuilderPlatformInput!): BuildJob
  "Builder token only; the lease holder only. Extends the lease (BLD-005, BLD-010, BLD-048)."
  reportBuildJob(id: ID!, state: BuildJobState, logLines: [String!]!, failureReason: String): BuildJob!
  "Builder token only. The job stays UPLOADING until the hub publishes it (BLD-063, D-5)."
  reportBuildUploaded(id: ID!, files: [BuildFileInput!]!, feed: String!): BuildJob!
}

type Subscription {
  deviceStatusChanged(deviceId: ID): DeviceStatusChange!
  heartbeatAdded(checkId: ID, deviceId: ID): HeartbeatAdded!
  eventAdded(minSeverity: Severity = INFO): Event!
  "Every start and end of a session, from every client (RA-034)."
  sessionChanged: SessionChange!
  metricsAdded(deviceId: ID): MetricsAdded!
  "Every change to a build job, with the log lines it added (BLD-081)."
  buildJobUpdated(jobId: ID): BuildJobUpdate!
}

type DeviceStatusChange {
  deviceId: ID!
  status: Status!
  at: DateTime!
}

type HeartbeatAdded {
  checkId: ID!
  deviceId: ID!
  heartbeat: Heartbeat!
}
