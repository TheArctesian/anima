# K1 — GraphQL schema
#
# Status: frozen for Phase 3 (change only through a programme ruling, CON-001).
# The client generates its TypeScript types from this file (API-008, R-020).
# CON-002 (crates/hub/tests/it/contract.rs) keeps the hub's schema equal to it.
# An addition marked @pending is ignored until the hub declares it; then the
# programme orchestrator removes @pending (P2-002, P3-002, K7 / WP-17 E-2).
# Conventions: contracts/conventions.md.
# Every operation needs a valid token, except `login` and `signInBrowser` (API-003, D-4, R-111).

scalar DateTime # RFC 3339, UTC
scalar IpAddr # "10.10.0.12" or an IPv6 address
scalar Cidr # "10.10.0.0/24"
scalar JSON # only for audit change records

directive @oneOf on INPUT_OBJECT

"A K1 addition that the hub does not serve yet (P2-002, P3-002). CON-002 ignores it only while the hub lacks it."
directive @pending on OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | ENUM_VALUE | UNION | INPUT_OBJECT | INPUT_FIELD_DEFINITION

# ---------------------------------------------------------------- shared

enum Status {
  UP
  DOWN
  DEGRADED
  MAINTENANCE
  UNKNOWN
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

# ---------------------------------------------------------------- access (WP-05)

type Operator {
  id: ID!
  username: String!
  totpEnabled: Boolean!
}

type AuthPayload {
  "Bearer token. The client keeps it in the OS key store (SEC-002)."
  token: String!
  expiresAt: DateTime!
  operator: Operator!
}

input LoginInput {
  username: String!
  password: String!
  totpCode: String
}

# Phase 3 (WP-43). D-3, D-4, D-23.

enum TokenScope {
  READ
  WRITE
}

"Set by signInBrowser together with the __Host-anima cookie. The token itself is never returned (D-3)."
type BrowserSignIn {
  operator: Operator!
  expiresAt: DateTime!
}

# Actor kinds (operator, 2026-11-13, LOG-012 to LOG-020; ruling number to be assigned).

"What an API key is made for: a script that the operator runs, or an AI agent. Set once (LOG-015)."
enum MadeFor {
  USER
  AGENT
}

type ApiKey {
  id: ID!
  "1..64 characters, unique."
  name: String!
  scope: TokenScope!
  "(operator, 2026-11-13, LOG-012 to LOG-020; ruling number to be assigned) It never changes. Each request with an AGENT key is recorded as AGENT (LOG-015, LOG-017)."
  madeFor: MadeFor!
  "The first 12 characters of the secret, for example anima_Ab12Cd, so the operator can tell keys apart."
  prefix: String!
  expiresAt: DateTime!
  createdAt: DateTime!
  lastUsedAt: DateTime
}

type ApiKeyCreated {
  key: ApiKey!
  "Shown once. The hub keeps only its SHA-256 (INT-003, P3-004)."
  secret: String!
}

"Shown once. The hub keeps only its SHA-256; one use, 15 minutes (MET-012, K8)."
type AgentEnrolment {
  code: String!
  expiresAt: DateTime!
}

input ApiKeyInput {
  name: String!
  scope: TokenScope!
  "Required; it cannot change later (operator, 2026-11-13, LOG-012 to LOG-020; ruling number to be assigned) (LOG-015)."
  madeFor: MadeFor!
  "Required; at most one year from now (D-23)."
  expiresAt: DateTime!
}

# ---------------------------------------------------------------- devices (WP-06)

enum OperatingSystem {
  LINUX
  MACOS
  WINDOWS
  OTHER
}

type Site {
  id: ID!
  name: String!
  subnet: Cidr!
  devices(first: Int = 50, after: String): DeviceConnection!
  "The device that sends Wake-on-LAN packets at this site (D-2)."
  wakeRelay: Device
}

"""The VPN as the hub's own VPN node sees it (VPN-005, VPN-008)."""
type VpnPicture {
  "When the hub last read its VPN status."
  readAt: DateTime!
  "False when the last read failed; the picture is then from readAt."
  fresh: Boolean!
  hub: VpnNode!
  "One entry for each site, in site name order (VPN-009)."
  sites: [SitePath!]!
  "Every peer of the hub, in name order. A node that is not a peer of the hub is not here (VPN-011)."
  nodes: [VpnNode!]!
  "Whether the hub can reach the broker that makes keys and approves routes (VP-7)."
  broker: BrokerState!
}

"""A one-use, one-hour pre-auth key, shown once (VPN-001, VPN-003, LOG-007)."""
type VpnKey {
  "The pre-auth key: shown once, never stored by the hub."
  key: String!
  expiresAt: DateTime!
  "The commands for the new computer, in order; none holds the key."
  steps: [String!]!
}

"""A node the broker registered or renewed (vpn.md 6B and Section 7)."""
type VpnRegistration {
  name: String!
  address: IpAddr!
  keyExpiry: DateTime
}

"""Whether the hub can reach the VPN broker on the VPS (VP-7, BD-15)."""
enum BrokerState {
  "ANIMA_VPN_BROKER is not set."
  NOT_SET
  "The socket is not there: the broker is not installed on the VPS."
  NOT_INSTALLED
  READY
  "The last call failed or its reply was unreadable."
  FAILED
}

"""How the hub reaches one site (VPN-009)."""
type SitePath {
  site: Site!
  "The subnet router that serves the site subnet, or null."
  router: VpnNode
  state: SiteRouteState!
  path: VpnPath!
  "The DERP region, when the path is RELAYED."
  relayRegion: String
  "True when the router's device has a Tailscale ping check, which keeps the path known."
  hasPingCheck: Boolean!
  "A router of the site that offers the site subnet and waits for its approval, from the broker; null when none waits or the broker is not READY (BD-16)."
  waitingRouter: VpnNode
}

enum SiteRouteState {
  SERVING
  OFFLINE
  NO_ROUTER
}

enum VpnPath {
  DIRECT
  PEER_RELAY
  RELAYED
  UNKNOWN
}

enum VpnRole {
  HUB
  ROUTER
  AGENT
  CLIENT
  OTHER
}

enum KeyState {
  NEVER
  VALID
  EXPIRING
  EXPIRED
  TAGGED_WITH_EXPIRY
}

"""One node of the VPN. Name and OS come from the node and are cleaned (VPN-008)."""
type VpnNode {
  name: String!
  address: IpAddr!
  os: String!
  role: VpnRole!
  tags: [String!]!
  "The subnet routes Headscale lets this node serve."
  routes: [Cidr!]!
  "The routes the node offers that wait for approval, from the broker (BD-16)."
  waitingRoutes: [Cidr!]!
  online: Boolean!
  lastSeen: DateTime
  keyExpiry: DateTime
  keyState: KeyState!
  path: VpnPath!
  relayRegion: String
  "The Anima device on this node, or null."
  device: Device
  inAnima: Boolean!
}

enum SshAuth {
  PASSWORD
  PRIVATE_KEY
}

type SshSettings {
  enabled: Boolean!
  port: Int!
  username: String!
  auth: SshAuth!
  "True when the hub holds a secret for this device. Secrets are never returned."
  credentialStored: Boolean!
  hostKey: HostKey
}

type HostKey {
  algorithm: String!
  fingerprintSha256: String!
  firstSeenAt: DateTime!
}

enum RdpSecurity {
  ANY
  NLA
  NLA_EXT
  TLS
  VMCONNECT
  RDP
}

enum RdpResizeMethod {
  DISPLAY_UPDATE
  RECONNECT
}

enum MetricsSource {
  NONE
  SSH
  "Set only by enrolment (MET-011, R-092 D-7)."
  AGENT
}

"RA-020. TELNET joins when Telnet exists."
enum AccessWarning {
  IGNORED_CERTIFICATE
  RDP_SECURITY
  UNENCRYPTED_VNC
}

type ServerCertificate {
  fingerprintSha256: String!
  subject: String
  notAfter: DateTime
  firstSeenAt: DateTime!
}

type RdpSettings {
  enabled: Boolean!
  "Default 3389."
  port: Int!
  username: String!
  domain: String
  "Default NLA."
  security: RdpSecurity!
  "Default false."
  ignoreCertificate: Boolean!
  "Default DISPLAY_UPDATE."
  resizeMethod: RdpResizeMethod!
  "Default true."
  audioOut: Boolean!
  "Default false."
  microphone: Boolean!
  "Default false (RA-021)."
  sharedDrive: Boolean!
  credentialStored: Boolean!
  serverCertificate: ServerCertificate
}

type VncSettings {
  enabled: Boolean!
  "Default 5900."
  port: Int!
  "macOS Screen Sharing needs one."
  username: String
  credentialStored: Boolean!
}

"What may leave or enter the device in a session (RA-032, RA-033). All default true."
type TransferPolicy {
  upload: Boolean!
  download: Boolean!
  copy: Boolean!
  paste: Boolean!
}

type Device {
  id: ID!
  site: Site!
  name: String!
  host: String!
  "The host when it is an IP literal; otherwise the address the last check resolved, or null (R-026)."
  ip: IpAddr
  kind: String!
  os: OperatingSystem!
  "The Linux distribution's os-release ID, read over SSH; null until read or when not Linux (DEV-016)."
  distribution: String
  tags: [String!]!
  "Manual maintenance flag (CHK-006). The effective status already includes windows."
  maintenance: Boolean!
  "Worst status of the device's checks (CHK-004)."
  status: Status!
  ssh: SshSettings!
  rdp: RdpSettings!
  vnc: VncSettings!
  "Lower-case aa:bb:cc:dd:ee:ff (RA-031)."
  macAddress: String
  metricsSource: MetricsSource!
  "True when the source is AGENT and no batch came in the last 30 seconds (MET-018)."
  metricsStale: Boolean!
  transfer: TransferPolicy!
  accessWarnings: [AccessWarning!]!
  "Most live sessions at once (RA-036); null: no limit. File tunnels do not count."
  sessionLimit: Int
  # web_interfaces
  webInterfaces: [WebInterface!]!
  # web_interfaces (WEB-002)
  webInterfaceSuggestions: [WebInterfaceSuggestion!]!
  # metrics
  readings: Readings
  # metrics (MET-003, MET-009)
  metrics(range: MetricRange!): [MetricSeries!]!
  # metrics
  gpus: [Gpu!]!
  # metrics (MET-026, MET-029)
  storage: Storage!
  checks: [Check!]!
  "Uptime ratio 0..1 from aggregate tables (CHK-011)."
  uptime(window: UptimeWindow!): Float
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DeviceEdge {
  cursor: String!
  node: Device!
}

type DeviceConnection {
  edges: [DeviceEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Ties and orders (R-044). Names compare in byte order.
NAME: name.
STATUS: worst first in severity order DOWN, DEGRADED, UNKNOWN, MAINTENANCE, UP; then name.
UPTIME: lowest 24 h uptime first, null last; then name.
The client uses the same order when it re-sorts on live changes.
"""
enum DeviceSort {
  NAME
  STATUS
  UPTIME
}

input DeviceFilter {
  status: [Status!]
  tags: [String!]
  "Case-insensitive substring of the name."
  name: String
  siteId: ID
}

input SshSettingsInput {
  enabled: Boolean!
  port: Int = 22
  username: String!
  auth: SshAuth!
}

input RdpSettingsInput {
  enabled: Boolean!
  port: Int = 3389
  username: String!
  domain: String
  security: RdpSecurity = NLA
  ignoreCertificate: Boolean = false
  resizeMethod: RdpResizeMethod = DISPLAY_UPDATE
  audioOut: Boolean = true
  microphone: Boolean = false
  sharedDrive: Boolean = false
}

input VncSettingsInput {
  enabled: Boolean!
  port: Int = 5900
  username: String
}

input TransferPolicyInput {
  upload: Boolean = true
  download: Boolean = true
  copy: Boolean = true
  paste: Boolean = true
}

input PasswordCredentialInput {
  password: String!
}

input CreateDeviceInput {
  siteId: ID!
  name: String!
  host: String!
  kind: String = "server"
  os: OperatingSystem = OTHER
  tags: [String!] = []
  ssh: SshSettingsInput
  rdp: RdpSettingsInput
  vnc: VncSettingsInput
  macAddress: String
  metricsSource: MetricsSource = NONE
  transfer: TransferPolicyInput
  "When true (the default), the hub adds one ICMP check (spec 6.2)."
  addDefaultCheck: Boolean = true
  sessionLimit: Int
}

input UpdateDeviceInput {
  siteId: ID
  name: String
  host: String
  kind: String
  os: OperatingSystem
  tags: [String!]
  maintenance: Boolean
  ssh: SshSettingsInput
  rdp: RdpSettingsInput
  vnc: VncSettingsInput
  "An empty string clears the address."
  macAddress: String
  metricsSource: MetricsSource
  transfer: TransferPolicyInput
  "1..100; 0 clears the limit."
  sessionLimit: Int
}

input SshCredentialInput @oneOf {
  password: String
  privateKey: PrivateKeyInput
}

input PrivateKeyInput {
  key: String!
  passphrase: String
}

type ConnectionTestResult {
  reachable: Boolean!
  authenticated: Boolean!
  "Present when the host key is not yet accepted or has changed (SEC-006, SEC-007)."
  hostKey: HostKey
  hostKeyChanged: Boolean!
  message: String
  serverCertificate: ServerCertificate
  certificateChanged: Boolean!
  "True only when the hub read the RDP server certificate and it equals the accepted pin (CR-3, SEC-007)."
  certificateMatched: Boolean!
}

input ConnectionTestInput {
  "Test a saved device, or test unsaved values from the form (DEV-013)."
  deviceId: ID
  host: String
  ssh: SshSettingsInput
  credential: SshCredentialInput
  protocol: Protocol = SSH
  rdp: RdpSettingsInput
  vnc: VncSettingsInput
  password: PasswordCredentialInput
}

# ---------------------------------------------------------------- checks (WP-09)

"Identifiers are fixed forever (CHK-009)."
enum CheckType {
  ICMP
  TCP
  TLS
  HTTP
  DNS
  PUSH
  GROUP
  DOCKER
  SNMP
  TAILSCALE_PING
  SYSTEMD
  DOMAIN_EXPIRY
}

type Check {
  id: ID!
  device: Device!
  parent: Check
  type: CheckType!
  name: String!
  intervalSeconds: Int!
  retries: Int!
  retryIntervalSeconds: Int!
  degradedThresholdMs: Int!
  invert: Boolean!
  paused: Boolean!
  config: CheckConfig!
  status: Status!
  lastHeartbeat: Heartbeat
  "Days until the TLS certificate expires (CHK-007). Only TLS and HTTPS checks."
  certificateDaysLeft: Int
  "DOMAIN_EXPIRY only: whole days until the registration expires."
  domainDaysLeft: Int
  # notifications (composition, K3)
  notifications: CheckNotifications!
  heartbeats(first: Int = 100, after: String): HeartbeatConnection!
  uptime(window: UptimeWindow!): Float
}

union CheckConfig = IcmpConfig | TcpConfig | TlsConfig | HttpConfig | DnsConfig | PushConfig | GroupConfig | DockerConfig | SnmpConfig | TailscalePingConfig | SystemdConfig | DomainExpiryConfig

"Up when running (and healthy, when a health check exists); Degraded when starting; else Down. Through the SSH link (D-3)."
type DockerConfig {
  container: String!
  timeoutMs: Int!
}

"Up when ActiveState is active. Through the SSH link (D-3)."
type SystemdConfig {
  unit: String!
  timeoutMs: Int!
}

enum SnmpVersion {
  V2C
  V3
}

"Community and v3 passwords are never returned (SEC-005)."
type SnmpConfig {
  port: Int!
  version: SnmpVersion!
  oid: String!
  "Up when equal; null: Up when the OID answers."
  expected: String
  username: String
  timeoutMs: Int!
}

"Disco ping through the LocalAPI proxy (D-4). The target defaults to the device host."
type TailscalePingConfig {
  target: String
  timeoutMs: Int!
}

enum IpVersion {
  V4
  V6
}

type IcmpConfig {
  timeoutMs: Int!
  ipVersion: IpVersion!
}

type TcpConfig {
  port: Int!
  timeoutMs: Int!
}

type TlsConfig {
  port: Int!
  serverName: String
  timeoutMs: Int!
}

enum HttpMethod {
  GET
  HEAD
  POST
  PUT
  PATCH
  DELETE
  OPTIONS
}

type HttpHeader {
  name: String!
  "Values of headers named Authorization or Cookie are never returned."
  value: String
}

type StatusRange {
  from: Int!
  to: Int!
}

enum HttpAuthKind {
  NONE
  BASIC
  BEARER
}

type HttpConfig {
  url: String!
  method: HttpMethod!
  headers: [HttpHeader!]!
  body: String
  maxRedirects: Int!
  acceptedStatus: [StatusRange!]!
  keyword: String
  jsonQuery: String
  jsonExpected: String
  authKind: HttpAuthKind!
  verifyTls: Boolean!
  timeoutMs: Int!
}

enum DnsRecordType {
  A
  AAAA
  CNAME
  MX
  NS
  TXT
  SRV
  PTR
}

type DnsConfig {
  name: String!
  recordType: DnsRecordType!
  resolver: IpAddr
  expected: String
}

type PushConfig {
  "Path on the hub that the device calls. The token is part of the path."
  pushPath: String!
}

type GroupConfig {
  children: [Check!]!
}

"Degraded below warnDays, Down after expiry, Unknown when RDAP gives no expiry date (D-29)."
type DomainExpiryConfig {
  domain: String!
  warnDays: Int!
  timeoutMs: Int!
}

input CheckConfigInput @oneOf {
  icmp: IcmpConfigInput
  tcp: TcpConfigInput
  tls: TlsConfigInput
  http: HttpConfigInput
  dns: DnsConfigInput
  push: Boolean
  group: GroupConfigInput
  docker: DockerConfigInput
  snmp: SnmpConfigInput
  tailscalePing: TailscalePingConfigInput
  systemd: SystemdConfigInput
  domainExpiry: DomainExpiryConfigInput
}

input DockerConfigInput {
  container: String!
  timeoutMs: Int = 10000
}

input SystemdConfigInput {
  unit: String!
  timeoutMs: Int = 10000
}

input SnmpConfigInput {
  port: Int = 161
  version: SnmpVersion = V2C
  oid: String!
  expected: String
  community: String
  username: String
  authPassword: String
  privacyPassword: String
  timeoutMs: Int = 5000
}

input TailscalePingConfigInput {
  target: String
  timeoutMs: Int = 5000
}

# ---------------------------------------------------------------- metrics (WP-28)

enum MetricKind {
  CPU_PERCENT
  MEMORY_PERCENT
  MEMORY_BYTES
  DISK_PERCENT
  DISK_BYTES
  NETWORK_IN_BPS
  NETWORK_OUT_BPS
  UPTIME_SECONDS
  LOAD_1
  LOAD_5
  LOAD_15
  GPU_PERCENT
  VRAM_PERCENT
  VRAM_BYTES
  GPU_TEMPERATURE_C
  GPU_POWER_W
  "Memory in use by a unified-memory GPU (Apple), shown as a number, never a VRAM bar (MET-007, R-092 D-6)."
  GPU_MEMORY_BYTES
  "Bytes read from one drive per second; the label is the drive name (MET-028)."
  DISK_READ_BPS
  "Bytes written to one drive per second; the label is the drive name (MET-028)."
  DISK_WRITE_BPS
  "The share of time one drive had I/O in flight; the label is the drive name (MET-028)."
  DISK_BUSY_PERCENT
}

# MET-003
enum MetricRange {
  HOUR
  DAY
  WEEK
}

enum GpuVendor {
  NVIDIA
  AMD
  INTEL
  APPLE
}

type Gpu {
  index: Int!
  name: String!
  vendor: GpuVendor!
  "False for integrated and Apple GPUs (MET-007)."
  hasVram: Boolean!
}

type MetricPoint {
  at: DateTime!
  value: Float!
  min: Float
  max: Float
}

"Label: mount point, interface name, or 'GPU <index> <name>' (MET-009). Bytes are Float (above 2^31)."
type MetricSeries {
  kind: MetricKind!
  label: String!
  gpuIndex: Int
  points: [MetricPoint!]!
}

"The latest values for the card (MET-004, MET-008). Disk: the fullest mount. VRAM: the GPU with the highest use."
type Readings {
  at: DateTime!
  cpuPercent: Float
  memoryPercent: Float
  diskPercent: Float
  "The mount point of the fullest mount, the one diskPercent is of (MET-030)."
  diskMount: String
  "The device's drives other than the one that holds diskMount, unmounted ones counted; 0 when the hub knows no drives (MET-030, MET-031)."
  otherDrives: Int!
  vramPercent: Float
  vramGpu: Gpu
}

"What a drive is made of, detected from its transport and rotation (MET-027)."
enum DriveKind {
  NVME
  SSD
  HDD
  DISK
}

"A mounted file system and its latest use; a value is null without a sample in the last 2 minutes (MET-029). Bytes are Float."
type Mount {
  path: String!
  usedBytes: Float
  "Used over the percent used; null while nothing is used."
  sizeBytes: Float
  percent: Float
}

"One Storage row: a drive, or a mount on no drive the hub knows (a network file system, every mount on macOS), which has no name, kind or activity (MET-029, MET-031)."
type Drive {
  "The kernel name, for example nvme1n1."
  name: String
  kind: DriveKind
  sizeBytes: Float
  "False for a drive with no mount: the client shows it as Not mounted."
  mounted: Boolean!
  mounts: [Mount!]!
  readBps: Float
  writeBps: Float
  busyPercent: Float
}

"A device's storage, drive by drive, never one total (MET-026)."
type Storage {
  "Mounted drives by name, then mounts on no known drive by path, then unmounted drives by name."
  drives: [Drive!]!
}

type MetricSample {
  kind: MetricKind!
  label: String!
  value: Float!
}

type MetricsAdded {
  deviceId: ID!
  at: DateTime!
  samples: [MetricSample!]!
  readings: Readings!
}


