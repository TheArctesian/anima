type Check {
  id: ID!
  device: Device!
  parent: Check
  type: CheckType!
  name: String!
  intervalSeconds: Int!
  retries: Int!
  retryIntervalSeconds: Int!
  degradedThresholdMs: Int!
  invert: Boolean!
  paused: Boolean!
  config: CheckConfig!
  status: Status!
  lastHeartbeat: Heartbeat
  "Days until the TLS certificate expires (CHK-007). Only TLS and HTTPS checks."
  certificateDaysLeft: Int
  "DOMAIN_EXPIRY only: whole days until the registration expires."
  domainDaysLeft: Int
  # notifications (composition, K3)
  notifications: CheckNotifications! @pending
  heartbeats(first: Int = 100, after: String): HeartbeatConnection!
  uptime(window: UptimeWindow!): Float
}

