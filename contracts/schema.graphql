# K1 — GraphQL schema
#
# Status: frozen for Phase 2 (change only through a programme ruling, CON-001).
# The client generates its TypeScript types from this file (API-008, R-020).
# CON-002 (crates/hub/tests/it/contract.rs) keeps the hub's schema equal to it.
# An addition marked @pending is ignored until the hub declares it; then the
# programme orchestrator removes @pending (P2-002, K7 / WP-17 E-2).
# Conventions: contracts/conventions.md.
# Every operation needs a valid token, except `login` (API-003).

scalar DateTime # RFC 3339, UTC
scalar IpAddr # "10.10.0.12" or an IPv6 address
scalar Cidr # "10.10.0.0/24"
scalar JSON # only for audit change records

directive @oneOf on INPUT_OBJECT

"A K1 addition that the hub does not serve yet (P2-002). CON-002 ignores it only while the hub lacks it."
directive @pending on OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | ENUM_VALUE | UNION | INPUT_OBJECT | INPUT_FIELD_DEFINITION

# ---------------------------------------------------------------- shared

enum Status {
  UP
  DOWN
  DEGRADED
  MAINTENANCE
  UNKNOWN
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

# ---------------------------------------------------------------- access (WP-05)

type Operator {
  id: ID!
  username: String!
  totpEnabled: Boolean!
}

type AuthPayload {
  "Bearer token. The client keeps it in the OS key store (SEC-002)."
  token: String!
  expiresAt: DateTime!
  operator: Operator!
}

input LoginInput {
  username: String!
  password: String!
  totpCode: String
}

# ---------------------------------------------------------------- devices (WP-06)

enum OperatingSystem {
  LINUX
  MACOS
  WINDOWS
  OTHER
}

type Site {
  id: ID!
  name: String!
  subnet: Cidr!
  devices(first: Int = 50, after: String): DeviceConnection!
  "The device that sends Wake-on-LAN packets at this site (D-2)."
  wakeRelay: Device
}

enum SshAuth {
  PASSWORD
  PRIVATE_KEY
}

type SshSettings {
  enabled: Boolean!
  port: Int!
  username: String!
  auth: SshAuth!
  "True when the hub holds a secret for this device. Secrets are never returned."
  credentialStored: Boolean!
  hostKey: HostKey
}

type HostKey {
  algorithm: String!
  fingerprintSha256: String!
  firstSeenAt: DateTime!
}

enum RdpSecurity {
  ANY
  NLA
  NLA_EXT
  TLS
  VMCONNECT
  RDP
}

enum RdpResizeMethod {
  DISPLAY_UPDATE
  RECONNECT
}

# PROXMOX joins in Phase 4
enum MetricsSource {
  NONE
  SSH
}

"RA-020. TELNET joins when Telnet exists."
enum AccessWarning {
  IGNORED_CERTIFICATE
  RDP_SECURITY
  UNENCRYPTED_VNC
}

type ServerCertificate @pending {
  fingerprintSha256: String!
  subject: String
  notAfter: DateTime
  firstSeenAt: DateTime!
}

type RdpSettings {
  enabled: Boolean!
  "Default 3389."
  port: Int!
  username: String!
  domain: String
  "Default NLA."
  security: RdpSecurity!
  "Default false."
  ignoreCertificate: Boolean!
  "Default DISPLAY_UPDATE."
  resizeMethod: RdpResizeMethod!
  "Default true."
  audioOut: Boolean!
  "Default false."
  microphone: Boolean!
  "Default false (RA-021)."
  sharedDrive: Boolean!
  credentialStored: Boolean!
  serverCertificate: ServerCertificate @pending
}

type VncSettings {
  enabled: Boolean!
  "Default 5900."
  port: Int!
  "macOS Screen Sharing needs one."
  username: String
  credentialStored: Boolean!
}

"What may leave or enter the device in a session (RA-032, RA-033). All default true."
type TransferPolicy {
  upload: Boolean!
  download: Boolean!
  copy: Boolean!
  paste: Boolean!
}

type Device {
  id: ID!
  site: Site!
  name: String!
  host: String!
  "The host when it is an IP literal; otherwise the address the last check resolved, or null (R-026)."
  ip: IpAddr
  kind: String!
  os: OperatingSystem!
  tags: [String!]!
  "Manual maintenance flag (CHK-006). The effective status already includes windows."
  maintenance: Boolean!
  "Worst status of the device's checks (CHK-004)."
  status: Status!
  ssh: SshSettings!
  rdp: RdpSettings!
  vnc: VncSettings!
  "Lower-case aa:bb:cc:dd:ee:ff (RA-031)."
  macAddress: String
  metricsSource: MetricsSource!
  transfer: TransferPolicy!
  accessWarnings: [AccessWarning!]!
  # web_interfaces
  webInterfaces: [WebInterface!]!
  # web_interfaces (WEB-002)
  webInterfaceSuggestions: [WebInterfaceSuggestion!]!
  # metrics
  readings: Readings @pending
  # metrics (MET-003, MET-009)
  metrics(range: MetricRange!): [MetricSeries!]! @pending
  # metrics
  gpus: [Gpu!]! @pending
  checks: [Check!]!
  "Uptime ratio 0..1 from aggregate tables (CHK-011)."
  uptime(window: UptimeWindow!): Float
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DeviceEdge {
  cursor: String!
  node: Device!
}

type DeviceConnection {
  edges: [DeviceEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Ties and orders (R-044). Names compare in byte order.
NAME: name.
STATUS: worst first in severity order DOWN, DEGRADED, UNKNOWN, MAINTENANCE, UP; then name.
UPTIME: lowest 24 h uptime first, null last; then name.
The client uses the same order when it re-sorts on live changes.
"""
enum DeviceSort {
  NAME
  STATUS
  UPTIME
}

input DeviceFilter {
  status: [Status!]
  tags: [String!]
  "Case-insensitive substring of the name."
  name: String
  siteId: ID
}

input SshSettingsInput {
  enabled: Boolean!
  port: Int = 22
  username: String!
  auth: SshAuth!
}

input RdpSettingsInput {
  enabled: Boolean!
  port: Int = 3389
  username: String!
  domain: String
  security: RdpSecurity = NLA
  ignoreCertificate: Boolean = false
  resizeMethod: RdpResizeMethod = DISPLAY_UPDATE
  audioOut: Boolean = true
  microphone: Boolean = false
  sharedDrive: Boolean = false
}

input VncSettingsInput {
  enabled: Boolean!
  port: Int = 5900
  username: String
}

input TransferPolicyInput {
  upload: Boolean = true
  download: Boolean = true
  copy: Boolean = true
  paste: Boolean = true
}

input PasswordCredentialInput {
  password: String!
}

input CreateDeviceInput {
  siteId: ID!
  name: String!
  host: String!
  kind: String = "server"
  os: OperatingSystem = OTHER
  tags: [String!] = []
  ssh: SshSettingsInput
  rdp: RdpSettingsInput
  vnc: VncSettingsInput
  macAddress: String
  metricsSource: MetricsSource = NONE
  transfer: TransferPolicyInput
  "When true (the default), the hub adds one ICMP check (spec 6.2)."
  addDefaultCheck: Boolean = true
}

input UpdateDeviceInput {
  siteId: ID
  name: String
  host: String
  kind: String
  os: OperatingSystem
  tags: [String!]
  maintenance: Boolean
  ssh: SshSettingsInput
  rdp: RdpSettingsInput
  vnc: VncSettingsInput
  "An empty string clears the address."
  macAddress: String
  metricsSource: MetricsSource
  transfer: TransferPolicyInput
}

input SshCredentialInput @oneOf {
  password: String
  privateKey: PrivateKeyInput
}

input PrivateKeyInput {
  key: String!
  passphrase: String
}

type ConnectionTestResult {
  reachable: Boolean!
  authenticated: Boolean!
  "Present when the host key is not yet accepted or has changed (SEC-006, SEC-007)."
  hostKey: HostKey
  hostKeyChanged: Boolean!
  message: String
  serverCertificate: ServerCertificate @pending
  certificateChanged: Boolean! @pending
}

input ConnectionTestInput {
  "Test a saved device, or test unsaved values from the form (DEV-013)."
  deviceId: ID
  host: String
  ssh: SshSettingsInput
  credential: SshCredentialInput
  protocol: Protocol = SSH @pending
  rdp: RdpSettingsInput @pending
  vnc: VncSettingsInput @pending
  password: PasswordCredentialInput @pending
}

# ---------------------------------------------------------------- checks (WP-09)

"Identifiers are fixed forever (CHK-009)."
enum CheckType {
  ICMP
  TCP
  TLS
  HTTP
  DNS
  PUSH
  GROUP
  DOCKER @pending
  SNMP @pending
  TAILSCALE_PING @pending
  SYSTEMD @pending
}

type Check {
  id: ID!
  device: Device!
  parent: Check
  type: CheckType!
  name: String!
  intervalSeconds: Int!
  retries: Int!
  retryIntervalSeconds: Int!
  degradedThresholdMs: Int!
  invert: Boolean!
  paused: Boolean!
  config: CheckConfig!
  status: Status!
  lastHeartbeat: Heartbeat
  "Days until the TLS certificate expires (CHK-007). Only TLS and HTTPS checks."
  certificateDaysLeft: Int
  heartbeats(first: Int = 100, after: String): HeartbeatConnection!
  uptime(window: UptimeWindow!): Float
}

union CheckConfig = IcmpConfig | TcpConfig | TlsConfig | HttpConfig | DnsConfig | PushConfig | GroupConfig | DockerConfig | SnmpConfig | TailscalePingConfig | SystemdConfig

"Up when running (and healthy, when a health check exists); Degraded when starting; else Down. Through the SSH link (D-3)."
type DockerConfig @pending {
  container: String!
  timeoutMs: Int!
}

"Up when ActiveState is active. Through the SSH link (D-3)."
type SystemdConfig @pending {
  unit: String!
  timeoutMs: Int!
}

enum SnmpVersion @pending {
  V2C
  V3
}

"Community and v3 passwords are never returned (SEC-005)."
type SnmpConfig @pending {
  port: Int!
  version: SnmpVersion!
  oid: String!
  "Up when equal; null: Up when the OID answers."
  expected: String
  username: String
  timeoutMs: Int!
}

"Disco ping through the LocalAPI proxy (D-4). The target defaults to the device host."
type TailscalePingConfig @pending {
  target: String
  timeoutMs: Int!
}

enum IpVersion {
  V4
  V6
}

type IcmpConfig {
  timeoutMs: Int!
  ipVersion: IpVersion!
}

type TcpConfig {
  port: Int!
  timeoutMs: Int!
}

type TlsConfig {
  port: Int!
  serverName: String
  timeoutMs: Int!
}

enum HttpMethod {
  GET
  HEAD
  POST
  PUT
  PATCH
  DELETE
  OPTIONS
}

type HttpHeader {
  name: String!
  "Values of headers named Authorization or Cookie are never returned."
  value: String
}

type StatusRange {
  from: Int!
  to: Int!
}

enum HttpAuthKind {
  NONE
  BASIC
  BEARER
}

type HttpConfig {
  url: String!
  method: HttpMethod!
  headers: [HttpHeader!]!
  body: String
  maxRedirects: Int!
  acceptedStatus: [StatusRange!]!
  keyword: String
  jsonQuery: String
  jsonExpected: String
  authKind: HttpAuthKind!
  verifyTls: Boolean!
  timeoutMs: Int!
}

enum DnsRecordType {
  A
  AAAA
  CNAME
  MX
  NS
  TXT
  SRV
  PTR
}

type DnsConfig {
  name: String!
  recordType: DnsRecordType!
  resolver: IpAddr
  expected: String
}

type PushConfig {
  "Path on the hub that the device calls. The token is part of the path."
  pushPath: String!
}

type GroupConfig {
  children: [Check!]!
}

input CheckConfigInput @oneOf {
  icmp: IcmpConfigInput
  tcp: TcpConfigInput
  tls: TlsConfigInput
  http: HttpConfigInput
  dns: DnsConfigInput
  push: Boolean
  group: GroupConfigInput
  docker: DockerConfigInput @pending
  snmp: SnmpConfigInput @pending
  tailscalePing: TailscalePingConfigInput @pending
  systemd: SystemdConfigInput @pending
}

input DockerConfigInput @pending {
  container: String!
  timeoutMs: Int = 10000
}

input SystemdConfigInput @pending {
  unit: String!
  timeoutMs: Int = 10000
}

input SnmpConfigInput @pending {
  port: Int = 161
  version: SnmpVersion = V2C
  oid: String!
  expected: String
  community: String
  username: String
  authPassword: String
  privacyPassword: String
  timeoutMs: Int = 5000
}

input TailscalePingConfigInput @pending {
  target: String
  timeoutMs: Int = 5000
}

# ---------------------------------------------------------------- metrics (WP-28)

enum MetricKind @pending {
  CPU_PERCENT
  MEMORY_PERCENT
  MEMORY_BYTES
  DISK_PERCENT
  DISK_BYTES
  NETWORK_IN_BPS
  NETWORK_OUT_BPS
  UPTIME_SECONDS
  LOAD_1
  LOAD_5
  LOAD_15
  GPU_PERCENT
  VRAM_PERCENT
  VRAM_BYTES
  GPU_TEMPERATURE_C
  GPU_POWER_W
}

# MET-003
enum MetricRange @pending {
  HOUR
  DAY
  WEEK
}

enum GpuVendor @pending {
  NVIDIA
  AMD
  INTEL
  APPLE
}

type Gpu @pending {
  index: Int!
  name: String!
  vendor: GpuVendor!
  "False for integrated and Apple GPUs (MET-007)."
  hasVram: Boolean!
}

type MetricPoint @pending {
  at: DateTime!
  value: Float!
  min: Float
  max: Float
}

"Label: mount point, interface name, or 'GPU <index> <name>' (MET-009). Bytes are Float (above 2^31)."
type MetricSeries @pending {
  kind: MetricKind!
  label: String!
  gpuIndex: Int
  points: [MetricPoint!]!
}

"The latest values for the card (MET-004, MET-008). Disk: the fullest mount. VRAM: the GPU with the highest use."
type Readings @pending {
  at: DateTime!
  cpuPercent: Float
  memoryPercent: Float
  diskPercent: Float
  vramPercent: Float
  vramGpu: Gpu
}

type MetricSample @pending {
  kind: MetricKind!
  label: String!
  value: Float!
}

type MetricsAdded @pending {
  deviceId: ID!
  at: DateTime!
  samples: [MetricSample!]!
  readings: Readings!
}


input IcmpConfigInput {
  timeoutMs: Int = 2000
  ipVersion: IpVersion = V4
}

input TcpConfigInput {
  port: Int!
  timeoutMs: Int = 5000
}

input TlsConfigInput {
  port: Int = 443
  serverName: String
  timeoutMs: Int = 5000
}

input HttpHeaderInput {
  name: String!
  value: String!
}

input StatusRangeInput {
  from: Int!
  to: Int!
}

input HttpAuthInput @oneOf {
  basic: BasicAuthInput
  bearerToken: String
}

input BasicAuthInput {
  username: String!
  password: String!
}

input HttpConfigInput {
  url: String!
  method: HttpMethod = GET
  headers: [HttpHeaderInput!] = []
  body: String
  maxRedirects: Int = 10
  acceptedStatus: [StatusRangeInput!] = [{ from: 200, to: 299 }]
  keyword: String
  jsonQuery: String
  jsonExpected: String
  auth: HttpAuthInput
  verifyTls: Boolean = true
  timeoutMs: Int = 10000
}

input DnsConfigInput {
  name: String!
  recordType: DnsRecordType = A
  resolver: IpAddr
  expected: String
}

input GroupConfigInput {
  childIds: [ID!]!
}

input CreateCheckInput {
  deviceId: ID!
  parentId: ID
  name: String!
  config: CheckConfigInput!
  intervalSeconds: Int = 60
  retries: Int = 3
  retryIntervalSeconds: Int = 20
  degradedThresholdMs: Int = 1000
  invert: Boolean = false
}

input UpdateCheckInput {
  parentId: ID
  name: String
  config: CheckConfigInput
  intervalSeconds: Int
  retries: Int
  retryIntervalSeconds: Int
  degradedThresholdMs: Int
  invert: Boolean
}

type Heartbeat {
  at: DateTime!
  status: Status!
  responseTimeMs: Int
  message: String
}

type HeartbeatEdge {
  cursor: String!
  node: Heartbeat!
}

type HeartbeatConnection {
  edges: [HeartbeatEdge!]!
  pageInfo: PageInfo!
}

enum UptimeWindow {
  DAY
  WEEK
  MONTH
  YEAR
}

# ---------------------------------------------------------------- maintenance (WP-09)

enum WindowKind {
  MANUAL
  SINGLE
  RECURRING_INTERVAL
  RECURRING_WEEKDAY
  RECURRING_DAY_OF_MONTH
}

enum Weekday {
  MON
  TUE
  WED
  THU
  FRI
  SAT
  SUN
}

enum TargetType {
  DEVICE
  CHECK
  TAG
}

type WindowTarget {
  type: TargetType!
  "Device ID, check ID or tag name."
  target: String!
}

"A rule with fields, never cron text (MW-004). Times are local to `timezone` (MW-001)."
type MaintenanceWindow {
  id: ID!
  name: String!
  kind: WindowKind!
  timezone: String!
  "MANUAL only."
  activeManual: Boolean
  "SINGLE only."
  startsAt: DateTime
  endsAt: DateTime
  "RECURRING_INTERVAL only."
  firstStartAt: DateTime
  everyDays: Int
  "RECURRING_WEEKDAY and RECURRING_DAY_OF_MONTH. HH:MM local; may end after midnight (MW-002)."
  weekdays: [Weekday!]
  "1..31, or -1 for the last day of the month."
  daysOfMonth: [Int!]
  startTime: String
  durationMinutes: Int
  targets: [WindowTarget!]!
  activeNow: Boolean!
}

input WindowTargetInput {
  type: TargetType!
  target: String!
}

input MaintenanceWindowInput {
  name: String!
  kind: WindowKind!
  timezone: String!
  startsAt: DateTime
  endsAt: DateTime
  firstStartAt: DateTime
  everyDays: Int
  weekdays: [Weekday!]
  daysOfMonth: [Int!]
  startTime: String
  durationMinutes: Int
  targets: [WindowTargetInput!]!
}

# ---------------------------------------------------------------- events (WP-05)

enum Severity {
  INFO
  WARNING
  ERROR
}

enum EventSource {
  CHECK
  SESSION
  DEVICE
  ACCESS
  HUB
  METRICS @pending
}

type Event {
  id: ID!
  at: DateTime!
  severity: Severity!
  source: EventSource!
  deviceId: ID
  deviceName: String
  message: String!
}

type EventEdge {
  cursor: String!
  node: Event!
}

type EventConnection {
  edges: [EventEdge!]!
  pageInfo: PageInfo!
}

input EventFilter {
  severity: [Severity!]
  source: [EventSource!]
  deviceId: ID
  since: DateTime
}

type AuditEntry {
  id: ID!
  at: DateTime!
  operatorName: String!
  action: String!
  targetType: String!
  targetId: String!
  clientAddr: IpAddr!
  "Changed fields. Secret values are replaced with \"[redacted]\"."
  change: JSON!
}

type AuditEdge {
  cursor: String!
  node: AuditEntry!
}

type AuditConnection {
  edges: [AuditEdge!]!
  pageInfo: PageInfo!
}

# ---------------------------------------------------------------- sessions (WP-10)

enum Protocol {
  SSH
  RDP
  VNC
}

enum SessionEndReason {
  OPERATOR
  REMOTE_CLOSED
  GATEWAY_ERROR
  AUTH_FAILED
  HOST_KEY_MISMATCH
  "The client sent an instruction that does not decode (GW-011, R-034)."
  PROTOCOL_ERROR
  TIMEOUT
  HUB_SHUTDOWN
  "The RDP certificate differs from the accepted one (D-5)."
  SERVER_CERTIFICATE_MISMATCH
}

type Session {
  id: ID!
  deviceId: ID
  deviceName: String!
  protocol: Protocol!
  operatorName: String!
  startedAt: DateTime!
  endedAt: DateTime
  endReason: SessionEndReason
  # RA-034: which computer holds it
  clientAddr: IpAddr!
}

type SessionEdge {
  cursor: String!
  node: Session!
}

type SessionConnection {
  edges: [SessionEdge!]!
  pageInfo: PageInfo!
}

"Single-use ticket for the WebSocket tunnel (API-009). See contracts/tunnel.md."
type SessionTicket {
  sessionId: ID!
  token: String!
  tunnelPath: String!
  expiresAt: DateTime!
  "A Wake-on-LAN packet was sent; the opening waits longer (K4 §1)."
  wakeSent: Boolean! @pending
}

type WakeResult @pending {
  sentAt: DateTime!
  relayName: String!
}

type SessionChange @pending {
  session: Session!
}

# ---------------------------------------------------------------- web interfaces (WP-30)

enum OpenIn {
  ANIMA_TAB
  SYSTEM_BROWSER
}

type WebInterface {
  id: ID!
  deviceId: ID!
  label: String!
  url: String!
  openIn: OpenIn!
  "Pinned on accept (WEB-008)."
  pinnedFingerprintSha256: String
  pinnedAt: DateTime
}

type WebInterfaceSuggestion {
  checkId: ID!
  url: String!
  label: String!
}

input WebInterfaceInput {
  "Defaults to the URL's host."
  label: String
  url: String!
  openIn: OpenIn = ANIMA_TAB
}

input DisplayInput {
  "Only these values come from the client (GW-012)."
  widthPx: Int!
  heightPx: Int!
  dpi: Int = 96
  timezone: String
}

input StartSessionInput {
  deviceId: ID!
  protocol: Protocol!
  display: DisplayInput!
}

# ---------------------------------------------------------------- root types

type Query {
  me: Operator!

  sites: [Site!]!
  device(id: ID!): Device
  devices(filter: DeviceFilter, sort: DeviceSort = NAME, first: Int = 50, after: String): DeviceConnection!
  tags: [String!]!

  check(id: ID!): Check

  maintenanceWindows: [MaintenanceWindow!]!

  events(filter: EventFilter, first: Int = 100, after: String): EventConnection!
  audit(first: Int = 100, after: String): AuditConnection!

  sessions(deviceId: ID, live: Boolean, first: Int = 50, after: String): SessionConnection!
}

type Mutation {
  login(input: LoginInput!): AuthPayload!
  logout: Boolean!

  createSite(name: String!, subnet: Cidr!): Site!
  createDevice(input: CreateDeviceInput!): Device!
  updateDevice(id: ID!, input: UpdateDeviceInput!): Device!
  "Deletes credentials, checks, heartbeats and metrics too (DEV-015). Returns the deleted ID."
  deleteDevice(id: ID!): ID!
  setSshCredential(deviceId: ID!, credential: SshCredentialInput!): SshSettings!
  clearSshCredential(deviceId: ID!): SshSettings!
  testConnection(input: ConnectionTestInput!): ConnectionTestResult!
  "The fingerprint must equal the one the hub saw, or the hub returns CONFLICT."
  acceptHostKey(deviceId: ID!, fingerprintSha256: String!): HostKey!

  createCheck(input: CreateCheckInput!): Check!
  updateCheck(id: ID!, input: UpdateCheckInput!): Check!
  deleteCheck(id: ID!): ID!
  setCheckPaused(id: ID!, paused: Boolean!): Check!

  createMaintenanceWindow(input: MaintenanceWindowInput!): MaintenanceWindow!
  updateMaintenanceWindow(id: ID!, input: MaintenanceWindowInput!): MaintenanceWindow!
  deleteMaintenanceWindow(id: ID!): ID!
  setManualWindowActive(id: ID!, active: Boolean!): MaintenanceWindow!

  startSession(input: StartSessionInput!): SessionTicket!
  endSession(id: ID!): Session!

  setSiteWakeRelay(siteId: ID!, deviceId: ID): Site!
  setRdpCredential(deviceId: ID!, credential: PasswordCredentialInput!): RdpSettings!
  clearRdpCredential(deviceId: ID!): RdpSettings!
  setVncCredential(deviceId: ID!, credential: PasswordCredentialInput!): VncSettings!
  clearVncCredential(deviceId: ID!): VncSettings!
  "The fingerprint must equal the one the hub saw, or CONFLICT."
  acceptServerCertificate(deviceId: ID!, fingerprintSha256: String!): ServerCertificate! @pending
  "A ticket for the files tunnel of a live SSH session (K4 §9)."
  openFiles(sessionId: ID!): SessionTicket! @pending
  wakeDevice(deviceId: ID!): WakeResult! @pending
  createWebInterface(deviceId: ID!, input: WebInterfaceInput!): WebInterface!
  updateWebInterface(id: ID!, input: WebInterfaceInput!): WebInterface!
  deleteWebInterface(id: ID!): ID!
  acceptWebInterfaceSuggestion(checkId: ID!): WebInterface!
  dismissWebInterfaceSuggestion(checkId: ID!): ID!
  "Pins the certificate and writes an audit entry (WEB-008, WEB-009)."
  acceptWebCertificate(id: ID!, fingerprintSha256: String!): WebInterface!
}

type Subscription {
  deviceStatusChanged(deviceId: ID): DeviceStatusChange!
  heartbeatAdded(checkId: ID, deviceId: ID): HeartbeatAdded!
  eventAdded(minSeverity: Severity = INFO): Event!
  "Every start and end of a session, from every client (RA-034)."
  sessionChanged: SessionChange! @pending
  metricsAdded(deviceId: ID): MetricsAdded! @pending
}

type DeviceStatusChange {
  deviceId: ID!
  status: Status!
  at: DateTime!
}

type HeartbeatAdded {
  checkId: ID!
  deviceId: ID!
  heartbeat: Heartbeat!
}
