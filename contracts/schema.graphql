  createWebInterface(deviceId: ID!, input: WebInterfaceInput!): WebInterface!
  updateWebInterface(id: ID!, input: WebInterfaceInput!): WebInterface!
  deleteWebInterface(id: ID!): ID!
  acceptWebInterfaceSuggestion(checkId: ID!): WebInterface!
  dismissWebInterfaceSuggestion(checkId: ID!): ID!
  "Pins the certificate and writes an audit entry (WEB-008, WEB-009). Login or browser token only (D-23, R-100)."
  acceptWebCertificate(id: ID!, fingerprintSha256: String!): WebInterface!

  # Phase 3
  "Signed out (D-4), or a login or browser token; never an API key (D-23, R-100). Sets the __Host-anima cookie; refused unless Origin is the public origin."
  signInBrowser(input: LoginInput!): BrowserSignIn!
  "Login or browser token only (D-23, R-100)."
  createApiKey(input: ApiKeyInput!): ApiKeyCreated!
  "Login or browser token only (D-23, R-100)."
  revokeApiKey(id: ID!): ID!
  "Login or browser token only (INT-003, D-23, R-100). A new code makes the device's earlier unused codes useless."
  enrolAgent(deviceId: ID!): AgentEnrolment!
  "Login or browser token only (D-23, R-100). The source stays AGENT, shown as stale, until the operator changes it (R-092 D-7)."
  revokeAgentToken(deviceId: ID!): Device!

  setCheckDefaults(input: CheckDefaultsInput!): CheckDefaults!

  createNotificationChannel(input: NotificationChannelInput!): NotificationChannel!
  updateNotificationChannel(id: ID!, input: NotificationChannelInput!): NotificationChannel!
  deleteNotificationChannel(id: ID!): ID!
  "Sends at once and waits at most 8 seconds (NOT-004)."
  sendTestNotification(id: ID!): Delivery!
  setCheckNotifications(checkId: ID!, input: CheckNotificationsInput!): CheckNotifications!
  setNotificationSettings(input: NotificationSettingsInput!): NotificationSettings!

  "Login or browser token only (D-23, R-100)."
  setRetention(subject: RetentionSubject!, days: Int!): RetentionPeriod!

  # Phase 3: builds (WP-36, R-107)
  "One queued job for each target; VALIDATION for a version that is not new (BLD-001, BLD-002). Login or browser token only (D-23, R-107)."
  createRelease(version: String!, commit: String!, targets: [BuildTarget!]!): Release!
  "Only a QUEUED job; CONFLICT otherwise (BLD-008). Login or browser token only (D-23, R-107)."
  cancelBuildJob(id: ID!): BuildJob!
  "Records the builder at the request's address; returns its token once (BLD-023, D-1). Login or browser token only (D-23, R-107)."
  enrolBuilder(name: String!, platform: BuilderPlatformInput!): BuilderEnrolment!
  "Deletes the builder and revokes its token (BLD-025). Returns the ID. Login or browser token only (D-23, R-107)."
  revokeBuilder(id: ID!): ID!

  "Builder token only (D-1). Null when no job waits or the builder holds a lease (BLD-004, BLD-029)."
  claimBuildJob(platform: BuilderPlatformInput!): BuildJob
  "Builder token only; the lease holder only. Extends the lease (BLD-005, BLD-010, BLD-048)."
  reportBuildJob(id: ID!, state: BuildJobState, logLines: [String!]!, failureReason: String): BuildJob!
  "Builder token only; the lease holder of an UPLOADING job only. One presigned PUT URL, 15 minutes, for each named file under <target>/<version>/ (BLD-060, BLD-061). Only the target's updater file, its DMG on macOS and SHA256SUMS are granted (R-108). The files later reported must be exactly these."
  buildUploadUrls(id: ID!, files: [BuildFileInput!]!): [BuildUploadUrl!]!
  "Builder token only. Ends the lease; the hub then verifies and publishes in the background, ending PUBLISHED or FAILED (BLD-063 to BLD-070)."
  reportBuildUploaded(id: ID!, files: [BuildFileInput!]!, feed: String!): BuildJob!

  # Phase 3: VPN (VP-7, VP-10)
  "A one-use, one-hour key for a Linux computer of the operator (VPN-003). Login or browser token only (D-23)."
  createVpnInvite: VpnKey!
  "A one-use, one-hour key for the subnet router of a site (VPN-001). Login or browser token only (D-23)."
  createRouterKey(siteId: ID!): VpnKey!
  "Registers the computer that shows this auth ID on its own screen (vpn.md 6B). Login or browser token only (D-23)."
  registerVpnNode(authId: String!): VpnRegistration!
  "Sets the key expiry of an untagged operator node to a staggered date 90 to 180 days from now (vpn.md Section 7). Login or browser token only (D-23)."
  renewVpnKey(name: String!): VpnRegistration!
  "Approves the waiting route of the site's router. Login or browser token only (D-23)."
  approveSiteRoute(siteId: ID!): Boolean!

  # Engine and Projects (operator, 2026-11-13; ruling number to be assigned; K-E7, K-E1, XP-02)
  "On also sets on each extension it needs (EXT-011). Off is refused with CONFLICT while an extension that is on needs it; extensions.neededBy names it (EXT-012). Off keeps every record (EXT-003). Returns each extension whose switch changed, the named one first; empty when nothing changed. Login or browser token only (D-23, R-100)."
  setExtension(key: String!, on: Boolean!): [Extension!]!
  "Checks the key with GitHub before it stores it; UNAVAILABLE when GitHub cannot be reached, VALIDATION when GitHub refuses the key. The same App ID and installation ID again replaces the stored key and keeps the account and its records. Login or browser token only (D-23, R-100)."
  connectGithubApp(input: GithubAppInput!): SourceAccount!
  "Starts a sync now and returns at once. CONFLICT while the account is paused or no extension that uses it is on. A sync that already runs is not started twice."
  syncSourceAccount(id: ID!): SourceAccount!
  setSourceAccountPaused(id: ID!, paused: Boolean!): SourceAccount!
  "Deletes the account and its stored key. deleteRecords false keeps what it imported (ITG-004). deleteRecords true deletes what it imported, except the operator's decisions: a repository left out (PRO-002) or one whose project holds a confirmed resource (PRO-004) is kept without an account, and the account that lists it next adopts it as it is. Returns the ID. Login or browser token only (D-23, R-100)."
  removeSourceAccount(id: ID!, deleteRecords: Boolean!): ID!
  "By the repository's ID (ProjectRepository.id). The hub does not import or read the repository again until it is restored, and its proposed resources are withdrawn (PRO-002). No change when it is already left out. Returns its project. NOT_FOUND for an unknown ID; CONFLICT while Projects is off."
  leaveOutRepository(id: ID!): Project!
  "By the repository's ID. Its proposed resources come back, and its account is made due so its signs are read again on the next sync (PRO-002). No change when it is not left out. Returns its project. NOT_FOUND for an unknown ID; CONFLICT while Projects is off."
  restoreRepository(id: ID!): Project!
  "CONFLICT when it is already confirmed, or while Projects is off. NOT_FOUND for an unknown ID."
  confirmProjectResource(id: ID!): ProjectResource!
  "CONFLICT while an attempt has made an App that is not installed; an attempt with no App is replaced. Login or browser token only (D-23, R-100)."
  startGithubConnect(input: StartGithubConnectInput): GithubConnectAttempt!
  "Returns a ONE-TIME link; an earlier one stops working. CONFLICT outside WAITING_FOR_BROWSER and AT_GITHUB. FORBIDDEN for a request that declares an AI agent. Login or browser token only (D-23, R-100)."
  openGithubConnect(id: ID!): GithubConnectLink!
  "Drops the attempt and any key it holds. NOT_FOUND for another id; CONFLICT once CONNECTED. Login or browser token only (D-23, R-100)."
  cancelGithubConnect(id: ID!): GithubConnectAttempt!

  # Projects: the first GitHub changes (operator, 2026-11-13; ruling number to be assigned; PRJ-027 to PRJ-029, OD-E14)
  # The errors of the Projects queries above apply. Each is a named change (K-E1 Section 13); the hub never repeats one.
  # The roots closed to API keys use temporary words until the task that lists them in API_KEY_REFUSED_ROOTS restores
  # "Login or browser token only (D-23, R-100)." (key_roots.rs keys on that phrase).
  "Makes an issue on GitHub. Not repeated by the hub: after UNAVAILABLE the issue may exist. Writes an audit entry (PRJ-028)."
  createIssue(input: NewIssueInput!): Issue!
  "number is an issue or a pull request. body is 1 to 65,536 characters. Not repeated by the hub. Writes an audit entry (PRJ-028)."
  addIssueComment(repository: ID!, number: Int!, body: String!): IssueComment!
  "Closes or opens an issue. reason only with open false. No change when it is already so. VALIDATION when the number is a pull request. Writes an audit entry (PRJ-028)."
  setIssueOpen(repository: ID!, number: Int!, open: Boolean!, reason: IssueCloseReason): Issue!
  "CONFLICT when the head moved, it cannot merge, GitHub has not computed it, or the method is not allowed. FORBIDDEN for a pull request from a fork without forkConfirmed, and for any pull request from a fork when the request declares an AI agent (PRO-013). Returns it unchanged when it is already merged. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  mergePullRequest(input: MergePullRequestInput!): PullRequest!
  "1 to 20 pull requests, no pair twice, merged one after another in the order given; a failure does not stop the rest. One result for each, in the same order (PRJ-033). Only CLEAN ones; never one from a fork. One audit entry for each one the hub sent to GitHub. Login or browser token only (D-23, R-100)."
  mergePullRequests(pullRequests: [PullRequestTargetInput!]!, method: MergeMethod!): [PullRequestMerge!]!
  "Runs every job again. CONFLICT when it is not rerunnable or expectedHeadSha is not its head commit (PRJ-034). Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  rerunWorkflowRun(repository: ID!, runId: ID!, expectedHeadSha: String!): WorkflowRun!
  "Runs only the failed jobs again. CONFLICT as rerunWorkflowRun. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  rerunFailedWorkflowJobs(repository: ID!, runId: ID!, expectedHeadSha: String!): WorkflowRun!
  "CONFLICT when it is not cancellable or expectedHeadSha is not its head commit. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  cancelWorkflowRun(repository: ID!, runId: ID!, expectedHeadSha: String!): WorkflowRun!
  "Starts a workflow by hand on a branch (PRJ-035). VALIDATION when GitHub refuses the branch or the inputs; CONFLICT when the workflow is not active. Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  dispatchWorkflow(input: DispatchWorkflowInput!): WorkflowDispatch!
  "Writes a commit status under an anima/ context (PRO-010). Writes an audit entry (PRJ-028). Login or browser token only (D-23, R-100)."
  setCommitStatus(input: CommitStatusInput!): CommitStatus!

  # S6: the device link (FRN-009, OR-S6-3)
  "An invite for a new device named name (1 to 64 visible characters). Shown once; it works once and expires (LNK-003). The response is no-store. Writes an audit entry without the invite (LOG-005, LOG-007). Login or browser token only (D-23)."
  createLinkInvite(name: String!): LinkInvite!
  "Removes the device with this key from the link and closes its streams; returns how many it closed (LNK-004). NOT_FOUND when the link does not list the key. Writes an audit entry. Login or browser token only (D-23)."
  revokeLinkDevice(key: String!): Int!

  # Timeline and record links (operator, 2026-11-16; ruling number to be assigned; K-E4)
  "Links two records. A second call with the same source, target and kind returns the stored link and writes nothing; with a new label it replaces the label. VALIDATION for text that is not kind:id, for a record linked to itself, and for a repository, place, person or date key that is not in its one form (RLK-004)."
  linkRecords(input: RecordLinkInput!): RecordLink!
  "Removes one link and returns its ID. The two records are not changed. NOT_FOUND when no link has this ID."
  unlinkRecords(id: ID!): ID!
}

type Subscription {
  deviceStatusChanged(deviceId: ID): DeviceStatusChange!
  heartbeatAdded(checkId: ID, deviceId: ID): HeartbeatAdded!
  eventAdded(minSeverity: Severity = INFO): Event!
  "Every start and end of a session, from every client (RA-034)."
  sessionChanged: SessionChange!
  metricsAdded(deviceId: ID): MetricsAdded!
  "Every change to a build job, with the log lines it added (BLD-081)."
  buildJobUpdated(jobId: ID): BuildJobUpdate!
  "Each new VPN picture, about once a minute."
  vpnChanged: VpnPicture!
  "Each change of an account: a sync that starts or ends, a pause, a new key. (operator, 2026-11-13; ruling number to be assigned; K-E1)"
  sourceAccountChanged(id: ID): SourceAccount!
  "Each change of the open attempt to connect GitHub. Open to a read key (operator, 2026-11-14; ruling number to be assigned; K-E1 Section 7a)."
  githubConnectChanged: GithubConnectAttempt!
}

type DeviceStatusChange {
  deviceId: ID!
  status: Status!
  at: DateTime!
}

type HeartbeatAdded {
  checkId: ID!
  deviceId: ID!
  heartbeat: Heartbeat!
}
