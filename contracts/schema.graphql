}

input LoginInput {
  username: String!
  password: String!
  totpCode: String
}

# Phase 3 (WP-43). D-3, D-4, D-23.

enum TokenScope {
  READ
  WRITE
}

"Set by signInBrowser together with the __Host-anima cookie. The token itself is never returned (D-3)."
type BrowserSignIn {
  operator: Operator!
  expiresAt: DateTime!
}

type ApiKey {
  id: ID!
  "1..64 characters, unique."
  name: String!
  scope: TokenScope!
  "The first 12 characters of the secret, for example anima_Ab12Cd, so the operator can tell keys apart."
  prefix: String!
  expiresAt: DateTime!
  createdAt: DateTime!
  lastUsedAt: DateTime
}

type ApiKeyCreated {
  key: ApiKey!
  "Shown once. The hub keeps only its SHA-256 (INT-003, P3-004)."
  secret: String!
}

"Shown once. The hub keeps only its SHA-256; one use, 15 minutes (MET-012, K8)."
type AgentEnrolment {
  code: String!
  expiresAt: DateTime!
}

input ApiKeyInput {
  name: String!
  scope: TokenScope!
  "Required; at most one year from now (D-23)."
  expiresAt: DateTime!
}

