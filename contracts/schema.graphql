  "Login or browser token only (D-23, R-100)."
  setRetention(subject: RetentionSubject!, days: Int!): RetentionPeriod!

  # Phase 3: builds (WP-36, R-107)
  "One queued job for each target; VALIDATION for a version that is not new (BLD-001, BLD-002). Login or browser token only (D-23, R-107)."
  createRelease(version: String!, commit: String!, targets: [BuildTarget!]!): Release!
  "Only a QUEUED job; CONFLICT otherwise (BLD-008). Login or browser token only (D-23, R-107)."
  cancelBuildJob(id: ID!): BuildJob!
  "Records the builder at the request's address; returns its token once (BLD-023, D-1). Login or browser token only (D-23, R-107)."
  enrolBuilder(name: String!, platform: BuilderPlatformInput!): BuilderEnrolment!
  "Deletes the builder and revokes its token (BLD-025). Returns the ID. Login or browser token only (D-23, R-107)."
  revokeBuilder(id: ID!): ID!

  "Builder token only (D-1). Null when no job waits or the builder holds a lease (BLD-004, BLD-029)."
  claimBuildJob(platform: BuilderPlatformInput!): BuildJob
  "Builder token only; the lease holder only. Extends the lease (BLD-005, BLD-010, BLD-048)."
  reportBuildJob(id: ID!, state: BuildJobState, logLines: [String!]!, failureReason: String): BuildJob!
  "Builder token only; the lease holder of an UPLOADING job only. One presigned PUT URL, 15 minutes, for each named file under <target>/<version>/ (BLD-060, BLD-061). Only the target's updater file, its DMG on macOS and SHA256SUMS are granted (R-108). The files later reported must be exactly these."
  buildUploadUrls(id: ID!, files: [BuildFileInput!]!): [BuildUploadUrl!]!
  "Builder token only. Ends the lease; the hub then verifies and publishes in the background, ending PUBLISHED or FAILED (BLD-063 to BLD-070)."
  reportBuildUploaded(id: ID!, files: [BuildFileInput!]!, feed: String!): BuildJob!

  # Phase 3: VPN (VP-7, VP-10)
  "A one-use, one-hour key for a Linux computer of the operator (VPN-003). Login or browser token only (D-23)."
  createVpnInvite: VpnKey!
  "A one-use, one-hour key for the subnet router of a site (VPN-001). Login or browser token only (D-23)."
  createRouterKey(siteId: ID!): VpnKey!
  "Registers the computer that shows this auth ID on its own screen (vpn.md 6B). Login or browser token only (D-23)."
  registerVpnNode(authId: String!): VpnRegistration!
  "Sets the key expiry of an untagged operator node to a staggered date 90 to 180 days from now (vpn.md Section 7). Login or browser token only (D-23)."
  renewVpnKey(name: String!): VpnRegistration!
  "Approves the waiting route of the site's router. Login or browser token only (D-23)."
  approveSiteRoute(siteId: ID!): Boolean!

  # Engine and Projects (operator, 2026-11-13; ruling number to be assigned; K-E7, K-E1, XP-02)
  "On also sets on each extension it needs (EXT-011). Off is refused with CONFLICT while an extension that is on needs it; extensions.neededBy names it (EXT-012). Off keeps every record (EXT-003). Returns each extension whose switch changed, the named one first; empty when nothing changed. Login or browser token only (D-23, R-100)."
  setExtension(key: String!, on: Boolean!): [Extension!]!
  "Checks the key with GitHub before it stores it; UNAVAILABLE when GitHub cannot be reached, VALIDATION when GitHub refuses the key. The same App ID and installation ID again replaces the stored key and keeps the account and its records. Login or browser token only (D-23, R-100)."
  connectGithubApp(input: GithubAppInput!): SourceAccount!
  "Starts a sync now and returns at once. CONFLICT while the account is paused or no extension that uses it is on. A sync that already runs is not started twice."
  syncSourceAccount(id: ID!): SourceAccount!
  setSourceAccountPaused(id: ID!, paused: Boolean!): SourceAccount!
  "Deletes the account and its stored key. deleteRecords false keeps what it imported (ITG-004). deleteRecords true deletes what it imported, except the operator's decisions: a repository left out (PRO-002) or one whose project holds a confirmed resource (PRO-004) is kept without an account, and the account that lists it next adopts it as it is. Returns the ID. Login or browser token only (D-23, R-100)."
  removeSourceAccount(id: ID!, deleteRecords: Boolean!): ID!
  "By the repository's ID (ProjectRepository.id). The hub does not import or read the repository again until it is restored, and its proposed resources are withdrawn (PRO-002). No change when it is already left out. Returns its project. NOT_FOUND for an unknown ID; CONFLICT while Projects is off."
  leaveOutRepository(id: ID!): Project!
  "By the repository's ID. Its proposed resources come back, and its account is made due so its signs are read again on the next sync (PRO-002). No change when it is not left out. Returns its project. NOT_FOUND for an unknown ID; CONFLICT while Projects is off."
  restoreRepository(id: ID!): Project!
  "CONFLICT when it is already confirmed, or while Projects is off. NOT_FOUND for an unknown ID."
  confirmProjectResource(id: ID!): ProjectResource!
}

type Subscription {
  deviceStatusChanged(deviceId: ID): DeviceStatusChange!
  heartbeatAdded(checkId: ID, deviceId: ID): HeartbeatAdded!
  eventAdded(minSeverity: Severity = INFO): Event!
  "Every start and end of a session, from every client (RA-034)."
  sessionChanged: SessionChange!
  metricsAdded(deviceId: ID): MetricsAdded!
  "Every change to a build job, with the log lines it added (BLD-081)."
  buildJobUpdated(jobId: ID): BuildJobUpdate!
  "Each new VPN picture, about once a minute."
  vpnChanged: VpnPicture!
  "Each change of an account: a sync that starts or ends, a pause, a new key. (operator, 2026-11-13; ruling number to be assigned; K-E1)"
  sourceAccountChanged(id: ID): SourceAccount!
}

type DeviceStatusChange {
  deviceId: ID!
  status: Status!
  at: DateTime!
}

type HeartbeatAdded {
  checkId: ID!
  deviceId: ID!
  heartbeat: Heartbeat!
}
