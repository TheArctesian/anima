type CommitChecks {
  sha: String!
  "FAILED when any failed; else PENDING when any is not finished; else PASSED; NONE when the commit has none."
  state: ChecksState!
  passed: Int!
  failed: Int!
  pending: Int!
  "Skipped, neutral or cancelled."
  other: Int!
  "Up to 10 names of failed checks, each at most 100 characters. Text from GitHub."
  failing: [String!]!
  "True: the commit has more than 100 check runs or statuses; the counts cover the first 100 of each."
  partial: Boolean!
}

enum PullRequestState { OPEN CLOSED MERGED }
enum MergeMethod { MERGE SQUASH REBASE }
enum MergeState {
  "No conflict and the checks passed."
  CLEAN
  "No conflict; a check that is not required failed or still runs."
  UNSTABLE
  CONFLICT
  "A required check or review is missing."
  BLOCKED
  "The base branch moved and the repository requires an up-to-date branch."
  BEHIND
  DRAFT
  "GitHub has not computed it yet. Ask again."
  UNKNOWN
}

type PullRequestMergeability {
  state: MergeState!
  "True only for CLEAN on an open pull request that is not a draft (PRJ-033)."
  canMerge: Boolean!
}

"Identity is the repository and the number. It has no hub ID: the hub does not store it."
type PullRequest {
  repository: ID!
  number: Int!
  "At most 300 characters. Text from GitHub."
  title: String!
  state: PullRequestState!
  draft: Boolean!
  "Text from GitHub."
  authorLogin: String!
  "Text from GitHub."
  headBranch: String!
  "40 lower-case hex digits."
  headSha: String!
  baseBranch: String!
  "True: the head branch is in another repository. Such a pull request is never merged in bulk, and its workflow runs are not run again from Anima (PRO-013)."
  fromFork: Boolean!
  "owner/name of the head repository; null when it was deleted. Text from GitHub."
  headRepository: String
  "Up to 20 names. Text from GitHub."
  labels: [String!]!
  comments: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  mergedAt: DateTime
  "The page on GitHub (PRJ-010)."
  url: String!
  "Markdown source, cut at 20,000 characters. Text from GitHub: plain text, never HTML."
  body: String
  bodyCut: Boolean!
  "Costs one GitHub request for each pull request when selected. Null for one that is not open."
  mergeability: PullRequestMergeability
  "The checks of headSha. Costs two GitHub requests for each pull request when selected."
  checks: CommitChecks
}

type PullRequestEdge {
  cursor: String!
  node: PullRequest!
}

type PullRequestConnection {
  edges: [PullRequestEdge!]!
  pageInfo: PageInfo!
  read: ForgeRead!
  "The merge methods the repository allows. Costs one GitHub request when selected (kept 10 minutes)."
  mergeMethods: [MergeMethod!]!
}

enum IssueCloseReason { COMPLETED NOT_PLANNED }

type Issue {
  repository: ID!
  number: Int!
  "At most 300 characters. Text from GitHub."
  title: String!
  open: Boolean!
  "Set for a closed issue when GitHub gives it."
  closeReason: IssueCloseReason
  "Text from GitHub."
  authorLogin: String!
  "Up to 20 names. Text from GitHub."
  labels: [String!]!
  "Up to 10 logins. Text from GitHub."
  assignees: [String!]!
  comments: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  closedAt: DateTime
  url: String!
  "Markdown source, cut at 20,000 characters. Text from GitHub: plain text, never HTML."
  body: String
  bodyCut: Boolean!
}

type IssueEdge {
  cursor: String!
  node: Issue!
}

type IssueConnection {
  edges: [IssueEdge!]!
  pageInfo: PageInfo!
  read: ForgeRead!
}

type IssueComment {
  "GitHub's comment number, as digits."
  id: ID!
  "Text from GitHub."
  authorLogin: String!
  "Markdown source, cut at 20,000 characters. Text from GitHub: plain text, never HTML."
  body: String!
  bodyCut: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  url: String!
}

type IssueCommentEdge {
  cursor: String!
  node: IssueComment!
}

type IssueCommentConnection {
  edges: [IssueCommentEdge!]!
  pageInfo: PageInfo!
  read: ForgeRead!
}

enum WorkflowRunStatus { QUEUED IN_PROGRESS COMPLETED }
enum WorkflowConclusion { SUCCESS FAILURE CANCELLED SKIPPED TIMED_OUT ACTION_REQUIRED NEUTRAL STALE OTHER }

type Workflow {
  "GitHub's workflow number, as digits."
  id: ID!
  "Text from GitHub."
  name: String!
  "For example .github/workflows/ci.yml. Text from GitHub."
  path: String!
  "False: the workflow is disabled on GitHub."
  active: Boolean!
  url: String!
}

type WorkflowJobs {
  total: Int!
  succeeded: Int!
  failed: Int!
  running: Int!
  queued: Int!
  "Skipped or cancelled."
  other: Int!
  "Up to 10 names of failed jobs, each at most 100 characters. Text from GitHub."
  failing: [String!]!
  "True: the run has more than 100 jobs; the counts cover the first 100."
  partial: Boolean!
}

type WorkflowRun {
  repository: ID!
  "GitHub's run number across the repository, as digits (it does not fit Int)."
  id: ID!
  workflowId: ID!
  "The workflow's name. Text from GitHub."
  name: String!
  "The count of runs of this workflow."
  runNumber: Int!
  attempt: Int!
  "For example push, pull_request, workflow_dispatch."
  event: String!
  status: WorkflowRunStatus!
  "Null until COMPLETED."
  conclusion: WorkflowConclusion
  "Null for a run with no branch. Text from GitHub."
  branch: String
  "40 lower-case hex digits. Each confirmation shows it (PRJ-034)."
  headSha: String!
  "The first line of the commit message, at most 200 characters. Text from GitHub."
  commitTitle: String
  "Text from GitHub."
  actorLogin: String
  "True: the head commit is in another repository. The hub does not run such a run again (PRO-013)."
  fromFork: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  startedAt: DateTime
  url: String!
  "COMPLETED and not fromFork."
  rerunnable: Boolean!
  "rerunnable, and the conclusion is FAILURE, CANCELLED or TIMED_OUT."
  failedJobsRerunnable: Boolean!
  "QUEUED or IN_PROGRESS."
  cancellable: Boolean!
  "Costs one GitHub request for each run when selected."
  jobs: WorkflowJobs
}

type WorkflowRunEdge {
  cursor: String!
  node: WorkflowRun!
}

type WorkflowRunConnection {
  edges: [WorkflowRunEdge!]!
  pageInfo: PageInfo!
  read: ForgeRead!
}

"GitHub accepted the request; the run appears in workflowRuns a moment later."
type WorkflowDispatch {
  repository: ID!
  workflowId: ID!
  branch: String!
  acceptedAt: DateTime!
}

type Commit {
  repository: ID!
  "40 lower-case hex digits."
  sha: String!
  "The first line of the message, at most 200 characters. Text from GitHub."
  title: String!
  "The rest of the message, cut at 5,000 characters. Text from GitHub."
  message: String
  "The name in the commit. Text from GitHub."
  authorName: String!
  "The GitHub login, when GitHub matched one. Text from GitHub."
  authorLogin: String
  committedAt: DateTime!
  parents: [String!]!
  url: String!
  "Costs two GitHub requests for each commit when selected."
  checks: CommitChecks
}

type CommitEdge {
  cursor: String!
  node: Commit!
}

type CommitConnection {
  edges: [CommitEdge!]!
  pageInfo: PageInfo!
  read: ForgeRead!
}

type Branch {
  "Text from GitHub."
  name: String!
  sha: String!
  protected: Boolean!
  "True for the repository's default branch."
  default: Boolean!
}

type BranchEdge {
  cursor: String!
  node: Branch!
}

type BranchConnection {
  edges: [BranchEdge!]!
  pageInfo: PageInfo!
  read: ForgeRead!
}

"A release on GitHub. Not a release of Anima (type Release)."
type RepositoryRelease {
  "GitHub's release number, as digits."
  id: ID!
  "Text from GitHub."
  tag: String!
  "Text from GitHub."
  name: String
  draft: Boolean!
  prerelease: Boolean!
  "Text from GitHub."
  authorLogin: String
  createdAt: DateTime!
  publishedAt: DateTime
  url: String!
}

type RepositoryReleaseEdge {
  cursor: String!
  node: RepositoryRelease!
}

type RepositoryReleaseConnection {
  edges: [RepositoryReleaseEdge!]!
  pageInfo: PageInfo!
  read: ForgeRead!
}

enum CommitStatusState { PENDING SUCCESS FAILURE ERROR }

type CommitStatus {
  repository: ID!
  sha: String!
  context: String!
  state: CommitStatusState!
  description: String
  targetUrl: String
  createdAt: DateTime!
}

enum CodeEntryKind { FILE DIRECTORY SYMLINK SUBMODULE }

type CodeEntry {
  "One path segment. Text from GitHub."
  name: String!
  "From the repository root, no leading slash. Text from GitHub."
  path: String!
  kind: CodeEntryKind!
  "Bytes; 0 for anything but a FILE."
  size: Int!
  sha: String!
}

type CodeDirectory {
  repository: ID!
  "The branch name or commit asked for."
  ref: String!
  "Empty for the root."
  path: String!
  "Directories first, then by name."
  entries: [CodeEntry!]!
  "True: GitHub lists at most 1,000 entries of one directory and this one may have more."
  partial: Boolean!
  read: ForgeRead!
}

enum CodeFileContent {
  "text holds the file."
  TEXT
  "Not valid UTF-8, or it holds a NUL byte. No content is returned."
  BINARY
  "Larger than 1,000,000 bytes. No content is returned."
  TOO_LARGE
}

"Bytes from a repository: untrusted. The hub does not look for secrets in it and makes no promise that it holds none."
type CodeFile {
  repository: ID!
  ref: String!
  "The path GitHub read. When the path asked is a link to a file in the same repository, the path of that file."
  path: String!
  name: String!
  sha: String!
  "Bytes."
  size: Int!
  content: CodeFileContent!
  "Only for TEXT. Plain text: never render it as HTML and never run it."
  text: String
  "The file on GitHub (PRJ-010)."
  url: String!
  readAt: DateTime!
}

input NewIssueInput {
  repository: ID!
  "1 to 256 characters."
  title: String!
  "At most 65,536 characters."
  body: String
  "At most 20, each 1 to 50 characters."
  labels: [String!]
}

input MergePullRequestInput {
  repository: ID!
  number: Int!
  "The head commit the operator saw, 40 hex digits. CONFLICT when the head moved since."
  expectedHeadSha: String!
  method: MergeMethod!
  "True also merges an UNSTABLE pull request (a check that is not required failed). BLOCKED is never merged."
  allowFailingChecks: Boolean = false
  "Required for a pull request from a fork: must equal its headRepository."
  forkConfirmed: String
}

input PullRequestTargetInput {
  repository: ID!
  number: Int!
  expectedHeadSha: String!
}

enum MergeOutcome {
  MERGED
  "It was merged before this request. Nothing was changed."
  ALREADY_MERGED
  HEAD_MOVED
  "Conflict, a failed or missing check, a draft, or closed."
  NOT_MERGEABLE
  "GitHub had not computed whether it can merge. Try again."
  NOT_READY
  "From a fork: merge it alone, with forkConfirmed (PRO-013)."
  FORK_REFUSED
  "The repository does not allow this merge method."
  METHOD_REFUSED
  NOT_FOUND
  "GitHub refused or could not be reached. Nothing was changed."
  FAILED
  "The request was sent and no answer came. It may be merged: read the list again."
  UNKNOWN
  "The hub stopped before it reached this one (90 seconds for the whole request)."
  NOT_ATTEMPTED
}

type PullRequestMerge {
  repository: ID!
  number: Int!
  outcome: MergeOutcome!
  "Fixed words. Never a provider reply (LOG-007)."
  message: String!
  "Set for MERGED."
  mergeSha: String
}

"One named input of a workflow started by hand. The operator types the name; GitHub checks it (PRJ-035)."
input WorkflowInputValue {
  "1 to 100 characters: letters, digits, - and _."
  name: String!
  "At most 1,024 characters."
  value: String!
}

input DispatchWorkflowInput {
  repository: ID!
  workflowId: ID!
  "A branch of this repository."
  branch: String!
  "At most 25."
  inputs: [WorkflowInputValue!] = []
}

input CommitStatusInput {
  repository: ID!
  "40 hex digits."
  sha: String!
  state: CommitStatusState!
  "anima/ then 1 to 40 of a-z, 0-9 and -. Anima cannot write the context of another system."
  context: String!
  "At most 140 characters."
  description: String
  "Null, or an address below the hub's public origin."
  targetUrl: String
}

# ---------------------------------------------------------------- timeline and record links (E0-4, K-E3, K-E4)
# Operator, 2026-11-16; ruling number to be assigned. Requirement IDs: TML-001 to TML-007, RLK-001, RLK-002, RLK-004.

"The closed list of TML-004. A new value needs a change to docs/plans/extensions-plan.md."
enum EvidenceCategory { SLEEP WORKOUT VISIT TRAVEL CODE MESSAGE POST MEDIA READING SPENDING DOCUMENT DEVICE SESSION NOTE }

"How the source knows what an entry says (TML-003)."
enum EvidenceBasis { OBSERVED PLANNED OPERATOR_REPORTED INFERRED }

"One entry of the timeline. The hub makes it from a record of the owning domain when the timeline is read; it is not stored (TML-001)."
type Evidence {
  "The record this entry is made from, as kind:id (K-E4), for example event:0192f5a0-7c3e-7a52-9d1b-3f4e5a6b7c8d."
  reference: String!
  "The key of the source that recorded it, for example event_log."
  source: String!
  category: EvidenceCategory!
  "One line for a list."
  title: String!
  start: DateTime!
  "Null: the source gives no end time. Then uncertainty says so (TML-006)."
  end: DateTime
  "When the hub received the record, when that is later than the event, such as a delayed import (TML-009). It never replaces start. Null: the hub saw the event when it happened, as for the event log."
  receivedAt: DateTime
  basis: EvidenceBasis!
  "What the source does not say about this entry, one sentence each (TML-006)."
  uncertainty: [String!]!
  "The reference of the entry of a higher-ranked source for the same event (TML-005). The entry that has it is kept, not deleted. It is set only when both entries are among those read for this page."
  supersededBy: String
}

type EvidenceEdge {
  cursor: String!
  node: Evidence!
}

type EvidenceConnection {
  edges: [EvidenceEdge!]!
  pageInfo: PageInfo!
}

"A link from one record to another (RLK-001). Neither record has to exist (RLK-002)."
type RecordLink {
  id: ID!
  "The record the link starts at, as kind:id."
  source: String!
  "The record the link points to, as kind:id."
  target: String!
  "What the link means, in lower snake case, for example lent_to."
  kind: String!
  "The text to show for the target while it has no record (RLK-002). It is kept after the target has one."
  label: String
  "The name of the source record. Null: no domain gives one. A date or a repository key is its own name."
  sourceTitle: String
  "The name of the target record. Null: no domain gives one; show label."
  targetTitle: String
  createdAt: DateTime!
}

input RecordLinkInput {
  source: String!
  target: String!
  "Lower snake case, 1 to 40 characters, starts with a letter."
  kind: String!
  "One line of at most 200 characters."
  label: String
}

# ---------------------------------------------------------------- root types

type Query {
  me: Operator!

  sites: [Site!]!
  device(id: ID!): Device
  devices(filter: DeviceFilter, sort: DeviceSort = NAME, first: Int = 50, after: String): DeviceConnection!
  tags: [String!]!

  check(id: ID!): Check

  maintenanceWindows: [MaintenanceWindow!]!

  events(filter: EventFilter, first: Int = 100, after: String): EventConnection!
  "actorKind (operator, 2026-11-13, LOG-012 to LOG-020; ruling number to be assigned): only the entries of that kind; an entry with no recorded kind matches none (LOG-020)."
  audit(first: Int = 100, after: String, actorKind: ActorKind): AuditConnection!

  sessions(deviceId: ID, live: Boolean, first: Int = 50, after: String): SessionConnection!

  # Phase 3
  "Login or browser token only (D-23, R-100)."
  apiKeys: [ApiKey!]!
  checkDefaults: CheckDefaults!
  notificationChannels: [NotificationChannel!]!
  notificationSettings: NotificationSettings!
  deliveries(channelId: ID, first: Int = 50, after: String): DeliveryConnection!
  retention: [RetentionPeriod!]!

  # Phase 3: builds (WP-36, R-107)
  "Newest first (BLD-080)."
  releases(first: Int = 20, after: String): ReleaseConnection!
  "The highest version published or under way with the patch plus 1; null before the first."
  nextReleaseVersion: String
  "Whether this hub holds the release bucket and the updater key, so it can publish a release. createRelease is refused with CONFLICT when false. (R-118; PRO-037, PRO-038, OD-W20)"
  releasePublishing: Boolean!
  builders: [Builder!]!
  "Up to `first` (1 to 1000) stored lines after sequence `after`, oldest first (BLD-048)."
  buildJobLog(id: ID!, after: Int, first: Int = 500): [BuildLogLine!]!

  # Phase 3: VPN (VP-5)
  "The VPN picture; null when the hub has no LocalAPI proxy or has not read it yet (VPN-005)."
  vpn: VpnPicture
  "The Headscale server every Anima node logs in to; the desktop app takes its own VPN address only from a client logged in to it (ADR-005)."
  vpnLoginServer: String!

  # Engine and Projects (operator, 2026-11-13; ruling number to be assigned; K-E7, K-E1, XP-02)
  "All 15, in the order of the plan."
  extensions: [Extension!]!
  sources: [Source!]!
  sourceAccounts(sourceKey: String): [SourceAccount!]!
  "By name, then ID. leftOut false: the projects with at least one repository that is not left out. leftOut true: only the projects whose repositories are all left out. The two lists hold every project once. first is 1 to 200. CONFLICT while Projects is off."
  projects(leftOut: Boolean = false, first: Int = 50, after: String, browse: ProjectBrowse): ProjectConnection!
  "Any project, left out or not. Null when no project has this slug. CONFLICT while Projects is off."
  project(slug: String!): Project
  "The open attempt, or one that ended in the last 10 minutes; null otherwise. Open to a read key: it holds nothing secret."
  githubConnect: GithubConnectAttempt

  # Tool inventory (operator, 2026-11-15, CAP-020 to CAP-031; ruling number to be assigned)
  "Each device whose agent sent a tool inventory, by device name (byte order). tool: only the devices where that tool is usable. buildTarget: only the devices with that Rust target. A name the hub does not know matches no device (CAP-030). Open to a read key."
  capabilities(tool: String, buildTarget: String): [DeviceCapabilities!]!

  # Timeline and record links (operator, 2026-11-16; ruling number to be assigned; K-E3, K-E4)
  "What happened from `from` up to, not including, `to`, newest first: by start, then by reference, both descending. categories null: all; empty: none. first is 1 to 200. VALIDATION when to is not after from."
  timeline(from: DateTime!, to: DateTime!, categories: [EvidenceCategory!], first: Int = 100, after: String): EvidenceConnection!
  "The links that start or end at record (kind:id), newest first, at most 200. VALIDATION when record is not kind:id."
  recordLinks(record: String!): [RecordLink!]!

  # Projects: work, code and history (operator, 2026-11-13; ruling number to be assigned; PRJ-027 to PRJ-035, OD-E14)
  # Every field below: CONFLICT while Projects is off or while ProjectRepository.access is not READY; NOT_FOUND for an
  # unknown repository ID or a number, run or path GitHub does not have; VALIDATION (with extensions.fields) for a bad
  # first, after, ref, path, sha or text length; UNAVAILABLE when GitHub cannot be reached, limits requests, or answers
  # something the hub cannot use, and no earlier answer is held; FORBIDDEN for the token rules. No new code.
  # repository is always ProjectRepository.id. fresh true skips the cache (the hub still reuses an answer less than
  # 5 seconds old). A page cursor holds GitHub's page number and the page size: after with a different first is
  # VALIDATION. Pages are GitHub's pages, so a row can repeat or be skipped when the list changes between pages.
  "Newest updated first. first is 1 to 50. One GitHub request, and more for mergeability and checks when selected (PRJ-031, PRJ-033)."
  pullRequests(repository: ID!, state: OpenOrClosed = OPEN, first: Int = 20, after: String, fresh: Boolean = false): PullRequestConnection!
  "Null when the repository has no pull request with this number."
  pullRequest(repository: ID!, number: Int!, fresh: Boolean = false): PullRequest
  "Newest updated first; pull requests are not in it. first is 1 to 100. A page can hold fewer than first rows and still have a next page (PRJ-031)."
  issues(repository: ID!, state: OpenOrClosed = OPEN, first: Int = 30, after: String, fresh: Boolean = false): IssueConnection!
  "Null when the repository has no issue with this number, or the number is a pull request."
  issue(repository: ID!, number: Int!, fresh: Boolean = false): Issue
  "Oldest first. number is an issue or a pull request. first is 1 to 100."
  issueComments(repository: ID!, number: Int!, first: Int = 30, after: String, fresh: Boolean = false): IssueCommentConnection!
  "Every workflow of the repository, at most 100, by name (PRJ-035)."
  workflows(repository: ID!, fresh: Boolean = false): [Workflow!]!
  "Newest first. branch null: every branch. status null: every status. first is 1 to 50 (PRJ-031, PRJ-034)."
  workflowRuns(repository: ID!, branch: String, status: WorkflowRunStatus, first: Int = 20, after: String, fresh: Boolean = false): WorkflowRunConnection!
  "Null when the repository has no run with this number."
  workflowRun(repository: ID!, runId: ID!, fresh: Boolean = false): WorkflowRun
  "Newest first. ref is a branch name or a 40-digit commit; null: the default branch. first is 1 to 100."
  commits(repository: ID!, ref: String, first: Int = 30, after: String, fresh: Boolean = false): CommitConnection!
  "By name. first is 1 to 100."
  branches(repository: ID!, first: Int = 100, after: String, fresh: Boolean = false): BranchConnection!
  "Newest first. first is 1 to 100. Releases on GitHub, not releases of Anima."
  repositoryReleases(repository: ID!, first: Int = 20, after: String, fresh: Boolean = false): RepositoryReleaseConnection!
  "One directory. ref null: the default branch. path empty: the root. VALIDATION when the path is a file. Names only: open to a read key."
  codeDirectory(repository: ID!, ref: String, path: String = "", fresh: Boolean = false): CodeDirectory!
  "One file, never kept by the hub. VALIDATION when the path is a directory. No MCP tool returns it (operator, 2026-11-14; ruling number to be assigned). Login or browser token only (D-23, R-100)."
  codeFile(repository: ID!, ref: String, path: String!): CodeFile!

  # S6: the device link (FRN-009, OR-S6-3)
  "The devices the link permits, in the link's order (LNK-004)."
  linkDevices: [LinkDevice!]!
}

