[workspace]
resolver = "3"
members = ["crates/hub", "crates/guac-protocol", "crates/agent-core", "crates/agent", "crates/theme", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
async-graphql = { version = "7.2", default-features = false, features = ["chrono", "dataloader"] }
async-graphql-axum = "7.2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs"] }
http-body-util = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "registry"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["derive", "postgres", "uuid", "runtime-tokio", "migrate", "macros", "chrono", "json", "ipnet"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
ipnet = "2"
serde_json = "1"
unicode-normalization = "0.1"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1.9"
sha2 = { version = "0.11", features = ["zeroize"] }
base64 = "0.23"
static_assertions = "1.1"
tempfile = "3.27"
surge-ping = "0.9"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
bytes = "1.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
getrandom = "0.4"
rpassword = "7.5"
# The hub's own HTTP/1 serving, for header deadlines and connection caps (SEC-001, NET-002).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# SSH host-key probe and connection test (WP-10 T3, R-032 E-3). `ring` is the crypto backend
# (no OpenSSL, no CMake); `rsa` so RSA host keys and RSA private keys work.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
# The files tunnel's SFTP client over a link channel (WP-27 D-7, RA-032). Protocol only, on
# tokio, Apache-2.0; its server half serves the test SSH server's `sftp` subsystem.
russh-sftp = { version = "3.0.1", default-features = false }
# RFC 6238 TOTP (WP-05 T6): HMAC-SHA-1 from RustCrypto, constant-time comparison.
hmac = "0.13"
sha1 = "0.11"
subtle = "2.6"
# Notification e-mail (WP-45 T1, D-17): SMTP over rustls (ring) with the webpki roots, on tokio.
# No native-tls or OpenSSL, no connection pool, no `hostname` lookup; implicit TLS or STARTTLS only.
# Never enable lettre's `tracing` feature: it logs every SMTP line, AUTH credentials included (LOG-007).
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "ring", "webpki-roots"] }

# Desktop shell (WP-16): Tauri 2 and the OS key store. keyring 3.x: macOS Keychain and Linux
# Secret Service (pure-Rust crypto, no OpenSSL). Its `mock` builder ships in the crate for tests.
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
tauri-build = "2"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service", "crypto-rust"] }
# Desktop releases (WP-04 stage B, R-006, R-053): self-update, relaunch and the process log.
# The updater fetches over rustls (ring), not OpenSSL; `zip` unpacks the Linux updater archive.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-process = "2.4"
tauri-plugin-log = { version = "2.10", default-features = false }
# "Add this machine" (R-058, R-060): the interface addresses, to find this computer's VPN
# address, and the OS user name of the process.
if-addrs = "0.15"
whoami = { version = "2.1", default-features = false, features = ["std"] }
# Reads the agent's launchd property list in its tests (WP-54 T4, MET-019).
plist = "1"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
mod_module_files = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# argon2id with OWASP parameters takes seconds unoptimised; login tests run it often.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
