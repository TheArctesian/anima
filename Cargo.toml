[workspace]
resolver = "3"
members = ["crates/hub", "crates/guac-protocol", "crates/theme"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
async-graphql = { version = "7.2", default-features = false, features = ["chrono", "dataloader"] }
async-graphql-axum = "7.2"
axum = "0.8"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["derive", "postgres", "uuid", "runtime-tokio", "macros", "migrate", "chrono", "json", "ipnet"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ipnet = "2"
serde_json = "1"
unicode-normalization = "0.1"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1.9"
sha2 = { version = "0.11", features = ["zeroize"] }
base64 = "0.23"
static_assertions = "1.1"
tempfile = "3.27"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
getrandom = "0.4"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
mod_module_files = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
