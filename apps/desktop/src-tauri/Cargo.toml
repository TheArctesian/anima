[package]
name = "anima-app"
description = "Anima shell for desktop and mobile: window, key store and bundle (REPO-003, MOB-001)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The shell is a library so that iOS and Android can load it (MOB-001). The desktop program
# below starts it.
[lib]
name = "anima_app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anima-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# `unstable`: child web views in the main window and moving them to a window of their own
# (`Window::add_child`, `Webview::reparent`) for device web views (WEB-004, D-3).
# `tray-icon`: the menu bar or tray item of the stay-awake control (AWK-004).
# Not `workspace = true`: the Tauri CLI does not read the features of an inherited dependency, so it
# would not see `tray-icon` and the AppImage would not carry libayatana-appindicator3. The library of
# the system then loads beside the older GLib of the AppImage and the application stops at start.
# Keep the version and the first two features the same as the workspace entry.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "unstable", "tray-icon"] }
# `generate_context!` parses the `plugins` config in tauri.conf.json with serde_json.
serde_json.workspace = true

# The phone keeps its web view above the on-screen keyboard (mobile plan M4-1).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-keyboard = { path = "../keyboard" }
tauri-plugin-runner = { path = "../runner" }
# The device link in the app (MOB-031): its answers, its errors and the invite wiped after use (MOB-035).
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# The sign-in to the Anima.ing account on a phone (mobile plan M3-4): the calls of WorkOS and of the cloud,
# the waits between them, the random part of the phone's device name, and the page of the sign-in in the
# browser of the phone.
reqwest.workspace = true
tokio.workspace = true
getrandom = "0.3"
tauri-plugin-opener = "2"
# The sign-in inside the iPhone app (mobile plan M3-5): the page of iOS, the code challenge (PKCE) and the
# listener at the loopback return address.
tauri-plugin-account-session = { path = "../account-session" }
sha2.workspace = true
base64.workspace = true

# The dependencies of the desktop application. A phone has the window, the access token, the link and the account sign-in only, so it
# builds none of them (MOB-002, MOB-003).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The Settings panel for `anima mcp` reads and saves permissions through the command line's own library (MCP-018).
anima-cli = { path = "../../../crates/anima-cli" }

keyring.workspace = true
serde.workspace = true
thiserror.workspace = true
tauri-plugin-log.workspace = true
whoami.workspace = true
# Certificate pins and the leaf-certificate probe for device web views (WEB-008, D-9).
sha2.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["process"] }
# Device IDs name each device's web store (WEB-006, D-2).
uuid.workspace = true
# Challenge hosts go through the URL standard's host parser, as pinned origins do (D-4).
url = "2"
# The daemon's enrolment code in memory only as `Zeroizing` (MET-019). The builder holds no updater
# key: the hub signs the updater file (R-117).
zeroize.workspace = true
# The updater public key line in the app's `tauri.conf.json`, for the tool check (R-108).
base64.workspace = true
# The upload of a job's files to the presigned URLs the hub gives (BLD-060, BLD-063).
reqwest.workspace = true
# A name for the daemon file while it is placed (MET-019).
getrandom = "0.3"
# Self-update and relaunch: desktop only, registered only in release builds (UPD-001).
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
# Native dialogs from Rust only (no JavaScript API is granted): the recovery confirmation that
# script in the web view cannot answer (F-9), and the save dialog for a copy of the hub key (2.8).
tauri-plugin-dialog = "2"

# Cancelling a build step kills the step's whole process group (BLD-027); on Linux the shell is
# the child subreaper of every step process and reaps what escaped the group (S-1). `user`: the
# user ID the daemon's install folder must belong to (MET-019). `fs`: whether this user may write a
# folder for the command line tool (INS-009).
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user", "fs"] }

# pidfd_open and pidfd_send_signal for the reaper (D-20): nix 0.31 has neither. `fs`: the POSIX
# ACL read on the daemon's install folders (MET-019), as the daemon's own check reads it.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Downcasts keyring's macOS PlatformFailure to tell a refused Keychain prompt from a failure;
# `macos-12` reads a server's certificate chain for the web-view trust hook (WEB-008, R-069).
security-framework = { version = "3", features = ["macos-12"] }
core-foundation = "0.10"
# The web-view trust hook: a navigation-delegate proxy in front of wry's (OD-7, R-069).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSURLAuthenticationChallenge", "NSURLProtectionSpace", "NSURLCredential", "NSURLSession"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKNavigationDelegate"] }

[dev-dependencies]
# The mock runtime the updater proof runs the real updater plugin in (tests/updater).
tauri = { workspace = true, features = ["unstable", "tray-icon", "test"] }
rcgen.workspace = true
# The reference minisign implementation signs the feed the updater proof serves (tests/updater).
minisign = "0.10"
tempfile.workspace = true

# R-069's proof that the macOS trust hook cancels a mismatched certificate, in a real
# WKWebView. Not libtest: Tauri's event loop must own the main thread (tests/pinning/main.rs).
[[test]]
name = "pinning"
path = "tests/pinning/main.rs"
harness = false

# The workspace lints, copied, with `unsafe_code = "deny"` in place of `forbid`: the macOS
# web-view trust hook (`src/web_view/macos_trust.rs`) is the one module allowed `unsafe`
# (R-069). Keep the rest in step with the root `[workspace.lints]`.
[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
mod_module_files = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"


[target.'cfg(target_os = "windows")'.dependencies]
anima-windows = { path = "../../../crates/anima-windows" }
keyring = { workspace = true, features = ["windows-native"] }
open = "5"
