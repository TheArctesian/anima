[package]
name = "anima-desktop"
description = "Anima desktop shell: window, key store and bundle (REPO-003)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "anima-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
keyring.workspace = true
serde.workspace = true
thiserror.workspace = true
tauri-plugin-log.workspace = true
# `generate_context!` parses the `plugins` config in tauri.conf.json with serde_json.
serde_json.workspace = true
if-addrs.workspace = true
whoami.workspace = true
# Certificate pins and the leaf-certificate probe for device web views (WEB-008, D-9).
sha2.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio.workspace = true

# Self-update and relaunch: desktop only, registered only in release builds (UPD-001).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true

# Downcasts keyring's macOS PlatformFailure to tell a refused Keychain prompt from a failure.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true
