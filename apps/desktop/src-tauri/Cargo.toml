[package]
name = "anima-desktop"
description = "Anima desktop shell: window, key store and bundle (REPO-003)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "anima-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
keyring.workspace = true
serde.workspace = true
thiserror.workspace = true

# Downcasts keyring's macOS PlatformFailure to tell a refused Keychain prompt from a failure.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
