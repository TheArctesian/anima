<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents on all devices and routing mockups</title>
<style>
/* Layout: a review board for R-234. Frame 1 is the Agents page with the agents of all devices
   (agent-tools-as-extensions.md Section 6.8, AXT-046 to AXT-052). Frame 2 is the routing log and the pins
   (jobs.md, ROU-004 to ROU-006, ROU-011). Not approved. No font, script or image comes from a third party. */
:root {
  color-scheme: dark;
  --pg-bg: #101214; --pg-fg: #E6E7E9; --pg-muted: #A4A8B0; --pg-rule: #2C3036;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light; --pg-bg: #E6E8EB; --pg-fg: #1D2024; --pg-muted: #5A5F68; --pg-rule: #C9CDD3;
} }

/* The app's own tokens, copied from design/tokens (Graphite palette, status roles, sizes, type), as in the other mockups.
   A frame is dark (.gd) or light (.gl). Maintenance uses aurora-15 (#B48EAD) in both; the light text value is not checked. */
.gd {
  --surface-base: #1B1D21; --surface-raised: #23262B; --surface-hover: #2A2D33; --border-subtle: #34383E; --border-strong: #6C7076;
  --text: #E6E7E9; --text-secondary: #A4A8B0; --accent: #88C0D0;
  --status-up: #A3BE8C; --status-down: #BF616A; --status-degraded: #EBCB8B; --status-maintenance: #B48EAD; --status-unknown: #7B8089;
}
.gl {
  --surface-base: #F6F7F8; --surface-raised: #FFFFFF; --surface-hover: #ECEEF0; --border-subtle: #D8DBDF; --border-strong: #86898E;
  --text: #1D2024; --text-secondary: #5A5F68; --accent: #2E6E80;
  --status-up: #4F7A3A; --status-down: #A8424C; --status-degraded: #9A7215; --status-maintenance: #B48EAD; --status-unknown: #7B8089;
}
.gd, .gl {
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem;
  --text-sm: 0.8125rem; --text-md: 0.875rem; --text-lg: 1rem; --text-display: 2.25rem;
  --leading-tight: 1.2; --leading-normal: 1.5; --tracking-tight: -0.03em;
  --weight-light: 200; --weight-medium: 500; --radius-md: 4px; --radius-pill: 999px; --border-thin: 1px;
  --control-sm: 1.75rem; --control-md: 2rem;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px 48px; background: var(--pg-bg); color: var(--pg-fg); font-family: var(--font-ui); }
h1.board { margin: 0 0 4px; font-weight: 200; font-size: 28px; }
p.about { margin: 0 0 24px; color: var(--pg-muted); font-size: 14px; max-width: 70ch; }
.frames { display: grid; gap: 32px; }
figure { margin: 0; }
figcaption { margin-top: 6px; font-size: 12px; color: var(--pg-muted); max-width: 90ch; }
.frame { max-inline-size: 1040px; border: var(--border-thin) solid var(--pg-rule); background: var(--surface-base); color: var(--text); font-size: var(--text-md); }
.pad { padding: var(--space-8); display: grid; gap: var(--space-6); }
h2 { margin: 0; font-weight: var(--weight-light); font-size: var(--text-display); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); }
h3 { margin: 0; font-size: var(--text-lg); font-weight: var(--weight-medium); }
.muted { color: var(--text-secondary); font-size: var(--text-sm); }
.banner { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-md); background: var(--surface-raised); border: var(--border-thin) solid var(--border-subtle); }
.dot { inline-size: 0.75rem; block-size: 0.75rem; border-radius: 50%; flex: none; }
.sq { border-radius: 2px; }
.tri { clip-path: polygon(50% 0, 100% 100%, 0 100%); border-radius: 0; }
.up { background: var(--status-up); } .down { background: var(--status-down); } .deg { background: var(--status-degraded); }
.mnt { background: var(--status-maintenance); } .nod { background: var(--status-unknown); }
.comp { display: grid; gap: var(--space-2); padding-block: var(--space-3); border-block-end: var(--border-thin) solid var(--border-subtle); }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.bars { display: grid; grid-template-columns: repeat(90, 1fr); gap: 2px; block-size: 1.75rem; }
.bars i { display: block; border-radius: 1px; }
.legend { display: flex; gap: var(--space-4); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: var(--space-1); }
.inc { padding: var(--space-4); border-inline-start: 3px solid var(--status-degraded); background: var(--surface-raised); display: grid; gap: var(--space-1); }
.app { display: grid; grid-template-columns: 13rem 1fr; min-block-size: 30rem; }
.side { border-inline-end: var(--border-thin) solid var(--border-subtle); padding: var(--space-6) var(--space-4); display: grid; gap: var(--space-2); align-content: start; }
.nav { color: var(--text-secondary); } .nav.on { color: var(--text); font-weight: var(--weight-medium); }
.group { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); margin-block-start: var(--space-3); }
table { border-collapse: collapse; inline-size: 100%; }
th, td { text-align: start; padding: var(--space-2) var(--space-3); border-block-end: var(--border-thin) solid var(--border-subtle); vertical-align: top; }
th { font-weight: var(--weight-medium); color: var(--text-secondary); font-size: var(--text-sm); }
.btn { display: inline-flex; align-items: center; block-size: var(--control-sm); padding: 0 var(--space-3); border: var(--border-thin) solid var(--border-strong); border-radius: var(--radius-md); font-size: var(--text-sm); }
.btn.pri { background: var(--accent); color: var(--surface-base); border-color: var(--accent); }
.chip { display: inline-block; padding: 0 var(--space-2); border-radius: var(--radius-pill); border: var(--border-thin) solid var(--border-subtle); font-size: 0.75rem; color: var(--text-secondary); }
.warn { color: var(--status-down); font-size: var(--text-sm); }
code { font-family: var(--font-mono); font-size: 0.8125rem; }
</style>
</head>
<body>
<h1 class="board">Agents on all devices, and routing</h1>

</div>
</body>
