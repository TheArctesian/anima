<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anima — UI mockup</title>
<style>
/* Fonts (Section 5.2). Mockup only: loaded from GitHub at a pinned commit. The app bundles them (UI-017). */
@font-face{font-family:"OpenDyslexic Nerd Font Propo";src:url("https://raw.githubusercontent.com/ryanoasis/nerd-fonts/f034eeafc0ccf79afa8dd952feb86b18e5d0469e/patched-fonts/OpenDyslexic/Regular/OpenDyslexicNerdFontPropo-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"OpenDyslexic Nerd Font Propo";src:url("https://raw.githubusercontent.com/ryanoasis/nerd-fonts/f034eeafc0ccf79afa8dd952feb86b18e5d0469e/patched-fonts/OpenDyslexic/Regular/OpenDyslexicNerdFontPropo-Bold.otf") format("opentype");font-weight:600 700;font-display:swap}
@font-face{font-family:"OpenDyslexicM Nerd Font Mono";src:url("https://raw.githubusercontent.com/ryanoasis/nerd-fonts/f034eeafc0ccf79afa8dd952feb86b18e5d0469e/patched-fonts/OpenDyslexic/Mono-Regular/OpenDyslexicMNerdFontMono-Regular.otf") format("opentype");font-display:swap}

/* ------------------------------------------------------------------
   Tokens: design-spec §5.1. Every colour below derives from these.
   Tints use color-mix() on a token, never a literal colour.
   ------------------------------------------------------------------ */
:root{
  --bg:#2E3440;            /* nord0  */
  --surface:#3B4252;       /* nord1  */
  --surface-raised:#434C5E;/* nord2  */
  --border:#4C566A;        /* nord3  */
  --text:#ECEFF4;          /* nord6  */
  --text-muted:#D8DEE9;    /* nord4  */
  --accent:#88C0D0;        /* nord8  */
  --accent-alt:#81A1C1;    /* nord9  */
  --accent-deep:#5E81AC;   /* nord10 */
  --info:#8FBCBB;          /* nord7  */
  --status-up:#A3BE8C;     /* nord14 */
  --status-down:#BF616A;   /* nord11 */
  --status-degraded:#EBCB8B;/* nord13 */
  --status-warning:#D08770;/* nord12 */
  --status-maintenance:#B48EAD;/* nord15 */
  --status-unknown:#4C566A;/* nord3  */

  --on-accent:var(--bg);   /* UI-004 */
  --font-ui:"OpenDyslexic Nerd Font Propo",system-ui,sans-serif;
  --font-mono:"OpenDyslexicM Nerd Font Mono",ui-monospace,monospace;
  --font-icon:"OpenDyslexic Nerd Font Propo";
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-sm:4px;--r:6px;--r-lg:8px;
  --shadow:0 12px 32px color-mix(in srgb,var(--bg) 85%,transparent),0 0 0 1px var(--border);
  --dur:140ms;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:20px} h2{font-size:15px} h3{font-size:13px}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:12px}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;font-size:16px;font-size:16px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-icon);font-style:normal;font-weight:400;line-height:1;vertical-align:-3px;overflow:hidden;letter-spacing:0}
.ic.sm{width:14px;height:14px;font-size:14px}
.ic.lg{width:20px;height:20px;font-size:20px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--s3) var(--s2);gap:var(--s1);min-height:0}
.brand{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2) var(--s4);font-weight:650;font-size:15px;letter-spacing:.01em}
.brand svg{width:24px;height:24px;color:var(--accent)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;width:100%;display:flex;align-items:center;gap:var(--s3);height:36px;padding:0 var(--s3);border:0;background:none;border-radius:var(--r);cursor:pointer;color:var(--text-muted);text-align:left}
.nav-item:hover{background:var(--surface-raised);color:var(--text)}
.nav-item[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .nav-count{margin-left:auto;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.nav-hub{padding:var(--s2) var(--s2) var(--s3)}
.nav-foot{padding:var(--s2) 0 var(--s2);border-top:1px solid var(--border)}
.hub{display:flex;gap:var(--s2);align-items:flex-start}
.hub .ic{margin-top:2px}
.hub.ok .ic{color:var(--status-up)} .hub.bad .ic{color:var(--status-down)}
.hub b{font-weight:600;display:block}
.hub .mono{color:var(--text-muted);font-size:11px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
#view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- buttons & controls ---------- */
.btn{height:28px;padding:0 var(--s3);border-radius:var(--r);border:1px solid var(--border);background:var(--surface-raised);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background var(--dur),border-color var(--dur)}
.btn:hover{border-color:var(--accent-alt)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 85%,var(--text));border-color:transparent}
.btn-primary:active{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--text)}
.btn-secondary{background:color-mix(in srgb,var(--accent-alt) 14%,transparent);border-color:color-mix(in srgb,var(--accent-alt) 60%,transparent)}
.btn-secondary .ic{color:var(--accent-alt)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-raised);border-color:transparent}
.btn-danger{background:var(--status-down);border-color:var(--status-down);color:var(--bg);font-weight:600}
.btn-danger-ghost{background:transparent;border-color:color-mix(in srgb,var(--status-down) 60%,transparent)}
.btn-danger-ghost .ic{color:var(--status-down)}
.btn-warning{background:var(--status-warning);border-color:var(--status-warning);color:var(--bg);font-weight:600}
.btn-sm{height:24px;padding:0 var(--s2);font-size:12px;gap:4px}
.icon-btn{width:28px;padding:0}
.btn-sm.icon-btn{width:24px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:4px;min-height:24px}
.link:hover{text-decoration:underline}
.input,select.input,textarea.input{height:28px;width:100%;padding:0 var(--s2);border-radius:var(--r);border:1px solid var(--border);background:var(--surface-raised);color:var(--text)}
textarea.input{height:auto;padding:var(--s2);resize:vertical;min-height:84px}
.input::placeholder{color:var(--text-muted);opacity:.6;font-style:italic}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);outline:none}
.input[aria-invalid="true"]{border-color:var(--status-down)}
select.input{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px;background-size:4px 4px;background-repeat:no-repeat}
.search{position:relative;flex:1 1 180px;max-width:280px;min-width:150px}
.search .ic{position:absolute;left:8px;top:6px;color:var(--text-muted)}
.search .input{padding-left:30px;padding-right:34px}
.search kbd{position:absolute;right:6px;top:5px}
kbd{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid var(--border);color:var(--text-muted);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{height:26px;min-width:28px;padding:0 var(--s2);border:0;background:none;cursor:pointer;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--surface-raised);color:var(--accent);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:var(--s2);background:none;border:0;padding:0;cursor:pointer;min-height:24px}
.switch .track{width:30px;height:18px;border-radius:9px;background:var(--bg);border:1px solid var(--border);position:relative;flex:none;transition:background var(--dur)}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text-muted);transition:transform var(--dur),background var(--dur)}
.switch[aria-checked="true"] .track{background:color-mix(in srgb,var(--accent) 30%,var(--bg));border-color:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(12px);background:var(--accent)}
.switch.warn[aria-checked="true"] .track{background:color-mix(in srgb,var(--status-maintenance) 30%,var(--bg));border-color:var(--status-maintenance)}
.switch.warn[aria-checked="true"] .track::after{background:var(--status-maintenance)}

/* ---------- status ---------- */
.st-up{--c:var(--status-up)} .st-down{--c:var(--status-down)} .st-degraded{--c:var(--status-degraded)}
.st-maintenance{--c:var(--status-maintenance)} .st-unknown{--c:var(--status-unknown)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:11px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 15%,transparent);font-size:12px;font-weight:600;white-space:nowrap;color:var(--text)}
.pill .ic{width:14px;height:14px;font-size:14px;color:var(--c)}
.pill.st-unknown{border-style:dashed;border-color:var(--text-muted);background:transparent}
.pill.st-unknown .ic{color:var(--text-muted)}
.sev{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.sev .ic{width:14px;height:14px;font-size:14px}
.sev-info .ic{color:var(--info)} .sev-warning .ic{color:var(--status-warning)} .sev-error .ic{color:var(--status-down)}
.hb{display:flex;gap:2px;height:22px;align-items:flex-end;padding:3px;background:var(--bg);border-radius:var(--r-sm)}
.hb.tall{height:36px;padding:4px;gap:3px}
.hb .b{flex:1 1 0;min-width:2px;height:100%;border-radius:1.5px;background:var(--c)}
.hb .b.st-degraded{height:62%}
.hb .b.st-down{background:repeating-linear-gradient(135deg,var(--status-down) 0 3px,color-mix(in srgb,var(--status-down) 45%,var(--bg)) 3px 5px)}
.hb .b.st-unknown,.hb .b.nodata{height:28%;background:var(--status-unknown)}
.hb .b.nodata{opacity:.5}
.hb .b.new{animation:pop .5s ease-out}
@keyframes pop{from{transform:scaleY(.2);filter:brightness(1.6)}to{transform:none}}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:11px;color:var(--text-muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:6px;height:12px;border-radius:1.5px;background:var(--c)}
.legend i.st-degraded{height:8px} .legend i.st-down{background:repeating-linear-gradient(135deg,var(--status-down) 0 3px,color-mix(in srgb,var(--status-down) 45%,var(--bg)) 3px 5px)}
.legend i.st-unknown{height:4px}

/* ---------- page head ---------- */
.page-head{padding:var(--s4) var(--s6) var(--s3);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:var(--s3)}
.title-row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.title-row .summary{color:var(--text-muted);font-size:12px;display:flex;gap:var(--s3);flex-wrap:wrap}
.summary b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.toolbar[hidden]{display:none}
.toolbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.chips{display:flex;gap:var(--s1);flex-wrap:wrap}
.chip{height:26px;padding:0 var(--s2) 0 6px;border-radius:13px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);font-size:12px}
.chip .ic{width:14px;height:14px;font-size:14px;color:var(--c)}
.chip.st-unknown .ic{color:var(--text-muted)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--text-muted);font-weight:600}
.chip:hover{border-color:var(--accent-alt);color:var(--text)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));border-color:var(--c,var(--accent));color:var(--text)}
.chip.st-unknown[aria-pressed="true"]{border-color:var(--text-muted)}
.chip[aria-pressed="true"] .n{color:var(--text)}
.divider-v{width:1px;height:20px;background:var(--border)}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:200px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--s1)}
.menu.right{left:auto;right:0}
.menu.up{top:auto;bottom:calc(100% + 4px)}
.menu[hidden]{display:none}
.menu h4{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;padding:var(--s2) var(--s2) var(--s1)}
.menu-item{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:28px;padding:0 var(--s2);border:0;background:none;border-radius:var(--r-sm);cursor:pointer;text-align:left}
.menu-item:hover,.menu-item:focus-visible{background:var(--surface-raised);outline:none}
.menu-item .chk{width:14px;height:14px;color:var(--accent);visibility:hidden}
.menu-item[aria-checked="true"] .chk{visibility:visible}
.menu-item .kbd{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--border);margin:var(--s1) 0}
.tagdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-alt)}
.badge-count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* ---------- device list ---------- */
.page-body{flex:1;min-height:0;overflow:auto;padding:var(--s4) var(--s6) var(--s6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:var(--s3)}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s3) var(--s3) var(--s3) calc(var(--s3) + 2px);display:flex;flex-direction:column;gap:var(--s3);transition:border-color var(--dur),background var(--dur);box-shadow:inset 3px 0 0 var(--c)}
.card:hover{border-color:var(--accent-alt);background:color-mix(in srgb,var(--surface-raised) 45%,var(--surface))}
.card:focus-within{border-color:var(--accent-alt)}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--c) 22%,var(--surface))}100%{background:var(--surface)}}
.card-top{display:flex;align-items:flex-start;gap:var(--s2)}
.card-id{min-width:0;flex:1}
.card-name{background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:14px;text-align:left;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.card-name::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg)}
.card-name:focus-visible{outline:none}
.card-name:focus-visible::after{outline:2px solid var(--accent);outline-offset:1px}
.host{color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:-4px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;background:var(--surface-raised);color:var(--text-muted);font-size:11px}
.hb-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:11px;color:var(--text-muted)}
.uptime{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;font-size:12px}
.uptime small{color:var(--text-muted);font-weight:400;font-size:11px}
.metrics{display:grid;grid-template-columns:auto 1fr auto;column-gap:var(--s2);row-gap:3px;align-items:center;font-size:11px}
.metrics .ml{color:var(--text-muted);width:30px}
.mbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;display:block}
.mbar i{display:block;height:100%;border-radius:3px;background:var(--accent-alt);transition:width .6s ease}
.mv{font-variant-numeric:tabular-nums;text-align:right;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end;gap:3px}
.hi .mbar i{background:var(--status-degraded)}
.hi .mv{color:var(--status-degraded);font-weight:600}
.mv .ic{width:12px;height:12px;font-size:12px;color:var(--status-degraded)}
.nometrics{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;height:42px;padding:0 var(--s2);border:1px dashed var(--border);border-radius:var(--r)}
.card-actions{display:flex;align-items:center;gap:var(--s2);position:relative;z-index:1}
.card-actions .spacer{flex:1}
.card-actions .note{font-size:11px;color:var(--text-muted)}
.btn-remote{height:26px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.02em}
@media (max-width:1500px){.devtable .btn-remote .rl{display:none}.devtable .btn-remote.btn-sm{padding:0 6px;gap:2px}}

.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--bg);text-align:left;font-weight:600;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:var(--s2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:6px var(--s2);border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);vertical-align:middle}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--surface-raised) 50%,transparent)}
.tbl .sort-btn{background:none;border:0;padding:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;gap:2px;align-items:center;min-height:24px}
.tbl .sort-btn[data-active="true"]{color:var(--accent)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .hb{width:100%;min-width:120px;height:18px}
.devtable{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:auto}
@media (max-width:1360px){.col-tags{display:none}}
.devtable .tbl th{background:var(--surface)}
.cell-name{display:flex;flex-direction:column;min-width:0}
.cell-name button{font-weight:600;font-size:13px}
.tbl .mini{display:flex;align-items:center;gap:6px;min-width:96px}
.tbl .mini .mbar{flex:1;min-width:30px}
.tbl.hiv .hi{color:var(--status-degraded)}

/* ---------- empty ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s3);padding:var(--s8) var(--s4);color:var(--text-muted);max-width:460px;margin:var(--s8) auto}
.empty .glyph{width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent-alt)}
.empty .glyph .ic{width:28px;height:28px;font-size:28px}
.empty h2{color:var(--text);font-size:16px}
.empty .row{display:flex;gap:var(--s2);margin-top:var(--s2)}
.soon{margin-top:var(--s4);width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s3) var(--s4)}
.soon h3{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--s2)}
.soon ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.soon li{display:flex;gap:var(--s2);align-items:center;color:var(--text-muted)}

/* ---------- logs panel ---------- */
.logs{border-top:1px solid var(--border);background:var(--surface);flex:none;display:flex;flex-direction:column}
.logs-head{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s6) 0 var(--s4);min-height:38px;flex-wrap:wrap}
.logs-toggle{background:none;border:0;display:flex;align-items:center;gap:var(--s2);cursor:pointer;height:32px;padding:0 var(--s2);border-radius:var(--r);font-weight:600}
.logs-toggle:hover{background:var(--surface-raised)}
.logs-toggle .chev{transition:transform var(--dur)}
.logs.open .logs-toggle .chev{transform:rotate(180deg)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-muted)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--status-up);box-shadow:0 0 0 0 color-mix(in srgb,var(--status-up) 60%,transparent);animation:pulse 2s infinite}
.live.off::before{background:var(--status-unknown);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--status-up) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.logs-filters{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-left:auto;padding:4px 0}
.logs-filters select.input{width:auto;height:26px;font-size:12px}
.logs-body{height:0;overflow:auto;border-top:1px solid transparent}
.logs.open .logs-body{height:clamp(120px,24vh,220px);border-top-color:var(--border)}
.logtbl td{padding:4px var(--s2);font-size:12px}
.logtbl td.t{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);white-space:nowrap;width:1%}
.logtbl td.src{color:var(--text-muted);white-space:nowrap;width:1%}
.logtbl td.dev{white-space:nowrap;width:1%}
.logtbl td.sevc{width:1%;white-space:nowrap}
.logtbl tr.new td{animation:rowin 1.6s ease-out}
@keyframes rowin{from{background:color-mix(in srgb,var(--accent) 16%,transparent)}to{background:transparent}}
.logtbl th{background:var(--surface)}

/* ---------- tab strip (sessions) ---------- */
.tabstrip{display:flex;align-items:flex-end;gap:2px;padding:6px var(--s3) 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex:none}
.stab{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 var(--s3);border:1px solid transparent;border-bottom:0;border-radius:var(--r) var(--r) 0 0;background:none;color:var(--text-muted);cursor:pointer;max-width:220px;white-space:nowrap;position:relative;top:1px}
.stab:hover{background:var(--surface-raised);color:var(--text)}
.stab[aria-selected="true"]{background:var(--bg);color:var(--text);border-color:var(--border)}
.stab .lbl{overflow:hidden;text-overflow:ellipsis}
.stab .proto{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--surface-raised);color:var(--text-muted)}
.stab .state .ic{width:12px;height:12px;font-size:12px}
.stab .x{width:22px;height:22px;border:0;background:none;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer}
.stab .x:hover{background:var(--surface-raised);color:var(--text)}
.stab-home{padding-right:var(--s3)}
.st-dot-connecting{color:var(--accent)} .st-dot-connected{color:var(--status-up)} .st-dot-disconnected{color:var(--status-down)} .st-dot-warning{color:var(--status-warning)}

/* ---------- banner ---------- */
.banner{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s6);background:color-mix(in srgb,var(--status-down) 18%,var(--bg));border-bottom:1px solid color-mix(in srgb,var(--status-down) 60%,transparent);font-size:12px}
.banner .ic{color:var(--status-down)}

/* ---------- detail ---------- */
.detail-head{padding:var(--s3) var(--s6) 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:var(--s2)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.dt-row{display:flex;align-items:center;gap:var(--s3);flex-wrap:nowrap;min-width:0;padding-top:var(--s1)}
.dt-row h1{white-space:nowrap;flex:none}
.dt-row .crumbs,.dt-row [data-live-status],.dt-row .btn,.dt-row .menu-wrap{flex:none}
.btn-setup{background:transparent;border:1px dashed var(--border);color:var(--text-muted)}
.btn-setup:hover{border-color:var(--accent-alt);color:var(--text);background:var(--surface-raised)}
.dt-sub{display:flex;align-items:center;gap:var(--s2);flex-wrap:nowrap;min-width:0;padding-right:24px;margin-right:calc(-1 * var(--s3));overflow:hidden;white-space:nowrap;color:var(--text-muted);font-size:12px;-webkit-mask-image:linear-gradient(to right,black calc(100% - 24px),transparent);mask-image:linear-gradient(to right,black calc(100% - 24px),transparent)}
.dt-sub > *{flex:none}
.dt-row .spacer{flex:1 0 0}
.dt-sub .sep{opacity:.6}
.tabs{display:flex;gap:var(--s1);margin-top:var(--s1)}
.tab{height:34px;padding:0 var(--s3);border:0;background:none;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:11px;color:var(--text-muted);font-weight:600}
.detail-body{flex:1;min-height:0;overflow:auto;padding:var(--s4) var(--s6) var(--s6)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4)}
.panel-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.panel-head .sub{color:var(--text-muted);font-size:12px}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s3)}
.tile .k{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.tile .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.tile .v small{font-size:12px;color:var(--text-muted);font-weight:400}
.tile .d{font-size:11px;color:var(--text-muted);margin-top:2px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s3)}
.chart{background:var(--bg);border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:var(--r);padding:var(--s2) var(--s3) var(--s2)}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--s1);gap:var(--s2)}
.chart-head b{font-size:12px}
.chart-head .now{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-muted)}
.chart-head .now strong{color:var(--text);font-size:14px}
.chart-plot{position:relative;height:120px;margin-left:56px}
.chart-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart-plot .yl{position:absolute;left:-56px;width:50px;white-space:nowrap;text-align:right;font-size:10px;color:var(--text-muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.chart-x{display:flex;justify-content:space-between;margin-left:56px;font-size:10px;color:var(--text-muted);margin-top:4px}
.chart-hover{position:absolute;top:0;bottom:0;width:1px;background:var(--text-muted);pointer-events:none;display:none}
.chart-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px 6px;font-size:11px;white-space:nowrap;pointer-events:none;display:none;font-variant-numeric:tabular-nums;z-index:2}
.chart-legend{display:flex;gap:var(--s3);font-size:11px;color:var(--text-muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:4px}
.chart-legend i{width:12px;height:0;border-top:2px solid var(--c)}
.chart-legend i.dash{border-top-style:dashed}
.disks{display:flex;flex-direction:column;gap:var(--s2)}
.disk{display:grid;grid-template-columns:minmax(80px,140px) 1fr minmax(150px,max-content);gap:var(--s3);align-items:center;font-size:12px}
.disk .mbar{height:8px}
.disk .mv{text-align:right;justify-content:flex-end;color:var(--text-muted)}
.disk.hi .mv{color:var(--status-degraded)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px var(--s4);font-size:12px}
.kv dt{color:var(--text-muted)} .kv dd{margin:0}
.notice{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s2) var(--s3);border-radius:var(--r);font-size:12px;border:1px solid var(--border);background:var(--bg)}
.notice .ic{margin-top:1px}
.notice.info .ic{color:var(--info)}
.notice.warn{border-color:color-mix(in srgb,var(--status-warning) 70%,transparent);background:color-mix(in srgb,var(--status-warning) 10%,var(--bg))}
.notice.warn .ic{color:var(--status-warning)}
.notice.err{border-color:color-mix(in srgb,var(--status-down) 70%,transparent);background:color-mix(in srgb,var(--status-down) 10%,var(--bg))}
.notice.err .ic{color:var(--status-down)}
.notice.maint{border-color:color-mix(in srgb,var(--status-maintenance) 70%,transparent);background:color-mix(in srgb,var(--status-maintenance) 10%,var(--bg))}
.notice.maint .ic{color:var(--status-maintenance)}
.type-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:var(--r-sm);background:var(--surface-raised);color:var(--text);white-space:nowrap}
.checks-tbl tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.checks-tbl tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.checks-tbl .rowbtn{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--text);display:flex;flex-direction:column;min-height:24px}
.tls-warn{color:var(--status-degraded);font-weight:600;display:inline-flex;gap:3px;align-items:center}
.failures{display:flex;flex-direction:column;gap:2px;font-size:12px}
.failures div{display:grid;grid-template-columns:auto auto 1fr;gap:var(--s3);padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)}

/* ---------- form ---------- */
.form{display:flex;flex-direction:column;gap:var(--s5)}
.fsec{display:flex;flex-direction:column;gap:var(--s3)}
.fsec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);display:flex;align-items:center;gap:var(--s2)}
.fsec>h3::after{content:"";flex:1;height:1px;background:var(--border)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .lab{font-size:12px;color:var(--text-muted);font-weight:500}
.f label .req{color:var(--text-muted);font-weight:400}
.f .hint{font-size:11px;color:var(--text-muted)}
.f .err{font-size:11px;color:var(--text);display:none;align-items:center;gap:4px}
.f .err .ic{width:12px;height:12px;font-size:12px;color:var(--status-down)}
.f .err.show{display:flex}
.f.narrow{max-width:120px}
.pw{position:relative}
.pw .input{padding-right:32px}
.pw .eye{position:absolute;right:2px;top:2px;height:24px;width:24px;border:0;background:none;color:var(--text-muted);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}
.pw .eye:hover{color:var(--text);background:var(--surface)}
.subcard{border:1px solid var(--border);border-radius:var(--r-lg);background:color-mix(in srgb,var(--bg) 40%,var(--surface));overflow:hidden}
.subcard-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);min-height:40px}
.subcard-head .t{font-weight:600;display:flex;align-items:center;gap:6px}
.subcard-head .t .ic{color:var(--accent-alt)}
.subcard-head .d{color:var(--text-muted);font-size:12px}
.subcard-body{padding:var(--s3);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:var(--s3)}
.stored{display:flex;align-items:center;gap:var(--s2);height:28px;padding:0 4px 0 var(--s2);border-radius:var(--r);border:1px dashed var(--border);font-size:12px;color:var(--text-muted)}
.stored .ic{color:var(--status-up)}
.stored .btn{margin-left:auto}
.tagbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:28px;padding:2px 4px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-raised);cursor:text}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.tagbox .tag{background:var(--surface);color:var(--text);gap:2px;padding-right:2px;height:20px}
.tagbox .tag button{width:16px;height:16px;border:0;background:none;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;padding:0}
.tagbox .tag button:hover{color:var(--text);background:var(--surface-raised)}
.tagbox input{flex:1;min-width:80px;border:0;background:none;height:22px;outline:none}
.radio-row{display:flex;gap:var(--s4);flex-wrap:wrap;min-height:28px;align-items:center}
.radio-row label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--text);font-size:13px}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;margin:0}
.cbx{display:inline-flex;gap:var(--s2);align-items:center;cursor:pointer;min-height:24px}
.check-ed{border:1px solid var(--border);border-radius:var(--r-lg);background:color-mix(in srgb,var(--bg) 40%,var(--surface))}
.check-ed-head{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s2) 6px var(--s3);border-bottom:1px solid var(--border)}
.check-ed-head .sum{color:var(--text-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.check-ed-body{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.check-ed details summary{cursor:pointer;color:var(--text-muted);font-size:12px;min-height:24px;display:flex;align-items:center;gap:6px;list-style:none}
.check-ed details summary::-webkit-details-marker{display:none}
.check-ed details summary .ic{transition:transform var(--dur)}
.check-ed details[open] summary .ic{transform:rotate(90deg)}
.check-ed details .frow{margin-top:var(--s2)}
.add-check{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:12px;color:var(--text-muted)}
.test-res{display:flex;flex-direction:column;gap:4px;font-size:12px}
.test-res .r{display:flex;gap:var(--s2);align-items:flex-start}
.test-res .r .ic{width:14px;height:14px;font-size:14px;margin-top:2px}
.test-res .ok .ic{color:var(--status-up)} .test-res .fail .ic{color:var(--status-down)} .test-res .run .ic{color:var(--accent)}
.err-summary{display:flex;gap:var(--s2);align-items:center}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.form-tab-wrap{max-width:820px}
.form-footer{position:sticky;bottom:calc(-1 * var(--s6));margin:var(--s5) calc(-1 * var(--s6)) calc(-1 * var(--s6));padding:var(--s3) var(--s6);background:var(--bg);border-top:1px solid var(--border);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent);display:flex;align-items:center;justify-content:center;padding:var(--s6);z-index:100;animation:fade .14s ease-out}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(760px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;animation:rise .18s ease-out}

@keyframes rise{from{transform:translateY(8px);opacity:0}}
.dialog-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--border)}
.dialog-head h2{font-size:16px}
.dialog-head .sub{color:var(--text-muted);font-size:12px}
.dialog-head .close{margin-left:auto}
.dialog-body{padding:var(--s5);overflow:auto;flex:1}
.dialog-foot{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s5);border-top:1px solid var(--border);flex-wrap:wrap}
.dialog.warn{box-shadow:var(--shadow),inset 0 3px 0 var(--status-warning)}
.dialog.warn .dialog-head .ic.lg{color:var(--status-warning)}
.dialog.danger .dialog-head .ic.lg{color:var(--status-down)}
.fp{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s3);font-size:12px;padding:var(--s3);background:var(--bg);border-radius:var(--r);border:1px solid var(--border);margin:var(--s3) 0}
.fp dt{color:var(--text-muted)} .fp dd{margin:0;font-family:var(--font-mono);font-size:12px;word-break:break-all}
.fp dd.new{color:var(--text);border-left:2px solid var(--status-warning);padding-left:6px}
.delete-list{margin:var(--s2) 0 0;padding-left:var(--s5);color:var(--text-muted)}
.delete-list li{margin:2px 0}

/* ---------- sessions ---------- */
.session{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.sess-bar{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s3);border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--bg)}
.sess-bar{flex-wrap:nowrap}
.sess-bar .who{display:flex;align-items:center;gap:var(--s2);min-width:0;margin-right:auto;flex:1 1 0;overflow:hidden;white-space:nowrap}
.sess-bar .who>*{flex:none}.sess-bar .who .mono{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1400px){.sess-bar .bl{display:none}}
.sess-bar .who b{font-weight:600}
.sess-stage{flex:1;min-height:0;position:relative;overflow:hidden}
.term{position:absolute;inset:0;overflow:auto;padding:var(--s3) var(--s4);font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--text-muted);background:var(--bg);white-space:pre-wrap;word-break:break-all;cursor:text}
.term:focus-within{outline:2px solid var(--accent);outline-offset:-2px;border-radius:0}
.term .u{color:var(--status-up);font-weight:600} .term .p{color:var(--accent)} .term .dir{color:var(--accent-alt);font-weight:600}
.term .exe{color:var(--status-up)} .term .w{color:var(--status-degraded)} .term .e{color:var(--status-down)} .term .dim{color:var(--text-muted);opacity:.85}
.term .typed{color:var(--text)}
.cursor{display:inline-block;width:.6em;height:1.15em;vertical-align:text-bottom;background:var(--text);animation:blink 1.06s steps(1) infinite;margin-left:1px}
.term:not(:focus-within) .cursor{background:transparent;outline:1px solid var(--text-muted);outline-offset:-1px;animation:none}
@keyframes blink{50%{opacity:0}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 78%,transparent);z-index:5;padding:var(--s4)}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--s5);width:min(440px,100%);display:flex;flex-direction:column;gap:var(--s3)}
.ov-card.err{box-shadow:var(--shadow),inset 0 3px 0 var(--status-down)}
.ov-card.warn{box-shadow:var(--shadow),inset 0 3px 0 var(--status-warning)}
.ov-card h2{display:flex;align-items:center;gap:var(--s2)}
.ov-card.err h2 .ic{color:var(--status-down)} .ov-card.warn h2 .ic{color:var(--status-warning)}
.ov-card .reason{font-family:var(--font-mono);font-size:12px;background:var(--bg);border-radius:var(--r);padding:var(--s2) var(--s3);color:var(--text-muted);border:1px solid var(--border)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px}
.steps li{display:flex;align-items:center;gap:var(--s2);color:var(--text-muted)}
.steps li .ic{width:14px;height:14px;font-size:14px}
.steps li.done{color:var(--text)} .steps li.done .ic{color:var(--status-up)}
.steps li.cur{color:var(--text)} .steps li.cur .ic{color:var(--accent)}
.steps li.fail .ic{color:var(--status-down)} .steps li.failw .ic{color:var(--status-warning)}
.steps li.todo .ic{opacity:.5}
.rdp-stage{position:absolute;inset:0;background:var(--bg);display:flex;align-items:stretch;justify-content:stretch}
.rdp-desk{flex:1;position:relative;background:radial-gradient(120% 90% at 75% 15%,color-mix(in srgb,var(--accent-deep) 75%,var(--bg)) 0%,var(--bg) 70%);overflow:hidden;cursor:default;user-select:none}
.rdp-desk .dicons{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:18px}

.rdp-desk .dicon span:first-child{width:36px;height:36px;border-radius:6px;background:color-mix(in srgb,var(--surface-raised) 85%,transparent);display:flex;align-items:center;justify-content:center;color:var(--accent)}

.rdp-win .tb .dots{margin-left:auto;display:flex;gap:12px;color:var(--text-muted)}
.rdp-win .wb{padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rdp-win .drv{border:1px solid var(--border);border-radius:4px;padding:8px;font-size:11px;display:flex;flex-direction:column;gap:6px}
.rdp-task{position:absolute;left:0;right:0;bottom:0;height:40px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px}
.rdp-task span{width:28px;height:28px;border-radius:5px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;color:var(--accent-alt)}
.rdp-task .clock{position:absolute;right:14px;font-size:11px;color:var(--text);width:auto;background:none;font-variant-numeric:tabular-nums}
.rdp-res{position:absolute;right:10px;top:10px;font-size:11px;background:color-mix(in srgb,var(--bg) 80%,transparent);border:1px solid var(--border);padding:2px 8px;border-radius:10px;color:var(--text-muted);z-index:2}
.clip-pop{width:300px;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}

.menu.menu-float{position:fixed;top:0;left:0}
.web-menu{min-width:260px;max-width:min(380px,calc(100vw - 16px))}
.web-item{min-height:40px;padding:4px var(--s2)}
.web-item>.ic{color:var(--accent-alt)}
.web-item .wi{display:flex;flex-direction:column;min-width:0;flex:1}
.web-item .wi b{font-weight:600}
.web-item .wi .mono{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.web-item .via{flex:none;font-size:11px;color:var(--text-muted)}
.web-bar{gap:var(--s1)}
.addr{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:var(--s1);height:28px;padding:0 3px;margin:0 var(--s1);border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.addr:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.addr .url{flex:1;min-width:0;height:24px;padding:0 4px;border:0;background:none;color:var(--text);text-overflow:ellipsis}
.addr .url:focus-visible{outline:none}
.addr .tls{flex:none;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border:0;border-radius:var(--r-sm);background:none;color:var(--text);cursor:pointer;font-size:11px;font-weight:600}
.addr .tls:hover{background:var(--surface-raised)}
.addr .tls .ic{color:var(--text-muted)}
.addr .tls.ok .ic,.addr .tls.pinned .ic{color:var(--status-up)}
.addr .tls.insecure .ic,.addr .tls.untrusted .ic{color:var(--status-warning)}
.route-badge{flex:none;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);font-size:11px;font-weight:600;white-space:nowrap}
.route-badge .ic{width:12px;height:12px;font-size:12px}
.web-stage{position:absolute;inset:0;overflow:auto;background:color-mix(in srgb,var(--text-muted) 45%,var(--text));color:var(--bg)}
.web-stage :focus-visible{outline-color:var(--accent-deep)}

.wf-blank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:var(--s2);color:var(--border);font-size:12px}
.wf-top{height:48px;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);background:var(--text);border-bottom:1px solid var(--text-muted)}
.wf-top .wf-bar{width:120px}
.wf-top .wf-bar.s{width:56px;margin-left:auto}
.wf-img{flex:none;width:28px;height:28px;border:1px solid var(--border);border-radius:var(--r-sm);background:linear-gradient(to top right,transparent calc(50% - .6px),var(--border) 50%,transparent calc(50% + .6px)),linear-gradient(to bottom right,transparent calc(50% - .6px),var(--border) 50%,transparent calc(50% + .6px))}
.wf-bar{display:block;height:8px;border-radius:4px;background:var(--text-muted)}
.wf-card{width:min(380px,calc(100% - 32px));margin:48px auto var(--s4);background:var(--text);border:1px solid var(--text-muted);border-radius:var(--r-lg);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s3)}
.wf-card h2{color:var(--bg);font-size:17px}
.wf-sub{color:var(--border);font-size:12px;overflow-wrap:anywhere}
.wf-lab{font-size:12px;color:var(--border);margin-bottom:calc(-1 * var(--s2))}

.wf-note .ic{width:14px;height:14px;font-size:14px;margin-top:1px}
.wf-note .mono{font-size:11px;overflow-wrap:anywhere}
.wf-dash{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:calc(100% - 48px)}
.wf-side{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);border-right:1px solid var(--text-muted);background:color-mix(in srgb,var(--text-muted) 25%,var(--text))}
.wf-main{padding:var(--s5);display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s3);align-content:start}
.wf-main h2{grid-column:1/-1;color:var(--bg);font-size:17px}
.wf-box{height:110px;padding:var(--s3);border:1px solid var(--text-muted);border-radius:var(--r);background:var(--text);display:flex;flex-direction:column;gap:var(--s2)}
.wf-box.wide{grid-column:1/-1;height:160px}
.wf-box .wf-bar:first-child{width:50%;background:var(--border)}
.ov-card.wide{width:min(560px,100%)}
.ov-card .fp{margin:0}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.web-ed .check-ed-head .t{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}

#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:var(--s2);z-index:200;pointer-events:none;align-items:center}
.toast{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r);padding:var(--s2) var(--s3);box-shadow:var(--shadow);display:flex;gap:var(--s2);align-items:center;font-size:12px;animation:rise .18s ease-out;max-width:520px}
.toast .ic{color:var(--info)}
.toast.ok .ic{color:var(--status-up)} .toast.warn .ic{color:var(--status-warning)} .toast.err .ic{color:var(--status-down)}
.mock-badge{margin-top:auto;padding:var(--s2) var(--s1);display:flex;flex-direction:column;align-items:stretch;gap:6px}
.mock-badge .btn{width:100%;justify-content:flex-start}
.mock-badge .tagline{font-size:11px;font-weight:700;letter-spacing:.04em;padding:0 10px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px dashed var(--status-maintenance);background:color-mix(in srgb,var(--status-maintenance) 18%,var(--bg));color:var(--text)}

@media (max-width:1100px){

  .nav-item{justify-content:center;padding:0}
  .hub{justify-content:center}
  .mock-badge .btn{justify-content:center;padding:0}
  .mock-badge .tagline{padding:0 4px;font-size:10px}
  .page-head,.detail-head{padding-left:var(--s4);padding-right:var(--s4)}
  .page-body,.detail-body{padding-left:var(--s4);padding-right:var(--s4)}
  .form-footer{margin-left:calc(-1 * var(--s4));margin-right:calc(-1 * var(--s4));padding-left:var(--s4);padding-right:var(--s4)}
  .col-tags,.col-disk,.col-vram{display:none}
}
@media (max-width:960px){
  .tbl .hb{min-width:90px}
  .col-mem{display:none}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .cursor{opacity:1}
}

function deviceBeats(d, n = 50){

})();

function summaryHTML(){
  const list = visibleDevices();

function filteredDevices(){
  const q = S.search.trim().toLowerCase();
  let list = visibleDevices().filter(d => {
    if (S.statusFilter.size && !S.statusFilter.has(statusOf(d))) return false;
    if (S.tagFilter.size && !d.tags.some(t => S.tagFilter.has(t))) return false;
    if (q && !(d.name.toLowerCase().includes(q) || d.host.toLowerCase().includes(q) || (d.ip||'').includes(q) || d.tags.some(t=>t.includes(q)))) return false;
    return true;
  });
  const k = S.sort.key, dir = S.sort.dir;
  list.sort((a,b) => {
    let r = 0;
    if (k==='name') r = a.name.localeCompare(b.name);
    else if (k==='status') r = SORT_RANK[statusOf(a)] - SORT_RANK[statusOf(b)];
    else if (k==='uptime') r = (uptimeOf(a) ?? 101) - (uptimeOf(b) ?? 101);
    return (r || a.name.localeCompare(b.name)) * dir;
  });
  return list;
}
function hbBar(beats, n = 50, cls = ''){
  const arr = beats.slice(-n);
  const pad = n - arr.length;
  const counts = {up:0,degraded:0,down:0,maintenance:0,unknown:0};
  arr.forEach(b => b && counts[b.s]++);
  const label = `Last ${arr.length} heartbeats: ${Object.entries(counts).filter(([,v])=>v).map(([k,v])=>`${v} ${STATUS[k].label.toLowerCase()}`).join(', ') || 'no data'}`;
  return `<div class="hb ${cls}" role="img" aria-label="${label}">${'<i class="b nodata"></i>'.repeat(pad)}${arr.map(b => b
    ? `<i class="b st-${b.s}" title="${fmtDT(b.t)}:${pad2(new Date(b.t).getSeconds())} · ${STATUS[b.s].label}${b.ms!=null?` · ${b.ms} ms`:''}${b.err?` · ${esc(b.err)}`:''}"></i>`
    : '<i class="b nodata"></i>').join('')}</div>`;
}

const TIME_RANGES = {'1h':3600e3, '24h':86400e3, '7d':7*86400e3};
function logPass(e, f, devFixed){
  if (f.sev!=='all' && e.sev!==f.sev) return false;
  if (devFixed){ if (e.dev!==devFixed) return false; }
  else if (f.dev && f.dev!=='all' && e.dev!==f.dev) return false;
  if (f.src!=='all' && e.src!==f.src) return false;
  if (Date.now()-e.t > TIME_RANGES[f.time]) return false;
  return true;
}
function logRow(e, showDev = true, isNew = false){

  return `${sel('time',[['1h','Last hour'],['24h','Last 24 hours'],['7d','Last 7 days']],'Time')}

function renderLogsPanel(){

/* ---------- charts ---------- */
const CHARTS = {};
function genSeries(d, key, range){
  const r = mulberry32(hash(d.id+key+range));
  const n = {'1h':120,'24h':144,'7d':168}[range];
  const step = TIME_RANGES[range]/n;
  const gk = key.match(/^gpu(\d+)(util|vram)$/);
  let cur = gk ? d.m.gpus[+gk[1]][gk[2]] : key==='netIn'?d.m.netIn: key==='netOut'?d.m.netOut: key==='load'?d.m.load[0]: d.m[key];
  const vol = key.startsWith('net') ? cur*.25 : key==='load' ? .3 : key==='mem' || (gk&&gk[2]==='vram') ? 1.2 : 6;
  const out = new Array(n);
  let v = cur;
  for (let i=n-1;i>=0;i--){
    out[i] = {t: Date.now()-(n-1-i)*step - (d.stale?47*60e3:0), v};
    v = v + (r()-.5)*vol*2 + (range==='7d' && key==='cpu' && (i%24<3) ? 8 : 0);
    if (key.startsWith('net')) v = Math.max(1e3, v); else if (key==='load') v = Math.max(0, v); else v = clamp(v, 1, 99);
  }
  return out;
}
function niceMax(v, unit){ if (unit==='%') return 100; const p = Math.pow(10, Math.floor(Math.log10(v||1))); for (const m of [1,2,2.5,5,10]) if (m*p >= v) return m*p; return 10*p; }
function fmtVal(v, unit){ if (unit==='%') return Math.round(v)+'%'; if (unit==='B/s') return fmtBytes(v)+'/s'; if (unit==='ms') return Math.round(v)+' ms'; return v.toFixed(2); }
function chartHTML(d, id, title, series, unit, sub){
  const data = series.map(s => ({...s, pts: genSeries(d, s.key, S.range)}));
  return chartFrame('ch-'+id, title, data, unit, sub, S.range);
}
function chartFrame(cid, title, data, unit, sub, range, threshold){
  const max = niceMax(Math.max(...data.flatMap(s=>s.pts.map(p=>p.v ?? 0)), threshold||0)*1.1, unit);
  const W = 600, H = 120;
  const n = data[0].pts.length;
  const x = i => i/(n-1)*W, y = v => H - v/max*H;
  CHARTS[cid] = {data, unit, max};
  const paths = data.map(s => {
    let dstr = '', open = false;
    s.pts.forEach((p,i) => { if (p.v==null){ open=false; return; } dstr += (open?'L':'M') + x(i).toFixed(1)+' '+y(p.v).toFixed(1); open = true; });
    const area = data.length===1 ? `<path d="${dstr} L${W} ${H} L0 ${H} Z" fill="var(${s.c})" fill-opacity=".12" stroke="none"/>` : '';
    return `${area}<path d="${dstr}" fill="none" stroke="var(${s.c})" stroke-width="1.6" vector-effect="non-scaling-stroke" ${s.dash?'stroke-dasharray="5 3"':''} stroke-linejoin="round"/>`;
  }).join('');
  const grid = [0,.25,.5,.75,1].map(f => `<line x1="0" x2="${W}" y1="${H*f}" y2="${H*f}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke" ${f<1?'stroke-dasharray="2 4"':''}/>`).join('');
  const thr = threshold ? `<line x1="0" x2="${W}" y1="${y(threshold)}" y2="${y(threshold)}" stroke="var(--status-degraded)" stroke-width="1" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>` : '';
  const ylab = [1,.5,0].map(f => `<span class="yl" style="top:${(1-f)*100}%">${fmtVal(max*f, unit).replace('.0 ',' ')}</span>`).join('');
  const t0 = data[0].pts[0].t, t1 = data[0].pts[n-1].t;
  const xl = [0,.25,.5,.75,1].map(f => { const t = t0+(t1-t0)*f; return range==='7d' ? `${new Date(t).getDate()} ${MONTHS[new Date(t).getMonth()]}` : fmtTime(t).slice(0,5); });
  const lastV = data.map(s => { const lp = [...s.pts].reverse().find(p=>p.v!=null); return lp ? lp.v : null; });
  return `<div class="chart">
    <div class="chart-head"><b>${title}</b><span class="now">${data.length>1?`<span class="chart-legend">${data.map((s,i)=>`<span><i class="${s.dash?'dash':''}" style="--c:var(${s.c})"></i>${s.label} <strong style="font-size:12px">${lastV[i]!=null?fmtVal(lastV[i],unit):'—'}</strong></span>`).join('')}</span>`:`<strong>${lastV[0]!=null?fmtVal(lastV[0],unit):'—'}</strong>${sub?` · ${sub}`:''}`}</span></div>
    ${threshold?`<div class="chart-legend" style="margin-bottom:12px"><span><i style="--c:var(--accent)"></i>Response time</span><span><i class="dash" style="--c:var(--status-degraded)"></i>Degraded limit ${threshold} ms</span></div>`:''}
    <div class="chart-plot" data-chart="${cid}" role="img" aria-label="${esc(title)} chart, ${range}. Latest ${lastV[0]!=null?fmtVal(lastV[0],unit):'no data'}.">
      ${ylab}
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${grid}${thr}${paths}</svg>
      <div class="chart-hover"></div><div class="chart-tip"></div>
    </div>
    <div class="chart-x">${xl.map(l=>`<span>${l}</span>`).join('')}</div>
  </div>`;
}
function bindCharts(){
  $$('[data-chart]').forEach(el => {
    if (el._bound) return; el._bound = true;
    const hv = $('.chart-hover', el), tip = $('.chart-tip', el);
    el.addEventListener('mousemove', ev => {
      const c = CHARTS[el.dataset.chart]; if (!c) return;
      const r = el.getBoundingClientRect();
      const f = clamp((ev.clientX - r.left)/r.width, 0, 1);
      const n = c.data[0].pts.length, i = Math.round(f*(n-1));
      const px = i/(n-1)*r.width;
      hv.style.display = tip.style.display = 'block';
      hv.style.left = px+'px'; tip.style.left = clamp(px, 50, r.width-50)+'px';
      const p0 = c.data[0].pts[i];
      tip.innerHTML = `${fmtDT(p0.t)} · ` + c.data.map(s => `${c.data.length>1?s.label+' ':''}${s.pts[i].v!=null?fmtVal(s.pts[i].v,c.unit):'no data'}`).join(' · ');
    });
    el.addEventListener('mouseleave', () => { hv.style.display = tip.style.display = 'none'; });
  });
}

        <td>${c.paused?`<span class="pill st-unknown">${icon('pause')}<span>Paused</span></span>`:pill(st)}</td>
        <td class="num">${lb&&lb.ms!=null&&!c.paused?`${lb.ms} ms`:'<span class="muted">—</span>'}</td>

      </tr>`; }).join('')}
    </tbody></table></div>
    <section class="panel">

/* =====================================================================
   Sessions
   ===================================================================== */
let sessSeq = 1;
function openSession(id, proto){
  if (S.scenario.hubDown) return toast('Not available: this computer is not on the network.', 'err');
  const d = dev(id);
  const s = {id:'s'+(sessSeq++), deviceId:id, proto, state:'connecting', step:0, lines:[], input:'', hist:[], hi:-1, started:Date.now(), popped:false, hostKey:false, reasonTitle:'', reason:''};
  S.sessions.push(s); S.activeTab = s.id;
  renderView(); runConnect(s);
}
function connectSteps(s){
  const d = dev(s.deviceId), port = protoPort(d, s.proto);
  if (s.proto==='vnc') return ['Request a session token from the hub','Open the tunnel (WSS)',`Gateway connects to ${d.ip||d.host}:${port}`,'Authenticate with the VNC password','Start the display'];
  return s.proto==='ssh'
    ? ['Request a session token from the hub','Open the tunnel (WSS)',`Gateway connects to ${d.ip||d.host}:${port}`,'Check the host key',`Sign in as ${d.ssh.user}`]
    : ['Request a session token from the hub','Open the tunnel (WSS)',`Gateway connects to ${d.ip||d.host}:${port}`,`Negotiate security (${d.rdp.security.toUpperCase()})`,`Sign in as ${d.rdp.user}`,'Start the display'];
}
function runConnect(s){
  const d = dev(s.deviceId);
  s.state='connecting'; s.step=0; s.hostKey=false; s.failStep=null;
  const steps = connectSteps(s);
  const fast = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const next = () => {
    if (!S.sessions.includes(s)) return;
    if (s.step===2 && statusOf(d)==='down'){ s.failStep=2; return disconnect(s,'Could not connect',`Gateway could not reach ${d.ip||d.host}:${protoPort(d, s.proto)}: connection timed out after 15 s.`, true); }
    if (s.step===3 && s.proto==='ssh' && d.hostKeyChanged){ s.failStep=3; s.hostKey=true; disconnect(s,'Connection stopped: host key changed','The host key from the device does not match the recorded key. The hub stopped the connection before sign-in.', true);
      addLog({sev:'warning', src:'Session', dev:d.id, msg:'SSH host key changed (ED25519). Hub stopped the connection.'}); onNewLog();
      openModal({type:'hostkey', id:d.id}); return; }
    s.step++;
    if (s.step >= steps.length){ s.state='connected'; s.connectedAt=Date.now(); initSessionContent(s);
      addLog({sev:'info', src:'Session', dev:d.id, msg:`${s.proto.toUpperCase()} session started by ${OPERATOR} from ${CLIENT}.`}); onNewLog();
      refreshSession(s); return; }
    refreshSession(s); setTimeout(next, fast?120:380);
  };
  refreshSession(s); setTimeout(next, fast?120:420);
}
function disconnect(s, title, reason, failed = false){
  s.state = 'disconnected'; s.reasonTitle = title; s.reason = reason; s.failed = failed;
  refreshSession(s);
}
function refreshSession(s){
  renderTabstrip();
  if (S.activeTab!==s.id) return;
  const ae = document.activeElement, keep = s.proto==='web' && $('#view').contains(ae) && ae.dataset?.action;
  $('#view').innerHTML = sessionHTML(s); afterSessionRender(s);
  if (keep && !$('.sess-stage [autofocus]')){ const el = $(`#view [data-action="${keep}"]`); if (el && !el.disabled) el.focus({preventScroll:true}); }
}
function initSessionContent(s){
  const d = dev(s.deviceId);
  if (s.proto!=='ssh' || s.lines.length) return;
  const last = new Date(Date.now()-ri(2,40)*3600e3);
  if (d.os==='macOS') s.lines.push(`<span class="dim">Last login: ${last.toDateString()} ${fmtTime(last)} on ttys001</span>`);
  else if (d.name==='opnsense') s.lines.push(`<span class="dim">----------------------------------------------\n|      Hello, this is OPNsense 25.7            |\n----------------------------------------------</span>`);
  else s.lines.push(`<span class="dim">Linux ${esc(d.name)} 6.8.12-4-pve #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux\n\nLast login: ${last.toDateString()} ${fmtTime(last)} from ${CLIENT}</span>`);

function loadWeb(s){
  const d = dev(s.deviceId);

  s.timer = setTimeout(() => {
    if (!S.sessions.includes(s)) return;
    const u = new URL(s.url), port = u.port || (u.protocol==='https:'?443:80);
    if (statusOf(d)==='down'){
      s.state = 'disconnected'; s.web = 'error';
      s.reasonTitle = `Could not reach ${d.name}`;
      s.reason = `Connection to ${u.hostname}:${port} timed out after 15 s.`;
      addLog({sev:'warning', src:'Session', dev:d.id, msg:`Web interface ${s.label} did not load: connection to ${u.hostname}:${port} timed out.`}); onNewLog();
      return refreshSession(s);
    }
    if (u.protocol==='https:' && d.selfSigned && !d.certPins[certKey(s)]){ s.state = 'disconnected'; s.web = 'cert'; s.warn = true; return refreshSession(s); }
    s.state = 'connected'; s.web = 'loaded';
    if (!s.connectedAt){ s.connectedAt = Date.now();
      addLog({sev:'info', src:'Session', dev:d.id, msg:`Web session to ${s.label} (${s.url}) started by ${OPERATOR} from ${CLIENT}.`}); onNewLog(); }

function webPageUrl(s){ return s.pages[s.pi]==='home' ? s.url.replace(/\/$/,'') + '/home' : s.url; }
function webTls(s){

    if (dr.ssh.enabled) plan.push({label:`SSH on port ${dr.ssh.port}`, detail: unreachable?'Connection timed out':(known?.hostKeyChanged?'Port open, but the host key does not match the recorded key':`Signed in as ${dr.ssh.user || '?'} · host key ED25519 SHA256:p1Vn…Qe2A`), ok:!unreachable && !known?.hostKeyChanged});
    if (dr.rdp.enabled) plan.push({label:`RDP on port ${dr.rdp.port}`, detail: unreachable?'Connection timed out':`${dr.rdp.security.toUpperCase()} negotiated · signed in as ${dr.rdp.user||'?'}`, ok:!unreachable});
    if (dr.vnc.enabled) plan.push({label:`VNC on port ${dr.vnc.port}`, detail: unreachable?'Connection timed out':'RFB 3.8 · password accepted', ok:!unreachable});
    { const verr = validate(dr); dr.web.forEach((w,wi) => { const bad = !!verr[`web.${wi}.url`]; const sc = known?.selfSigned && w.url.startsWith('https:'); plan.push({label:`Web interface ${webLabel(w)||'(no URL)'}`, detail: bad?'The URL is not valid':unreachable?'Failed: connection timed out':`200 OK${sc?' · self-signed certificate: you confirm it at the first visit':''}`, ok:!bad&&!unreachable}); }); }

  }
  F.test = {done:false, results:[]};
  const sec = () => $(`#${F.ctx}-test`);
  const draw = () => { const el = sec(); if (el) el.innerHTML = '<h3>Connection test</h3>' + testHTML(); };
  let i = 0;
  const step = () => {
    if (S.form!==F) return;
    if (i>0) F.test.results[i-1].state = plan[i-1].ok ? 'ok' : 'fail';
    if (i < plan.length && (i===0 || plan[i-1].ok)){ F.test.results.push({label:plan[i].label, detail:'Testing…', state:'run'}); F.test.results[i].detail = 'Testing…'; draw(); const k=i; i++; setTimeout(()=>{ F.test.results[k].detail = plan[k].detail; step(); }, 420); return; }
    F.test.done = true; draw(); sec()?.scrollIntoView({block:'nearest'});
    const ok = F.test.results.every(r=>r.state==='ok');
    toast(ok ? 'Connection test passed.' : 'Connection test failed. See the results.', ok?'ok':'err');
  };
  step(); sec()?.scrollIntoView({block:'nearest'});
}

document.addEventListener('keydown', ev => {
  const t = ev.target;

  if (t.dataset?.term){
    const s = S.sessions.find(x=>x.id===t.dataset.term); if (!s || s.state!=='connected') return;
    const inEl = () => $('#term-in-'+s.id);
    if (ev.metaKey) return;
    if (ev.ctrlKey && ev.key==='c'){ ev.preventDefault(); s.lines.push(promptHTML(s)+esc(s.input)+'^C'); s.input=''; refreshSession(s); return; }
    if (ev.ctrlKey && ev.key==='l'){ ev.preventDefault(); s.lines=[]; refreshSession(s); return; }
    if (ev.ctrlKey || ev.altKey || ev.key==='Tab' || ev.key==='Escape') return;
    if (ev.key==='Enter'){ ev.preventDefault(); const c = s.input; s.input=''; termExec(s, c); return; }
    if (ev.key==='Backspace'){ ev.preventDefault(); s.input = s.input.slice(0,-1); inEl().textContent = s.input; return; }
    if (ev.key==='ArrowUp' || ev.key==='ArrowDown'){ ev.preventDefault(); s.hi = clamp(s.hi + (ev.key==='ArrowUp'?-1:1), 0, s.hist.length); s.input = s.hist[s.hi] || ''; inEl().textContent = s.input; return; }
    return;
  }
  if (t.dataset?.taginput !== undefined){
    if (ev.key==='Enter' || ev.key===','){ ev.preventDefault(); addTag(t); return; }
    if (ev.key==='Backspace' && !t.value && S.form.draft.tags.length){ S.form.draft.tags.pop(); renderForm(); document.getElementById(fid('tags'))?.focus(); return; }
  }
  if (ev.key==='Escape'){
    const open = $$('.menu').find(m => !m.hidden);
    if (open){ closeMenus(); $(`[data-action="menu"][data-menu="${open.dataset.menu}"]`)?.focus(); return; }
    if (S.modals.length){ closeModal(); return; }
  }
  // focus trap
  if (ev.key==='Tab' && S.modals.length){
    const dlg = $('#modal-root').lastElementChild?.querySelector('.dialog'); if (!dlg) return;
    const f = $$('button:not([disabled]),input:not([disabled]),select,textarea,[tabindex="0"],summary', dlg).filter(e => e.offsetParent);
    if (!f.length) return;
    if (ev.shiftKey && document.activeElement===f[0]){ ev.preventDefault(); f[f.length-1].focus(); }
    else if (!ev.shiftKey && document.activeElement===f[f.length-1]){ ev.preventDefault(); f[0].focus(); }
  }
  // arrow keys in tablists / menus
  if ((ev.key==='ArrowRight' || ev.key==='ArrowLeft') && t.getAttribute?.('role')==='tab' && t.classList.contains('tab')){
    const i = DTABS.findIndex(([k]) => k===S.detailTab); const n = (i + (ev.key==='ArrowRight'?1:-1) + DTABS.length) % DTABS.length;
    ev.preventDefault(); S.detailTab = DTABS[n][0]; renderView(); $('#dtab-'+S.detailTab)?.focus();
  }
  if ((ev.key==='ArrowDown' || ev.key==='ArrowUp') && t.closest?.('.menu')){
    const items = $$('.menu-item', t.closest('.menu')); const i = items.indexOf(t);
    if (i>=0){ ev.preventDefault(); items[(i + (ev.key==='ArrowDown'?1:-1) + items.length) % items.length].focus(); }
  }
  if (ev.key==='Enter' && t.classList?.contains('stab') && t.dataset.tab){ t.click(); }
  if (ev.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(t.tagName) && !t.dataset?.term && !S.modals.length){ const s = $('#search'); if (s){ ev.preventDefault(); s.focus(); } }
});

const liveState = {rpi:'up', docker:'up'};
function liveStatusFor(d, c){
  if (d.maintenance) return 'maintenance';
  switch(d.mode){
    case 'down': return 'down';
    case 'degraded': return c.mode==='degraded' ? (chance(.75)?'degraded':'up') : 'up';
    case 'flaky': if (c.mode!=='flaky' && c.type!=='http') return 'up';
      { const k = d.name==='rpi-garage'?'rpi':'docker'; const st = liveState[k];
        const nx = st==='up' ? (chance(.05)?(chance(.4)?'down':'degraded'):'up') : (chance(.45)?'up':st);
        liveState[k] = nx; return nx; }
    default: return chance(.01)?'degraded':'up';
  }
}
function statusChanged(d, before){
  const after = statusOf(d);
  if (after===before) return;
  $$(`[data-card="${d.id}"]`).forEach(c => { c.className = `card st-${after}`; void c.offsetWidth; c.classList.add('flash'); c.setAttribute('aria-label', `${d.name}, ${STATUS[after].label}`); });
  if (!['maintenance','unknown'].includes(after) && !['maintenance','unknown'].includes(before)){
    const sev = after==='down'?'error':after==='degraded'?'warning':'info';
    const why = after==='down'?' after 3 failed retries':after==='degraded'?': response time above the 1 000 ms limit':'';
    addLog({sev, src:'Check', dev:d.id, msg:`Status changed from ${STATUS[before].label} to ${STATUS[after].label}${why}.`}); onNewLog();
  }
}
function patchLive(d){

  const up = uptimeOf(d);
  $$(`[data-live-uptime="${d.id}"]`).forEach(el => el.innerHTML = `${fmtPct(up)} <small>24 h</small>`);
  $$(`[data-live-uptime-plain="${d.id}"]`).forEach(el => el.textContent = fmtPct(up));
  $$(`[data-live-hb="${d.id}"]`).forEach(el => { const n = +el.dataset.n; el.innerHTML = hbBar(deviceBeats(d,n), n, el.dataset.cls||''); const last = el.querySelector('.b:last-child'); last && last.classList.add('new'); });
  $$(`[data-live-metrics="${d.id}"]`).forEach(el => el.innerHTML = metricsHTML(d));
  d.checks.forEach(c => $$(`[data-live-checkhb="${c.id}"]`).forEach(el => { el.innerHTML = hbBar(c.hb.map(b => d.maintenance&&b.s==='down'?{...b,s:'maintenance'}:b), 100, 'tall'); el.querySelector('.b:last-child')?.classList.add('new'); }));
  const sum = $('#summary'); if (sum) sum.innerHTML = summaryHTML();
  $$('[data-chipn]').forEach(el => el.textContent = visibleDevices().filter(x=>statusOf(x)===el.dataset.chipn).length);
}
function heartbeatTick(){
  if (S.livePaused || S.scenario.hubDown) return;
  const pool = devices.filter(d => d.checks.some(c=>!c.paused));
  for (let k=0;k<4 && pool.length;k++){
    const d = pool.splice(Math.floor(R()*pool.length),1)[0];
    const before = statusOf(d);
    for (const c of d.checks){ if (c.paused) continue; const s = liveStatusFor(d,c); c.hb.push(beat(c, s, Date.now())); if (c.hb.length>1440) c.hb.shift(); }
    if (d.m && d.metricsSource!=='none' && !d.stale){
      d.m.cpu = clamp(d.m.cpu + rr(-4,4), 1, 99); d.m.mem = clamp(d.m.mem + rr(-.8,.8), 1, 99);
      (d.m.gpus||[]).forEach(g => { g.util = clamp(g.util + rr(-6,6), 0, 100); if (g.vramTotal) g.vram = Math.round(clamp(g.vram + rr(-1.5,1.5), 1, 99)); });
      d.m.netIn = Math.max(1e3, d.m.netIn*rr(.8,1.25)); d.m.netOut = Math.max(1e3, d.m.netOut*rr(.8,1.25)); d.m.collected = Date.now();
    }
    statusChanged(d, before);
    patchLive(d);
  }
  if (S.page==='devices' && !S.detail && S.activeTab==='main' && S.sort.key!=='name'){ /* keep order stable while the operator looks; re-sort on next interaction */ }
}
const LIVE_EVENTS = [
  () => ['pve-01','info','Proxmox',`Task vzdump ${pick(['VM 101','VM 102','CT 103','CT 104'])} finished: OK (${rr(1,20).toFixed(1)} GiB in ${ri(1,12)} min).`],
  () => ['rpi-garage','warning','Check',`ICMP check failed: request timed out (retry ${ri(1,2)} of 3).`],
  () => ['backup-02','error','Check','ICMP check failed: request timed out (retry 3 of 3). Status stays Down.'],
  () => ['backup-02','error','Metrics','Metric collection failed: SSH connection timed out after 10 s.'],
  () => ['docker-host','warning','Check',`HTTP(S) response time ${ri(1010,1900)} ms is above the 1 000 ms limit (retry 1 of 3).`],
  () => ['truenas','warning','Check',`HTTP(S) response time ${ri(1100,2300)} ms is above the 1 000 ms limit.`],
  () => [null,'info','Hub',`Check scheduler: ${ri(22,24)} checks ran in the last minute.`],
  () => ['opnsense','warning','Check','DNS check failed: SERVFAIL from resolver (retry 1 of 3).'],
  () => ['mac-mini','info','Metrics','Metric collection took 2.4 s (slow).'],
];
function logTick(){
  if (S.livePaused || S.scenario.hubDown) return;
  const [dn,sev,src,msg] = pick(LIVE_EVENTS)();
  const d = dn && devByName(dn);
  if (dn && !d) return;
  addLog({sev, src, dev:d?d.id:null, msg}); onNewLog();
}
function onNewLog(){
  const e = logs[0];
  const tb = $('#logs-tbody');
  if (tb && logPass(e, S.logF)){ tb.insertAdjacentHTML('afterbegin', logRow(e, true, true)); while (tb.rows.length > 300) tb.deleteRow(-1); }
  else if (!tb && S.logsOpen && $('#logs-body') && logPass(e, S.logF)) renderLogsPanel();
  const dt = $('#dlogs-tbody');
  if (dt && S.detail && logPass(e, S.dlogF, S.detail)) dt.insertAdjacentHTML('afterbegin', logRow(e, false, true));
  const lc = $('#logs-count'); if (lc) lc.textContent = `${logs.filter(x=>logPass(x,S.logF)).length} entries`;
}
setInterval(heartbeatTick, 2500);
(function scheduleLog(){ setTimeout(() => { logTick(); scheduleLog(); }, 3500 + R()*3000); })();
setInterval(() => { // clocks & session durations
  const s = S.sessions.find(x => x.id===S.activeTab);
  if (s && (s.proto==='rdp' || s.proto==='vnc')){ const c = $('#rdp-clock-'+s.id); if (c) c.textContent = fmtTime(Date.now()).slice(0,5); }
}, 10000);

/* =====================================================================
   Boot
   ===================================================================== */
renderBadge();
renderView();
</script>
