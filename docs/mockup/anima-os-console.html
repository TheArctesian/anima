<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anima local interface · motion preview</title></head><body>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500;600&display=swap');
:root{--card:#1B1D21;--foreground:#E6E7E9;--muted-foreground:#A4A8B0;--secondary:#23262B;--border:#353941;--primary:#88C0D0;--primary-foreground:#151C20;--success:#8FBCBB;--warning:#D8B47B;--radius:4px}
#anima-console{font-family:'IBM Plex Sans',sans-serif;color:var(--foreground);font-size:14px;line-height:1.5}#anima-console *{box-sizing:border-box}#anima-console .caption{font-size:12px;color:var(--muted-foreground);margin:0 0 12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#anima-console .shell{background:var(--card);padding:24px;position:relative;min-height:680px;border-radius:4px;display:grid;grid-template-columns:164px minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:32px}
#anima-console header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--border);gap:16px}#anima-console .wordmark{width:148px;height:24px;object-fit:contain;object-position:left}#anima-console .identity{display:flex;align-items:center;gap:12px;color:var(--muted-foreground);font-size:12px}#anima-console .identity button{font-size:12px}
#anima-console nav{padding:28px 16px 0 0;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px}#anima-console nav small{padding:0 10px 14px;color:var(--muted-foreground);font-size:12px}#anima-console button,#anima-console input,#anima-console select{font:inherit}#anima-console button{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:4px;padding:7px 13px;min-height:36px;cursor:pointer}#anima-console button:hover{border-color:var(--primary)}#anima-console button:focus-visible,#anima-console input:focus-visible,#anima-console select:focus-visible{outline:2px solid var(--primary);outline-offset:3px}#anima-console button.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent;font-weight:500}#anima-console button.quiet{border-color:transparent;background:transparent}#anima-console nav button{justify-content:flex-start;text-align:left;background:transparent;border-color:transparent;color:var(--muted-foreground);padding:8px 10px}#anima-console nav button[aria-current=page]{background:var(--secondary);color:var(--foreground)}#anima-console .icon{width:17px;height:17px;opacity:.9;flex-shrink:0}#anima-console main{min-width:0;padding:32px 0 40px}#anima-console h1{font-size:36px;line-height:1.2;letter-spacing:-1px;font-weight:200;margin:0 0 12px}#anima-console h2{font-size:16px;font-weight:500;margin:0}#anima-console p{margin:0 0 24px;color:var(--muted-foreground);max-width:480px}#anima-console .topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}#anima-console .status{font-size:12px;color:var(--success);display:inline-flex;gap:7px;align-items:center}#anima-console .status:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}#anima-console .pending{color:var(--warning)}#anima-console .hero{position:relative;isolation:isolate;min-height:216px;padding:24px 0 32px}#anima-console .hero img{position:absolute;z-index:-1;width:390px;height:290px;object-fit:cover;right:-12px;top:-30px;opacity:.65;clip-path:inset(0 0 28% 0);mask-image:linear-gradient(90deg,transparent,#000 55%,transparent),linear-gradient(0deg,transparent 12%,#000 45%,transparent);mask-composite:intersect;pointer-events:none}#anima-console .hero p{max-width:330px}#anima-console .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#anima-console .row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--border)}#anima-console .row:last-child{border-bottom:0}#anima-console .row small{display:block;color:var(--muted-foreground);font-size:12px;margin-top:4px}#anima-console .row .value{color:var(--muted-foreground);text-align:right;font-size:13px}#anima-console .section{margin-top:30px}#anima-console .overline{font-size:12px;color:var(--muted-foreground);margin-bottom:4px}#anima-console .notice{padding-left:14px;border-left:2px solid var(--border);margin:24px 0;color:var(--muted-foreground);font-size:13px}#anima-console label{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;font-size:13px}#anima-console input,#anima-console select{color:var(--foreground);background:#16181B;border:1px solid var(--border);border-radius:4px;padding:10px 12px;width:100%;min-width:0}#anima-console form{max-width:460px;margin-top:28px}#anima-console .hint{font-size:12px;color:var(--muted-foreground)}#anima-console .numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:28px 0 12px}#anima-console .number{font-size:25px;font-weight:300;letter-spacing:-.5px}#anima-console .track{height:3px;background:var(--secondary);margin-top:12px}#anima-console .fill{height:3px;background:var(--primary)}#anima-console footer{grid-column:2;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border);padding-top:16px;font-size:12px;color:var(--muted-foreground)}#anima-console .overlay{position:absolute;inset:0;z-index:5;background:#101216bb;display:flex;align-items:center;justify-content:center;padding:24px;border-radius:4px}#anima-console .dialog{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:32px;width:440px;max-width:100%;box-shadow:0 20px 70px #0005}#anima-console .dialog h2{font-size:24px;font-weight:300;margin-bottom:12px}#anima-console .dialog .actions{justify-content:flex-end;margin-top:28px}#anima-console .dialog p{font-size:14px}#anima-console .dialog input{margin:10px 0}#anima-console .danger{color:#D99BA1}#anima-console .log{font-size:13px;margin-top:24px}#anima-console .log div{padding:12px 0;border-bottom:1px solid var(--border)}#anima-console .log time{color:var(--muted-foreground);display:inline-block;min-width:66px}#anima-console details{margin-top:28px;color:var(--muted-foreground);font-size:13px}#anima-console summary{cursor:pointer}#anima-console [hidden]{display:none!important}
@media(max-width:650px){#anima-console .shell{padding:20px;grid-template-columns:1fr;min-height:720px}#anima-console nav{flex-direction:row;flex-wrap:wrap;gap:4px;padding:16px 0;border:0;border-bottom:1px solid var(--border)}#anima-console nav small{display:none}#anima-console nav button{font-size:12px;padding:7px 9px}#anima-console nav .icon{width:14px;height:14px}#anima-console main{padding-top:28px}#anima-console footer{grid-column:1}#anima-console .identity>span{display:none}#anima-console .hero img{width:270px;right:-20px}#anima-console .hero p{max-width:260px}#anima-console .row{gap:12px;flex-wrap:wrap}#anima-console h1{font-size:32px}#anima-console .numbers{gap:12px}#anima-console .number{font-size:23px}#anima-console input,#anima-console select{font-size:16px}}
@media(pointer:coarse){#anima-console button{min-height:44px}}
#anima-console .glyph{display:inline-block;width:18px;height:18px;flex:0 0 18px;background:currentColor;mask-image:var(--glyph);mask-size:contain;mask-position:center;mask-repeat:no-repeat;vertical-align:middle}
#anima-console .row-title{display:flex;align-items:center;gap:14px;min-width:0}#anima-console .row-title>.glyph{color:var(--muted-foreground)}
#anima-console .utility{width:38px;height:38px;padding:9px}#anima-console .utility[data-action=shutdown]:hover{color:#D99BA1;border-color:#D99BA1}
#anima-console summary{display:flex;align-items:center;gap:10px;list-style:none}#anima-console summary::-webkit-details-marker{display:none}
#anima-console summary:after{content:'+';margin-left:auto;font-size:18px}#anima-console details[open]>summary:after{content:'−'}
#anima-console .dialog h2{display:flex;align-items:center;gap:12px}#anima-console .dialog h2 .glyph{width:22px;height:22px;flex-basis:22px;color:var(--primary)}
@media(pointer:coarse){#anima-console .utility{width:44px;height:44px}}

/* Roles mirror Anima's shared motion tokens. No continuous ambient effects. */
#anima-console{--motion-press:100ms;--motion-fast:150ms;--motion-base:200ms;--motion-enter:cubic-bezier(.2,0,0,1)}
#anima-console button{transition:background-color var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast),transform var(--motion-press) var(--motion-enter)}
#anima-console button:active:not(:disabled){transform:scale(.975)}
#anima-console button:disabled{cursor:wait;opacity:.65}
#anima-console main{position:relative}
#anima-console .page-outgoing{position:absolute;inset:32px 0 40px;pointer-events:none}
#anima-console .shell[data-locked] main,#anima-console .shell[data-locked] nav{visibility:hidden}
#anima-console #revert-count{font-variant-numeric:tabular-nums}
#anima-console[data-reduced=true] button{transition:none;transform:none}
@media(max-width:650px){#anima-console .page-outgoing{top:28px}}
@media(prefers-reduced-motion:reduce){#anima-console button{transition:none;transform:none}}
</style>
<div id="anima-console">
<div class="caption"><span>Installed Anima OS · interactive design concept</span><span>Example data · actions affect this mockup only</span></div>
<section class="shell" aria-label="Anima local management interface">
<header><img class="wordmark" src="../../experiments/anima-os/branding/wordmark.svg" alt="ANIMA.ING"><div class="identity"><span>Local session · admin</span><button class="quiet" data-action="lock">Lock</button></div></header>
<nav aria-label="Machine settings"></nav><main aria-live="polite"></main>
<footer><span>anima-home · Anima OS Preview</span><button class="quiet" data-action="power"><img class="icon" src="../../experiments/anima-os/branding/settings.svg" alt="">Power</button></footer>
<div class="overlay" hidden></div>
</section></div>
<script>
(()=>{
const root=document.getElementById('anima-console'),main=root.querySelector('main'),nav=root.querySelector('nav'),overlay=root.querySelector('.overlay');
const names=['Overview','Network','Anima','Storage','Display','Recovery'];
const preference=matchMedia('(prefers-reduced-motion: reduce)');
let motionChoice='system',dialogVersion=0,returnFocus=null,closing=false;
const activeMotion=new Set();
const reduced=()=>motionChoice==='reduced'||(motionChoice==='system'&&preference.matches);
const role={press:100,fast:150,base:200};
function animate(element,frames,duration=role.base){
 if(reduced())return Promise.resolve();
 const animation=element.animate(frames,{duration,easing:'cubic-bezier(.2,0,0,1)'});
 activeMotion.add(animation);
 return animation.finished.catch(()=>{}).finally(()=>activeMotion.delete(animation));
}
function syncMotion(){
 root.dataset.reduced=String(reduced());
 if(reduced())for(const animation of activeMotion)animation.finish();
}
preference.addEventListener('change',syncMotion);
syncMotion();
function backgroundInert(value){
 for(const element of root.querySelectorAll('header,nav,main,footer'))element.inert=value;
}
function showPage(html){
 main.querySelectorAll('.page-outgoing').forEach(element=>element.remove());
 const old=main.querySelector('.page-content');
 if(old&&!reduced()){
  old.className='page-outgoing';old.inert=true;old.setAttribute('aria-hidden','true');
  old.querySelectorAll('[id]').forEach(element=>element.removeAttribute('id'));
  animate(old,[{opacity:1},{opacity:0}],role.fast).then(()=>old.remove());
 }else old?.remove();
 const content=document.createElement('div');content.className='page-content';content.innerHTML=html;
 main.append(content);
 animate(content,[{opacity:0},{opacity:1}]);
}

const icon=name=>`<span class="glyph" aria-hidden="true" style="--glyph:url('${icons[name]||icons.settings}')"></span>`;
const utility=(label,action,glyph)=>`<button type="button" class="quiet utility" data-action="${action}" aria-label="${label}" title="${label}">${icon(glyph)}</button>`;
root.querySelector('.identity').innerHTML='<span>Local session · admin</span>'+utility('Lock screen — node keeps running','lock','locked');
root.querySelector('footer').innerHTML='<span>anima-home · Anima OS Preview</span><div class="actions">'+utility('Restart computer','restart','renew')+utility('Shut down computer','shutdown','power')+'</div>';

nav.innerHTML='<small>This computer</small>'+names.map(n=>`<button data-page="${n}">${icon(n)}${n}</button>`).join('');
const actionIcons={'sign-in':'user-avatar','signin-complete':'arrow-right','add-computer':'add','switch-account':'user-avatar','overview':'arrow-left','anima':'connection-signal','network':'network-3','close':'close','wifi-toggle':'connection-signal','wifi-password':'connection-signal','guest-password':'connection-signal','wifi-confirm':'checkmark','wifi-details':'settings','network-save':'checkmark','check-hub':'renew','drive-details':'data-base','diagnostics':'activity','report':'document','export':'download','power':'power','restart':'renew','shutdown':'power','power-confirm':'checkmark','lock':'locked','terminal':'terminal','keep-rotation':'checkmark'};
const button=(label,action,primary=false)=>`<button type="button" data-action="${action}" class="${primary?'primary':''}">${icon(/Unlock/.test(label)?'password':label==='Done'?'checkmark':actionIcons[action]||'arrow-right')}<span>${label}</span></button>`;
const rowIcon=name=>name==='Sign in'?'user-avatar':name==='Ready'?'checkmark':/Wi-Fi|network|Wireless/.test(name)?'connection-signal':/Storage|drive|Filesystem|Capacity|Storage/.test(name)?'data-base':/Account|Signed in/.test(name)?'user-avatar':/Workspace|workspace|Anima/.test(name)?'network-3':/Computer|computer|Device/.test(name)?'bare-metal-server':/Security|Encryption/.test(name)?'security':/Internet|Address/.test(name)?'earth':/report/.test(name)?'document':'activity';
const row=(name,detail,right)=>`<div class="row"><div class="row-title">${icon(rowIcon(name))}<div>${name}<small>${detail}</small></div></div><div class="value">${right}</div></div>`;

const head=(title,body)=>`<h1>${title}</h1><p>${body}</p>`;
function draw(){
nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));
const screens={
Overview:()=>`<div class="topline"><span class="overline">This computer / anima-home</span><span class="status">System running</span></div><section class="hero"><img src="../../experiments/anima-os/branding/hero.png" alt=""><h1>${paired?'Your server is ready.':'Welcome to Anima.'}</h1><p>${paired?'Connected to your hub. Manage this machine here, or use Anima on another device.':'Your system is installed. Connect it to your Anima hub to bring it into your workspace.'}</p><div class="actions">${button(paired?'View connection':signedIn?'Finish setup':'Sign in to Anima','anima',true)}${button('Network settings','network')}</div></section><div class="section"><h2>At a glance</h2>${row('Wi-Fi',wifi?wifiName+' · 192.168.1.42':'No wireless connection',`<span class="status ${wifi?'':'pending'}">${wifi?'Connected':'Offline'}</span>`)}${row('Anima connection',paired?'Home workspace · last seen just now':'This computer has not been enrolled',`<span class="status ${paired?'':'pending'}">${paired?'Connected':'Setup needed'}</span>`)}${row('Storage','System and persistent data','38 GB of 256 GB used')}</div>`,
Network:()=>head('Network','Connect this computer and see exactly where a connection needs attention.')+`<div class="topline"><h2>Wi-Fi</h2>${button(wifi?'Disconnect':'Connect','wifi-toggle')}</div>${row(wifiName,'RTL8821CE · wlp1s0',`<span class="status ${wifi?'':'pending'}">${wifi?'Connected':'Disconnected'}</span>`)}${wifi?row('Connection checks','Radio → authentication → address → internet','All checks passed'):row('Connection checks','Radio available · waiting for a network','Not connected')}<div class="section"><h2>Available networks</h2>${row('Home network','Strong signal · secured',button(wifi&&wifiName==='Home network'?'Details':'Connect',wifi&&wifiName==='Home network'?'wifi-details':'wifi-password'))}${row('Guest network','Good signal · secured',button(wifi&&wifiName==='Guest network'?'Details':'Connect',wifi&&wifiName==='Guest network'?'wifi-details':'guest-password'))}</div><div class="section">${row('Wired connection','No cable connected','Available')}</div><details><summary>Advanced network settings</summary><form><label>Address assignment<select><option>Automatic (DHCP)</option><option>Manual</option></select></label><label>DNS servers<input placeholder="Automatic"></label>${button('Save settings','network-save')}</form></details>`,
Anima:()=>paired?head('Connected to Anima','This computer is part of your workspace. Your connection is ready.')+`<div class="section">${row('Account','Signed in with Anima','owner@example.com')}${row('Workspace','Your hub was found automatically','Home')}${row('This computer','Monitoring is running','anima-home')}</div><div class="notice">Local network and recovery controls remain available when your hub is unreachable.</div><div class="actions">${button('View overview','overview',true)}${button('Check connection','check-hub')}</div>`:signedIn?head('Add this computer','Choose where this server belongs. Anima handles the connection for you.')+`<div class="section">${row('Signed in as','Anima account','owner@example.com')}${row('Workspace','Found for your account','Home')}${row('Computer','This machine will appear in your workspace','anima-home')}</div><div class="notice">Adding this computer enrolls it with your hub and enables monitoring. Workload and remote-access permissions follow your workspace policy.</div><div class="actions">${button('Add this computer','add-computer',true)}${button('Use another account','switch-account')}</div>`:head('Sign in to Anima','Use your Anima account to connect this computer. We’ll find your hub and finish the setup with you.')+`<section class="hero" style="min-height:170px;padding-top:12px"><img src="../../experiments/anima-os/branding/hero.png" alt=""><div class="actions">${button('Sign in to Anima','sign-in',true)}${button('Do this later','overview')}</div><div class="hint" style="margin-top:16px">Secure sign-in with WorkOS</div></section><div class="section"><h2>Connect your computer</h2>${row('Sign in','Continue in the secure sign-in page','')}${row('Add this computer','Confirm your account and workspace','')}${row('Ready','Anima takes care of enrollment','')}</div><details><summary>Advanced · connect to a self-hosted hub</summary><form id="enroll"><label>Hub address<input name="hub" type="url" placeholder="https://your-hub.example" required></label><label>Enrollment code<input name="code" placeholder="Code from your self-hosted hub" autocomplete="off" required></label><div class="hint">Example values only. No real credentials are sent.</div><div class="actions" style="margin-top:24px"><button class="primary" type="submit">Connect manually</button></div></form></details>`,
Storage:()=>head('Storage','See where your persistent data lives and how much space is available.')+`<div class="numbers"><div><div class="overline">Used</div><div class="number">38 GB</div></div><div><div class="overline">Available</div><div class="number">218 GB</div></div><div><div class="overline">Filesystem</div><div class="number">Btrfs</div></div></div><div class="track" aria-label="15 percent of system storage used"><div class="fill" style="width:15%"></div></div><div class="section"><h2>Installed drives</h2>${row('System drive · 256 GB','OS, settings and persistent workload data','Healthy')}${row('Data drive · 1 TB','Separate volume · 120 GB used','Mounted')}</div><div class="notice">Your OS is read-only. Your files and workload data stay in writable persistent storage.</div>${button('View drive details','drive-details')}`,
Display:()=>head('Display','Keep the local screen readable and correctly oriented.')+`<form id="display-form"><label>Orientation<select name="rotation">${['Landscape','Portrait left','Portrait right','Landscape flipped'].map(n=>`<option ${rotation===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Interface size<select><option>Comfortable · 100%</option><option>Larger · 125%</option><option>Large · 150%</option></select></label><button class="primary">Apply display settings</button></form><div class="notice">Orientation changes revert after 15 seconds unless you confirm them. Recovery stays available if the screen is difficult to use.</div><details><summary>Motion and screen behaviour</summary><label style="margin-top:16px">Interface motion<select id="motion-choice">${[['system','Follow system'],['reduced','Reduced motion']].map(([value,label])=>`<option value="${value}" ${motionChoice===value?'selected':''}>${label}</option>`).join('')}</select></label><p>The display can turn off while the server keeps running.</p></details>`,
Recovery:()=>head('Recovery','Check the system and recover access without needing a terminal.')+`${row('System health','Local services and persistent storage','Healthy')}${row('Network diagnostics','Check adapter, connection and internet access',button('Run checks','diagnostics'))}${row('Diagnostic report','Review a redacted report before exporting',button('Review report','report'))}<div class="section"><h2>Recent activity</h2><div class="log"><div><time>09:42</time> System started successfully</div><div><time>09:42</time> Persistent storage mounted</div><div><time>09:43</time> Network connection established</div></div></div><details><summary>Advanced access</summary><p style="margin-top:16px">A recovery terminal is available for manual troubleshooting. Normal setup and maintenance do not require it.</p>${button('Open recovery terminal','terminal')}</details>`};

main.querySelectorAll('.page-content summary').forEach(el=>{el.innerHTML=icon('settings')+'<span>'+el.textContent+'</span>';});

}
function close(immediate=false){
 clearInterval(timer);timer=null;
 if(overlay.hidden||closing)return;
 closing=true;const version=++dialogVersion;
 const finish=()=>{
  if(version!==dialogVersion)return;
  overlay.hidden=true;overlay.innerHTML='';closing=false;
  root.querySelector('.shell').removeAttribute('data-locked');
  backgroundInert(false);
  if(returnFocus?.isConnected)returnFocus.focus();
 };
 if(immediate||reduced()){finish();return;}
 animate(overlay,[{opacity:getComputedStyle(overlay).opacity},{opacity:0}],role.fast).then(finish);
}
function modal(title,body,actions){
 ++dialogVersion;closing=false;
 if(overlay.hidden)returnFocus=document.activeElement;
 overlay.getAnimations({subtree:true}).forEach(animation=>animation.cancel());
 clearInterval(timer);timer=null;
 overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${icon(/locked|sign-in/i.test(title)?'locked':/Restart|Shut down|Power/.test(title)?'power':/Wi-Fi|network/i.test(title)?'connection-signal':'settings')}${title}</h2>${body}<div class="actions">${actions}</div></section>`;
 overlay.hidden=false;backgroundInert(true);
 const locked=title==='Local session locked';
 root.querySelector('.shell').toggleAttribute('data-locked',locked);
 if(!locked){
  animate(overlay,[{opacity:0},{opacity:1}],role.fast);
  animate(overlay.querySelector('.dialog'),[{transform:'translateY(6px)',opacity:0},{transform:'translateY(0)',opacity:1}]);
 }
 overlay.querySelector('input,button')?.focus();
}
function go(n){page=n;close(true);draw();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}const a=b.dataset.action;
if(a==='close'){close();return;}if(['overview','network','anima'].includes(a)){go(a[0].toUpperCase()+a.slice(1));return;}
if(a==='sign-in'){
 if(!wifi){modal('Connect to a network first','<p>Sign-in needs an internet connection. Local settings and recovery remain available.</p>',button('Not now','close')+button('Network settings','network',true));return;}
 modal('Continue in your browser','<p>The built app will open Anima’s secure WorkOS sign-in and return here automatically.</p><div class="notice">Design preview only. No browser sign-in is opened and no credentials are collected.</div>',button('Cancel','close')+button('Preview successful sign-in','signin-complete',true));
}
if(a==='signin-complete'){signedIn=true;go('Anima');}
if(a==='switch-account'){signedIn=false;draw();}
if(a==='add-computer'){
 if(!wifi){modal('Connection interrupted','<p>Your computer has not been added. Reconnect to a network, then try again.</p>',button('Close','close')+button('Network settings','network',true));return;}
 paired=true;draw();
}
if(a==='wifi-toggle'){if(wifi){wifi=false;draw();}else modal('Connect to Home network','<p>Enter the network password.</p><input type="password" placeholder="Example password" aria-label="Wi-Fi password">',button('Cancel','close')+button('Connect','wifi-confirm',true));}
if(a==='wifi-password'||a==='guest-password'){pendingName=a==='guest-password'?'Guest network':'Home network';modal('Connect to Wi-Fi','<p>Enter a password to preview a successful connection. No network changes are made.</p><input type="password" placeholder="Example password" aria-label="Wi-Fi password">',button('Cancel','close')+button('Connect','wifi-confirm',true));}
if(a==='wifi-confirm'){wifi=true;wifiName=pendingName;close(true);draw();}
if(a==='wifi-details')modal(wifiName,row('Address','Assigned automatically','192.168.1.42')+row('Security','Wireless authentication','WPA2')+row('Internet','Connection check','Reachable'),button('Done','close',true));
if(a==='network-save'||a==='check-hub')modal('Connection checked','<p>The example connection is healthy. This is a simulated result.</p>',button('Done','close',true));
if(a==='drive-details')modal('System drive',row('Capacity','Internal SSD','256 GB')+row('Filesystem','System and data subvolumes','Btrfs')+row('Encryption','Installation setting','Off'),button('Done','close',true));
if(a==='diagnostics')modal('Network checks',row('Wireless adapter','Driver available','Passed')+row('Network access','Authentication and IP address',wifi?'Passed':'Not connected')+row('Internet','DNS and outbound access',wifi?'Passed':'Waiting'),button('Done','close',true));
if(a==='report')modal('Review diagnostic report','<p>Example report: boot health, storage health and adapter details. Passwords, enrollment codes and application content are excluded.</p><div class="notice">System: healthy<br>Wi-Fi adapter: RTL8821CE<br>Storage: two mounted drives</div>',button('Close','close')+button('Export example report','export',true));
if(a==='export'){const blob=new Blob(['ANIMA DESIGN MOCKUP — NOT REAL DIAGNOSTICS\nSystem: healthy\nWi-Fi adapter: RTL8821CE\nStorage: two mounted drives\n'],{type:'text/plain'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='anima-example-report.txt';link.click();URL.revokeObjectURL(url);close();}
if(a==='power')modal('Power','<p>Restart or shut down this computer. Running workloads may be interrupted.</p>',button('Cancel','close')+button('Restart…','restart')+button('Shut down…','shutdown'));
if(a==='restart'||a==='shutdown')modal(a==='restart'?'Restart this computer?':'Shut down this computer?','<p>This stops local services and disconnects remote access. Review running work before continuing.</p>',button('Cancel','close')+button('Confirm in mockup','power-confirm',true));
if(a==='power-confirm')modal('Action previewed','<p>No restart or shutdown was sent. This mockup changes no real machine.</p>',button('Done','close',true));
if(a==='lock')modal('Local session locked','<p>The screen is locked. Your node stays awake: apps, jobs, agents and authorized remote access keep running.</p><label>Local admin password<input type="password" placeholder="Example password only"></label>',button('Unlock mockup','close',true));
if(a==='terminal')modal('Advanced recovery','<p>In the built interface this would open the local recovery terminal after owner authentication.</p>',button('Back to recovery','close',true));
if(a==='keep-rotation'){rotation=root.querySelector('[name=rotation]').value;close(true);draw();}
});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='enroll'){if(!wifi){modal('Connect to a network first','<p>This computer needs to reach your Anima hub before it can enroll.</p>',button('Network settings','network',true));return;}paired=true;draw();}if(e.target.id==='display-form'){let left=15;modal('Keep these display settings?','<p>The selected orientation is previewed here. Your real screen is unchanged.</p><p id="revert-count">Reverting in 15 seconds.</p>',button('Revert','close')+button('Keep settings','keep-rotation',true));timer=setInterval(()=>{left--;if(left<=0){close(true);draw();}else root.querySelector('#revert-count').textContent=`Reverting in ${left} seconds.`;},1000);}});
overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return;}if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input,select')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
root.addEventListener('change',e=>{
 if(e.target.id==='motion-choice'){motionChoice=e.target.value;syncMotion();}
});
root.addEventListener('toggle',e=>{
 if(e.target.tagName==='DETAILS'&&e.target.open){
  for(const child of e.target.children)if(child.tagName!=='SUMMARY')animate(child,[{opacity:0},{opacity:1}]);
 }
},true);
draw();
})();
</script>
