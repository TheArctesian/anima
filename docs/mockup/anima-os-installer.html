<!doctype html><html><head><meta charset="utf-8"></head><body><style>
#anima-design{color:var(--foreground);font-family:var(--font-sans);}
#anima-design *{box-sizing:border-box} #anima-design .preview-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px} #anima-design .preview-nav small{margin-right:8px;color:var(--muted-foreground)}
#anima-design button,#anima-design select,#anima-design input{font:inherit} #anima-design button{color:inherit;border:1px solid var(--border);background:transparent;padding:9px 13px;border-radius:var(--radius)} #anima-design button:disabled{opacity:.4} #anima-design button[aria-pressed=true]{background:var(--secondary)}
#anima-design .machine{position:relative;isolation:isolate;background:var(--card);color:var(--card-foreground);padding:16px;border-radius:var(--radius);overflow:hidden;min-height:570px;display:flex;flex-direction:column} #anima-design header{display:flex;align-items:center;gap:12px;padding:8px 12px 24px} #anima-design .brand{font-size:23px;letter-spacing:-1px;font-weight:500} #anima-design .os{font-size:11px;letter-spacing:2px;border-left:1px solid var(--border);padding-left:12px;color:var(--muted-foreground)}
#anima-design main{flex:1;padding:26px 32px 20px;position:relative;z-index:1} #anima-design .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 16px} #anima-design h1{font-size:38px;line-height:1.12;letter-spacing:-1.8px;font-weight:500;margin:0 0 16px;max-width:480px} #anima-design .welcome h1{font-size:52px;max-width:400px} #anima-design p{font-size:14px;line-height:1.65;margin:0 0 20px;max-width:460px;color:var(--muted-foreground)} #anima-design .art{position:absolute;width:440px;height:480px;right:-70px;top:48px;z-index:-1;opacity:.65;object-fit:cover;object-position:50% 28%;mask-image:linear-gradient(0deg,transparent 5%,black 28%,black 80%,transparent),linear-gradient(90deg,transparent,black 48%);mask-composite:intersect;clip-path:inset(0 0 24% 0);transform-origin:50% 45%;animation:anima-door-drift 14s ease-in-out infinite}
#anima-design footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--border);margin:12px 12px 0;padding-top:16px} #anima-design footer span{font-size:12px;color:var(--muted-foreground)} #anima-design .actions{display:flex;gap:8px} #anima-design .primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent;padding:12px 20px} #anima-design .danger{background:var(--destructive);color:var(--destructive-foreground)}
#anima-design .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--border);font-size:14px} #anima-design .row small{display:block;font-size:12px;line-height:1.5;color:var(--muted-foreground);margin-top:4px} #anima-design .row label{display:flex;align-items:center;gap:12px} #anima-design .pill{font-size:11px;white-space:nowrap;color:var(--success);padding:5px 0} #anima-design .fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px} #anima-design .field{display:grid;gap:8px;font-size:12px} #anima-design select,#anima-design input[type=text]{width:100%;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);padding:12px;border-radius:var(--radius);min-width:0} #anima-design .notice{margin-top:20px;background:var(--secondary);padding:16px;border-radius:var(--radius);font-size:13px;line-height:1.6} #anima-design .confirm{display:flex;align-items:flex-start;gap:10px;margin-top:18px;font-size:13px;line-height:1.5} #anima-design progress{width:100%;height:6px;accent-color:var(--primary);margin:20px 0} #anima-design .big-number{font-size:64px;letter-spacing:-3px;margin:24px 0 0} #anima-design details{margin-top:22px;font-size:12px;color:var(--muted-foreground)} #anima-design pre{white-space:pre-wrap;line-height:1.7} #anima-design .complete{font-size:12px;letter-spacing:1px;color:var(--success);margin-bottom:22px} #anima-design .steps{display:flex;gap:6px;margin-top:28px} #anima-design .steps i{height:3px;width:24px;background:var(--border)} #anima-design .steps i.done{background:var(--primary)}
@keyframes anima-door-drift{0%,100%{transform:scale(1) translateY(0);filter:brightness(1)}50%{transform:scale(1.08) translateY(-8px);filter:brightness(1.6)}} @media(prefers-reduced-motion:reduce){#anima-design .art{animation:none}}
@media(max-width:500px){#anima-design main{padding:22px 8px} #anima-design h1{font-size:32px} #anima-design .welcome h1{font-size:42px} #anima-design .fields{grid-template-columns:1fr} #anima-design .machine{min-height:600px} #anima-design footer{margin-left:0;margin-right:0;flex-wrap:wrap} #anima-design .row{gap:8px} #anima-design .preview-nav button{font-size:12px;padding:9px} #anima-design .art{right:-180px} }

#anima-design{
 --foreground:#E6E7E9;--card-foreground:#E6E7E9;--muted-foreground:#A4A8B0;--card:#1B1D21;--secondary:#23262B;--border:#2C3036;--primary:#88C0D0;--primary-foreground:#16181B;--success:#A3BE8C;--destructive:#C0656E;--destructive-foreground:#16181B;--radius:4px;
 font-family:'Anima Plex', 'IBM Plex Sans',system-ui,sans-serif;font-size:14px;color:var(--foreground)
}
#anima-design .machine{display:grid;grid-template-columns:160px minmax(0,1fr);grid-template-rows:auto 1fr auto;min-height:540px;padding:16px;gap:0 24px;border-radius:4px}
#anima-design header{grid-column:1/-1;padding:0 0 16px;margin:0;border-bottom:1px solid var(--border);gap:12px}
#anima-design .brand{font-size:16px;font-weight:500;letter-spacing:0}
#anima-design .os{font-size:13px;letter-spacing:0;text-transform:none;border:0;padding:0}
#anima-design .preview-nav{grid-column:1;grid-row:2/4;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;margin:0;padding:20px 12px 0 0;border-right:1px solid var(--border)}
#anima-design .preview-nav small{font-size:12px;letter-spacing:0;margin:0 0 12px 12px;text-transform:none;color:#7E838C}
#anima-design button{font-size:14px;line-height:1.5;padding:5px 12px;min-height:32px;border-radius:4px;background:var(--secondary);border:1px solid var(--border);font-weight:400}
#anima-design .preview-nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted-foreground);display:flex;align-items:center;gap:12px}
#anima-design .preview-nav button span{font-family:'Anima Mono',monospace;font-size:12px;color:#7E838C}
#anima-design .preview-nav button[aria-pressed=true]{color:var(--foreground);background:var(--secondary)}
#anima-design .preview-nav button[aria-pressed=true] span{color:var(--primary)}
#anima-design main{grid-column:2;grid-row:2;padding:28px 0 20px;min-width:0}
#anima-design h1,#anima-design .welcome h1{font-size:36px;line-height:1.2;letter-spacing:-.03em;font-weight:200;max-width:none;margin:0 0 12px}
#anima-design .eyebrow{display:none}
#anima-design p{font-size:14px;line-height:1.5;margin-bottom:24px;max-width:390px}
#anima-design .row{font-size:14px;padding:12px 0;align-items:center}
#anima-design .row small{font-size:12px;line-height:1.5;margin-top:4px}
#anima-design .notice{background:transparent;border-left:2px solid #41464E;border-radius:0;padding:0 0 0 12px;margin-top:20px;font-size:13px;line-height:1.5;color:var(--muted-foreground)}
#anima-design .primary{background:var(--primary);color:var(--primary-foreground);padding:5px 16px;border-color:transparent;font-weight:500}
#anima-design button:hover:not(:disabled){filter:brightness(1.1)}
#anima-design .danger{background:transparent;border-color:#6C7076;color:#CA888F}
#anima-design .fields{gap:16px;grid-template-columns:1fr;margin-top:20px}
#anima-design .field{gap:6px;font-size:13px}
#anima-design input[type=text],#anima-design select{padding:6px 10px;font-size:14px;line-height:1.5;border-radius:4px;background:#16181B}
#anima-design input{accent-color:var(--primary)}
#anima-design footer{grid-column:2;grid-row:3;margin:0;padding:16px 0 0;align-items:center}
#anima-design footer span{font-size:12px}
#anima-design .art{right:-32px;top:100px;width:280px;height:340px;opacity:.5;pointer-events:none;z-index:-1}
#anima-design .steps{display:none}
#anima-design .welcome .row{max-width:none!important;position:relative}
#anima-design .big-number{font-size:36px;font-weight:200;letter-spacing:-.03em}
#anima-design .complete{letter-spacing:0;font-size:13px}
#anima-design .confirm{font-size:13px;line-height:1.5}
#anima-design .pill{font-size:12px}
#anima-design .preview-label{font-family:'Anima Plex',system-ui;font-size:12px;color:var(--muted-foreground);margin-bottom:12px}

 #anima-design .machine{grid-template-columns:minmax(0,1fr);gap:0;min-height:620px}
 #anima-design header{grid-column:1}
 #anima-design .preview-nav{grid-column:1;grid-row:2;flex-direction:row;flex-wrap:wrap;border:0;border-bottom:1px solid var(--border);padding:12px 0;gap:2px}
 #anima-design .preview-nav small,#anima-design .preview-nav button span{display:none}
 #anima-design .preview-nav button{padding:5px 8px;font-size:13px}
 #anima-design main{grid-column:1;grid-row:3;padding:24px 0}
 #anima-design footer{grid-column:1;grid-row:4;flex-wrap:wrap}
 #anima-design h1,#anima-design .welcome h1{font-size:32px}
 #anima-design .art{right:0;top:100px;opacity:.35}

#anima-design .section-label span{font-size:12px;color:var(--muted-foreground);font-weight:400;margin-left:8px}
#anima-design .storage-note{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:8px}

@media(max-width:560px){#anima-design .hero-panel{height:210px}#anima-design .hero-panel img{height:340px}#anima-design .disk-action{max-width:80px}#anima-design .row{gap:12px}}

#anima-design .hero-panel img{width:640px;max-width:none;height:520px;object-fit:cover;position:absolute;left:45px;top:0px;opacity:.9;mix-blend-mode:normal;mask-image:linear-gradient(0deg,transparent 17%,black 32%,black 85%,transparent);animation:integrated-door-drift 16s ease-in-out infinite;filter:none}

@keyframes integrated-door-drift{0%,100%{transform:scale(1) translateY(0);filter:none}50%{transform:scale(1.055) translateY(-5px);filter:none}}
@media(max-width:560px){#anima-design main:has(.hero-panel){min-height:410px;justify-content:flex-start;padding-top:28px}#anima-design main:has(.hero-panel)>p{max-width:250px}#anima-design main:has(.hero-panel)>.row{margin-top:200px}#anima-design .hero-panel{inset:65px -50px -20px -30px;mask-image:linear-gradient(90deg,transparent,black 15%,black 85%,transparent)}#anima-design .hero-panel img{left:-140px;top:-80px;width:780px;height:650px;opacity:.7}}
@media(prefers-reduced-motion:reduce){#anima-design .hero-panel img{animation:none}}
#anima-design .brand img{display:block;max-width:100%} #anima-design .anima-word{font-weight:500;font-size:.9em;letter-spacing:.04em;white-space:nowrap} #anima-design main:has(.hero-panel) h1{max-width:390px} #anima-design .preview-nav button[aria-pressed=true]{background:color-mix(in srgb,#88C0D0 12%,var(--card));box-shadow:inset 2px 0 #88C0D0} #anima-design .primary:not(.danger){background:#88C0D0} </style>

<div id="anima-design">
<div class="preview-label">Interactive concept · example hardware</div>
<section class="machine" aria-label="Fullscreen Anima installer concept"><header><span class="brand"><img alt="ANIMA.ING" width="148" height="22" src="../../experiments/anima-os/branding/wordmark.svg"></span></header><nav class="preview-nav" aria-label="Mockup screens"><small>Installation</small><button data-screen="0"><span>01</span>Welcome</button><button data-screen="1"><span>02</span>Network</button><button data-screen="2"><span>03</span>Preferences</button><button data-screen="3"><span>04</span>Storage</button><button data-screen="4"><span>05</span>Review</button><button data-screen="5"><span>06</span>Installing</button><button data-screen="6"><span>07</span>Ready</button></nav><main aria-live="polite"></main><footer><span class="footnote"></span><div class="actions"><button id="previous">Back</button><button id="next" class="primary">Continue</button></div></footer></section>
</div>
<script>
(()=>{
const root=document.getElementById('anima-design'),main=root.querySelector('main'),next=root.querySelector('#next'),prev=root.querySelector('#previous');
let step=0,connected=false,confirmed=false,system='ssd';const added=new Set();
const disks=[{id:'ssd',name:'Samsung SSD 870 EVO',size:'500 GB',serial:'8C21'},{id:'wd',name:'WD Blue',size:'2 TB',serial:'5A09'},{id:'iron',name:'Seagate IronWolf',size:'4 TB',serial:'7F42'}];
const prefs={name:'anima-home',language:'English (US)',keyboard:'US',timezone:'America / Los Angeles'};
const diskLine=d=>`${d.name} · ${d.size} · …${d.serial}`;
const hero=()=>`<div class="hero-panel"><img alt="Anima door artwork" src="../../experiments/anima-os/branding/hero.png"></div>`;
const screens=[
()=>`<h1>Install <span class="anima-word" aria-label="Anima"><span style="color:#5E81AC">A</span><span style="color:#81A1C1">N</span><span style="color:#88C0D0">I</span><span style="color:#6FB3C2">M</span><span style="color:#8FBCBB">A</span></span> OS</h1><p>Set up this computer to run apps, jobs and agents.</p>${hero()}<div class="row"><div>This computer<small>Intel / AMD 64-bit · 16 GB RAM · 3 internal drives</small></div></div>`,
()=>`<h1>Network</h1><p>Connect now, or install offline and set up your network later.</p><div class="row"><div>Ethernet<small>No cable connected</small></div><span>—</span></div><div class="row"><div>Home network<small>${connected?'Connected · strong signal':'Saved Wi-Fi network · strong signal'}</small></div><button id="connect">${connected?'Disconnect':'Connect'}</button></div><div class="notice">Your network settings will carry over to the installed system.</div>`,
()=>`<h1>Preferences</h1><p>You can change these settings later.</p><div class="fields"><label class="field">Machine name<input id="machine-name" type="text" maxlength="30"></label><label class="field">Language<select id="language"><option>English (US)</option><option>English (UK)</option></select></label><label class="field">Keyboard<select id="keyboard"><option>US</option><option>UK</option></select></label><label class="field">Time zone<select id="timezone"><option>America / Los Angeles</option><option>Europe / London</option><option>UTC</option></select></label></div>`,
()=>`<h1>Storage</h1><p>Choose an installation disk and any additional data drives.</p><label class="field">Install Anima OS on<select id="system-disk">${disks.map(d=>`<option value="${d.id}" ${d.id===system?'selected':''}>${diskLine(d)}</option>`).join('')}</select></label><div class="storage-note">This disk will be erased. Its remaining space is available for workloads.</div><h2 class="section-label">Additional data drives <span>Optional</span></h2>${disks.filter(d=>d.id!==system).map(d=>`<div class="row"><label><input type="checkbox" data-drive="${d.id}" ${added.has(d.id)?'checked':''}><span>${d.name}<small>${d.size} · SATA · Serial ending ${d.serial}</small></span></label><span class="disk-action ${added.has(d.id)?'erase':''}">${added.has(d.id)?'Erase & add':'Leave untouched'}</span></div>`).join('')}<div class="row"><div>Installation USB<small>32 GB · Removable</small></div><span class="disk-action">Excluded</span></div><div class="notice">Added drives become separate data volumes, not a RAID array. Selected drives will be erased; unselected drives stay untouched.</div>`,
()=>`<h1>Review installation</h1><p>${1+added.size} ${added.size?'disks':'disk'} will be erased. Check the model and serial of each.</p>${disks.filter(d=>d.id===system||added.has(d.id)).map(d=>`<div class="row"><div>${d.id===system?'Install Anima OS':'Add data volume'}<small>${diskLine(d)}</small></div><span class="disk-action erase">Erase disk</span></div>`).join('')}${disks.filter(d=>d.id!==system&&!added.has(d.id)).map(d=>`<div class="row"><div>${d.name}<small>${d.size} · …${d.serial}</small></div><span class="disk-action">Untouched</span></div>`).join('')}<div class="row"><div>Machine</div><span id="review-name"></span></div><label class="confirm"><input id="confirm" type="checkbox" ${confirmed?'checked':''}><span>I understand that all existing files on the ${1+added.size} disks marked “Erase disk” will be deleted.</span></label>`,
()=>`<h1>Installing Anima OS</h1><p>Keep this computer plugged in while Anima installs.</p><div class="big-number">64<span style="font-size:20px">%</span></div><progress max="100" value="64" aria-label="Installation progress"></progress><div class="row"><span>Copying system files</span><span>2 of 4</span></div><details><summary>Installation details</summary><pre>✓ Prepared ${1+added.size} selected disks\n→ Copying system files\n  Save machine settings\n  Configure startup</pre></details>`,
()=>`<h1>Installation complete</h1><p>Restart to start using this machine, then connect it to your Anima account.</p>${hero()}<div class="row"><div id="ready-name"></div><span class="pill">Ready</span></div><div class="notice">Remove the installation USB when prompted during restart.</div>`
];
function render(){main.innerHTML=screens[step]();root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.screen===step));prev.hidden=step===0||step>=5;next.textContent=['Continue',connected?'Continue':'Continue offline','Continue','Review',`Erase ${1+added.size} ${added.size?'disks':'disk'} & install`,'Preview completion','Back to preview'][step];next.disabled=step===4&&!confirmed;next.classList.toggle('danger',step===4);root.querySelector('.footnote').textContent=step===5?'Simulated progress':'Anima OS preview';
if(step===1)main.querySelector('#connect').onclick=()=>{connected=!connected;render()};
if(step===2){for(const key of ['language','keyboard','timezone']){const el=main.querySelector('#'+key);el.value=prefs[key];el.onchange=()=>prefs[key]=el.value}const name=main.querySelector('#machine-name');name.value=prefs.name;name.oninput=e=>prefs.name=e.target.value.replace(/[^a-zA-Z0-9-]/g,'')||'anima-home'}
if(step===3){main.querySelector('#system-disk').onchange=e=>{system=e.target.value;added.delete(system);confirmed=false;render()};main.querySelectorAll('[data-drive]').forEach(el=>el.onchange=()=>{el.checked?added.add(el.dataset.drive):added.delete(el.dataset.drive);confirmed=false;render()})}
if(step===4){main.querySelector('#review-name').textContent=prefs.name;main.querySelector('#confirm').onchange=e=>{confirmed=e.target.checked;next.disabled=!confirmed}}if(step===6)main.querySelector('#ready-name').textContent=prefs.name;
}
root.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{step=+b.dataset.screen;render()});prev.onclick=()=>{step=Math.max(0,step-1);render()};next.onclick=()=>{step=(step+1)%7;render()};render();
})();
</script>
<style>
html,body{margin:0;background:#1B1D21}
#anima-design{zoom:var(--installer-scale,1)}
#anima-design .machine{min-height:calc(100dvh / var(--installer-scale,1));border-radius:0;padding:16px 24px}
#anima-design main{padding:28px 32px 24px}
#anima-design .fields{max-width:1100px}
#anima-design p{max-width:560px}
#anima-design .art{width:clamp(640px,85%,1200px);height:clamp(520px,75vh,800px);right:0;top:0}
</style>
<script>
function fitInstaller(){document.documentElement.style.setProperty('--installer-scale',Math.max(1,Math.min(3,Math.floor(Math.min(innerWidth/1280,innerHeight/800)*4)/4)))}
addEventListener('resize',fitInstaller);fitInstaller();
</script>
</body></html>
