# Anima hub deployment (DB-002, SEC-001). Run with `docker compose up -d` from this folder.
# Required in the environment or in deploy/.env: ANIMA_HUB_ADDRESS, ANIMA_ACME_EMAIL,
# ANIMA_VPS_PUBLIC_ADDRESS.
# Run `sh bin/preflight` first (VPN address, Docker version, secret files).
# See README.md. Secret files are made by bin/make-secrets (DB-002, SEC-004, DNS-003).

# Log rotation on every service (spec Section 3.8).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "10"

# Bind mounts use `bind: {selinux: z}` so SELinux hosts (AlmaLinux) allow the container to
# read them. File secrets cannot carry a label; the README labels the secrets folder.

# Hardening that every service keeps. A service that needs more says so beside it.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-hub-image: &hub-image
  image: anima-hub:local
  build:
    context: ..
    dockerfile: deploy/hub/Dockerfile

services:
  postgres:
    <<: *hardened
    image: postgres:17.11-bookworm
    # The official entrypoint starts as root to fix ownership. Starting as the postgres user
    # (999) skips that step, so no capability is needed.
    user: "999:999"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ANIMA_OWNER_PASSWORD_FILE: /run/secrets/owner_password
      ANIMA_HUB_PASSWORD_FILE: /run/secrets/hub_password
    secrets: [postgres_password, owner_password, hub_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/roles.sql
        target: /anima/roles.sql
        read_only: true
        bind: {selinux: z}
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind: {selinux: z}
    tmpfs: ["/tmp", "/run/postgresql"]
    networks: [database]
    # TCP on 127.0.0.1, not the socket: the temporary server of the first start listens on the
    # socket only, so this check passes only after the init scripts have finished.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    restart: unless-stopped

  migrate:
    <<: [*hardened, *hub-image]
    command: ["migrate"]
    environment:
      ANIMA_DATABASE_URL_FILE: /run/secrets/owner_database_url
    secrets: [owner_database_url]
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  certs:
    <<: *hardened
    image: goacme/lego:v4.25.2
    entrypoint: ["sh", "/anima/certs/run.sh"]
    # A stop signal reaches the shell through the init process and ends the sleep loop.
    init: true
    # Root, because the hook gives the files to the hub user (10001). CHOWN is the only
    # capability kept.
    cap_add: [CHOWN]
    environment:
      ANIMA_ACME_EMAIL: ${ANIMA_ACME_EMAIL:?set ANIMA_ACME_EMAIL to the Let's Encrypt contact address}
      ANIMA_ACME_SERVER: ${ANIMA_ACME_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_dns_token
    secrets: [cloudflare_dns_token]
    volumes:
      - certs:/certs
      - lego_state:/var/lib/lego
      - type: bind
        source: ./certs
        target: /anima/certs
        read_only: true
        bind: {selinux: z}
    tmpfs: ["/tmp"]
    networks: [acme]
    healthcheck:
      test: ["CMD", "sh", "-c", "test -s /certs/hub/tls.pem"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s
    restart: unless-stopped

  guacd:
    <<: *hardened
    build:
      context: ./gateway
      additional_contexts:
        fonts: ../apps/client/src/styles/fonts
    image: anima-guacd:local
    environment:
      # The root is read-only; fontconfig writes its cache here.
      XDG_CACHE_HOME: /tmp
    tmpfs: ["/tmp"]
    volumes:
      # One folder per device under this root, made by guacd (RA-021). The root filesystem stays read-only.
      - gateway_drives:/var/lib/guacd/drives
    # The image's own check runs every 5 minutes, so guacd would stay "starting" that long.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    networks: [gateway]
    restart: unless-stopped

  # Two Tailscale LocalAPI calls for the hub (D-4, VPN-005): status and a disco ping. It is the
  # only service that sees the host's tailscaled socket, and it forwards nothing else.
  localapi:
    <<: *hardened
    build: ./localapi
    image: anima-localapi:local
    volumes:
      # The host directory, not the socket file, so a tailscaled restart leaves no stale bind.
      # No SELinux label: the VPS runs with SELinux disabled (R-054).
      - type: bind
        source: /var/run/tailscale
        target: /run/tailscale
        read_only: true
    # The image has no shell, so the check is the proxy's own `health` argument.
    healthcheck:
      test: ["CMD", "/usr/local/bin/bun", "/app/server.ts", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 2s
    networks: [localapi]
    restart: unless-stopped

  hub:
    <<: [*hardened, *hub-image]
    environment:
      ANIMA_LISTEN: ${ANIMA_HUB_IP:-172.30.0.10}:8443
      ANIMA_DATABASE_URL_FILE: /run/secrets/database_url
      ANIMA_KEY_FILE: /run/secrets/anima_key
      ANIMA_TLS_CERT_FILE: /certs/hub/tls.pem
      ANIMA_TLS_KEY_FILE: /certs/hub/tls.pem
      ANIMA_GUACD: guacd:4822
      ANIMA_GUACD_DRIVE_ROOT: /var/lib/guacd/drives
      ANIMA_PERMITTED_NETWORKS: ${ANIMA_PERMITTED_NETWORKS:-100.64.0.0/10}
      # Checks and channels never reach the hub's own networks, the hub's VPN address or the VPS
      # public address, so a device entry cannot reach PostgreSQL, guacd or the host. The notify
      # network is denied except the Apprise address 172.30.3.10: the eight CIDRs below cover
      # 172.30.3.0/24 without it, so the hub can still send to its own Apprise (NET-001, E-1).
      ANIMA_PROBE_DENY: ${ANIMA_HUB_SUBNET:-172.30.0.0/24},${ANIMA_DATABASE_SUBNET:-172.30.1.0/24},${ANIMA_VPS_PUBLIC_ADDRESS:?set to the VPS public IPv4}/32,${ANIMA_LOCALAPI_SUBNET:-172.30.2.0/24},${ANIMA_HUB_ADDRESS:?set ANIMA_HUB_ADDRESS to the hub's VPN address}/32,172.30.3.0/29,172.30.3.8/31,172.30.3.11/32,172.30.3.12/30,172.30.3.16/28,172.30.3.32/27,172.30.3.64/26,172.30.3.128/25
      # Tailscale status and ping checks go through the proxy; empty makes them Unknown (K7).
      ANIMA_TAILSCALE_LOCALAPI: ${ANIMA_TAILSCALE_LOCALAPI:-localapi:8080}
      ANIMA_PUBLIC_ORIGIN: ${ANIMA_PUBLIC_ORIGIN:-https://hub.anima.ing}
      ANIMA_WEB_ROOT: /usr/share/anima/web
      ANIMA_RECORDING_ROOT: /var/lib/anima/recordings
      ANIMA_RECORDING_MAX_BYTES: ${ANIMA_RECORDING_MAX_BYTES:-2147483648}
      ANIMA_LOG: ${ANIMA_LOG:-info}
    secrets:
      - source: hub_database_url
        target: database_url
      - anima_key
    volumes:
      - certs:/certs:ro
      # Read-write. The image creates this folder for 10001:10001 with mode 0700 and the new
      # volume copies both (E-3); the root file system stays read-only.
      - recordings:/var/lib/anima/recordings
    tmpfs: ["/tmp"]
    # `anima-hub health` asks GET /health over TLS on the listen address, pinned to tls.pem.
    # After a renewal it fails until the hub's hourly reload; unhealthy restarts nothing.
    healthcheck:
      test: ["CMD", "anima-hub", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # Only the hub is published, and only on its VPN address (NET-003). The explicit address
    # is required: the host's Docker daemon publishes on 127.0.0.1 by default.
    ports:
      - "${ANIMA_HUB_ADDRESS:?set ANIMA_HUB_ADDRESS to the hub's VPN address}:443:8443"
    networks:
      database: {}
      gateway:
        ipv4_address: ${ANIMA_HUB_IP:-172.30.0.10}
      localapi: {}
      # Joined whether or not Apprise runs, so turning it on needs no hub restart (E-2).
      notify: {}
    # No dependency on localapi: the hub starts without it and the Tailscale checks report Unknown.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      certs:
        condition: service_healthy
      guacd:
        condition: service_started
    restart: unless-stopped

  # Optional notification relay (E-2, D-13): `docker compose --profile apprise up -d`. The hub
  # posts stateless /notify calls to it; it keeps no state, publishes no port and holds no secret.
  # The hub does not depend on it.
  apprise:
    <<: *hardened
    profiles: [apprise]
    image: caronc/apprise:2.0.2@sha256:6ae97e24b3447f85f725a03ba73c6dc3a5f4b99f4273ac126de2d9b5ed6205d5
    # The image starts as root and drops to PUID. Starting as 1000 skips that step, so no
    # capability (SETUID, CHOWN) is needed.
    user: "1000:1000"
    environment:
      # Nothing is written to /config: URLs arrive with each request.
      APPRISE_STATEFUL_MODE: disabled
    # /tmp: nginx, gunicorn and supervisord write their pid, socket and temp files there. The
    # image declares /config, /attach and /plugin as volumes. A tmpfs on each stops Docker making
    # anonymous volumes, so nothing persists. /status answers 417 unless /config and /attach are
    # writable, so those two are small writable tmpfs mounts; /plugin stays empty and read-only.
    tmpfs: ["/tmp", "/config:rw,noexec,nosuid,size=1m", "/attach:rw,noexec,nosuid,size=1m", "/plugin:ro"]
    networks:
      notify:
        ipv4_address: 172.30.3.10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

networks:
  # No route out: PostgreSQL has no reason to reach the internet (DB-001).
  database:
    internal: true
    ipam:
      config:
        - subnet: ${ANIMA_DATABASE_SUBNET:-172.30.1.0/24}
  # guacd and the hub reach devices from here (GW-002, GW-003).
  gateway:
    ipam:
      config:
        - subnet: ${ANIMA_HUB_SUBNET:-172.30.0.0/24}
  # The hub and the LocalAPI proxy only; no route out.
  localapi:
    internal: true
    ipam:
      config:
        - subnet: ${ANIMA_LOCALAPI_SUBNET:-172.30.2.0/24}
  # The hub and Apprise only. It has a route out: Apprise sends to the channels' services (D-13).
  # The subnet is a literal because the carved deny list in the hub environment cannot follow a
  # variable (E-1).
  notify:
    ipam:
      config:
        - subnet: 172.30.3.0/24
  acme: {}

volumes:
  postgres_data: {}
  certs: {}
  lego_state: {}
  gateway_drives: {}
  recordings: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  owner_password:
    file: ./secrets/owner_password
  hub_password:
    file: ./secrets/hub_password
  owner_database_url:
    file: ./secrets/owner_database_url
  hub_database_url:
    file: ./secrets/hub_database_url
  anima_key:
    file: ./secrets/anima_key
  cloudflare_dns_token:
    file: ./secrets/cloudflare_dns_token
