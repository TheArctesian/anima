# An OwnTracks Recorder with a password, for one person (E0-5 T6, R-145).
# The phone posts to `proxy`. `proxy` checks the password, gives the sample to the
# Recorder, and sends a copy to the Anima hub (ANIMA_OWNTRACKS_URL), if one is set.
# Start: ./setup.sh, then `docker compose up -d`. Read README.md first.
name: anima-owntracks

services:
  recorder:
    image: owntracks/recorder:1.0.1
    restart: unless-stopped
    environment:
      OTR_PORT: "0" # no MQTT: the phone uses HTTP
      OTR_HTTPHOST: "0.0.0.0"
      OTR_HTTPPORT: "8083"
    volumes:
      - store:/store
    networks: [inside]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [recorder]
    environment:
      # Empty: no copy goes to Anima. Else the full address of the hub path,
      # for example https://hub.example/locations/v1/owntracks
      ANIMA_OWNTRACKS_URL: ${ANIMA_OWNTRACKS_URL:-}
      NGINX_ENVSUBST_FILTER: "^ANIMA_"
    volumes:
      - ./proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./secrets/htpasswd:/etc/nginx/htpasswd:ro
      - ./secrets/anima-authorization:/etc/nginx/anima-authorization:ro
    ports:
      # Only this computer. Put a TLS proxy or a tunnel in front (README.md).
      - "${OWNTRACKS_ADDRESS:-127.0.0.1}:${OWNTRACKS_PORT:-8083}:8080"
    networks: [inside, outside]
    security_opt: ["no-new-privileges:true"]

networks:
  inside:
    internal: true
  outside: {}

volumes:
  store: {}
