# Home Linux PC: let only the hub reach rest-server (VPS-006, decision D-12).
# Install as /etc/systemd/system/rest-server.service.d/allow.conf and replace the
# placeholder with the hub's VPN IPv4 address (`tailscale ip -4` on the VPS). systemd does
# not expand variables here. Until it is replaced the line does not parse, systemd ignores
# it, and IPAddressDeny=any in rest-server.service keeps every client out.
[Service]
IPAddressAllow=${HUB_VPN_IPV4}
