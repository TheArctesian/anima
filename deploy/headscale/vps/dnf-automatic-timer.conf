# Anima (VPS-004, decision D-11). Installed by `harden.sh updates` as
# /etc/systemd/system/dnf-automatic.timer.d/anima.conf. Runs the updates at 03:45 UTC,
# after the backup (03:15 plus up to 15 minutes), so a reboot at 04:30 follows a fresh
# backup. The empty OnCalendar= clears the stock 06:00 time.
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:45:00 UTC
RandomizedDelaySec=10m
Persistent=true
