# Anima (VPS-002, decision D-10). Installed by `harden.sh confirm` as
# /etc/systemd/system/nftables.service.d/anima.conf.
# Ubuntu's nftables.service stops with `nft flush ruleset`, and the package's postinst
# try-restarts the unit, so an unattended nftables upgrade would wipe Docker's and
# tailscaled's tables. The empty ExecStop= clears that, and nothing replaces it: stopping
# the unit (or shutting down) keeps the live rules, so the host is never unfiltered.
# A restart still swaps the Anima table in one transaction (nftables.conf).
[Service]
ExecStop=
