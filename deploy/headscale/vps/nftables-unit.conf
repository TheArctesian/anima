# Anima (VPS-002, decision D-10). Installed by `harden.sh confirm` as
# /etc/systemd/system/nftables.service.d/anima.conf.
# EL10's nftables.service stops with `nft flush ruleset` and reloads with
# `nft 'flush ruleset; include "/etc/sysconfig/nftables.conf";'`, and an nftables update
# restarts the unit, so an automatic update would wipe Docker's and tailscaled's tables.
# The empty ExecStop= clears the stop action and nothing replaces it: stopping the unit
# (or shutting down) keeps the live rules, so the host is never unfiltered. The reload
# loads the same file without the flush; anima.nft swaps its own table in one transaction.
[Service]
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/sysconfig/nftables.conf
ExecStop=
