# Anima SSH hardening (VPS-001, decision D-11). Installed by `harden.sh ssh` as
# /etc/ssh/sshd_config.d/00-anima.conf. sshd keeps the first value it reads for each
# keyword. EL10's sshd_config includes sshd_config.d/*.conf on its first active line, so
# the drop-ins come before the main file; this file sorts before AlmaLinux's
# 01-permitrootlogin.conf or 25-permitrootlogin.conf (PermitRootLogin yes), the
# 40-redhat-crypto-policies.conf include, 50-redhat.conf (X11Forwarding yes) and
# 50-cloud-init.conf (which may set PasswordAuthentication yes), so these values win.
# The crypto policy sets only algorithms, none of the keywords below. `harden.sh` checks
# the effective values with `sshd -T` after installing.
# VP-13: the admin logs in only over the VPN (100.64.0.0/10, the tailnet range); the provider's
# console is the fallback. anima-probe is the hub's own unprivileged user (`harden.sh probe`), so
# the hub can open SSH to this host as a device. It may log in only from 172.30.0.10, the hub
# container's address: it must match `hub_source` in nftables.conf, ANIMA_HUB_IP in
# deploy/compose.yaml and PROBE_ALLOW in sshd.sh. Its key also carries from="172.30.0.10" and
# restrict, and the firewall's output chain keeps its sessions off the host, the containers and
# the VPN. Keys only, as for every user.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
AllowUsers ${ANIMA_ADMIN_USER}@100.64.0.0/10 anima-probe@172.30.0.10
