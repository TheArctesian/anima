# Anima SSH hardening (VPS-001, decision D-11). Installed by `harden.sh ssh` as
# /etc/ssh/sshd_config.d/10-anima.conf. sshd keeps the first value it reads for each
# keyword, and this file sorts before Ubuntu's 50-cloud-init.conf (which may set
# PasswordAuthentication yes), so these values win. `harden.sh` checks the effective
# values with `sshd -T` after installing.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
AllowUsers ${ANIMA_ADMIN_USER}
