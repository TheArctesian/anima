# Anima (VPS-004, decision D-11): install every available update once a day, and reboot
# at 04:30 when an update needs it. Installed by `harden.sh updates` as
# /etc/dnf/automatic.conf (dnf 4 on EL10 reads no drop-ins for this file); the first
# copy of the original is kept in /var/lib/anima/automatic.conf.previous.
#
# upgrade_type is `default` (all updates), not `security`: dnf picks security updates
# from updateinfo advisories, and the Tailscale repository publishes none, so a
# security-only setting would never update tailscaled. dnf-automatic uses every enabled
# repository: AlmaLinux BaseOS and AppStream, EPEL, Docker CE and Tailscale.
[commands]
upgrade_type = default
random_sleep = 0
network_online_timeout = 60
download_updates = yes
apply_updates = yes
# when-needed: only after an update to the kernel, glibc, systemd or another package
# dnf lists as needing a reboot. `shutdown -r 04:30` waits for 04:30 (the next day if
# that time has passed), so a late run still reboots at the fixed time.
reboot = when-needed
reboot_command = "shutdown -r 04:30 'Anima: reboot after updates (VPS-004)'"

[emitters]
emit_via = stdio

[base]
debuglevel = 1
