#!/usr/sbin/nft -f
# Anima VPS firewall (VPS-002, decision D-10). Installed as /etc/nftables.conf by
# `harden.sh confirm`; applied live by `harden.sh firewall` with a 180 s rollback.
#
# No `flush ruleset`: Docker keeps its own tables (ip nat, ip filter, ...) in the same
# ruleset, and a flush would wipe them and break every container. Instead this file
# replaces only its own table. The two lines below are the portable replace idiom:
# `table` creates the table if it is missing (and is a no-op when it exists), `delete`
# then removes it, and the block after recreates it. `nft -f` runs the whole file as one
# transaction, so the old rules stay in force until the new ones are complete. This works
# on every nft release and kernel, unlike `destroy table` (nft >= 1.0.8 and Linux >= 6.3).
#
# Do not `systemctl stop nftables` on this host: Ubuntu's unit runs `nft flush ruleset`
# on stop, which also removes Docker's tables.
table inet anima_filter
delete table inet anima_filter

table inet anima_filter {
	# VPS-002: everything not listed here is closed to the internet.
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# DNS-005, SEC-008: Linux accepts a packet for any local address on any
		# interface. A packet for the VPN addresses that did not come through
		# WireGuard is a neighbour on the provider network reaching around the VPN.
		iifname != "tailscale0" ip daddr 100.64.0.0/10 drop
		iifname != "tailscale0" ip6 daddr fd7a:115c:a1e0::/48 drop

		# ICMPv4: rate-limited ping and the error types path MTU discovery needs.
		icmp type echo-request limit rate 5/second burst 10 packets accept
		icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

		# ICMPv6: errors, packet-too-big (path MTU) and neighbour discovery. Neighbour
		# discovery and router adverts are only valid from the local link (hop limit 255).
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
		icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 hoplimit 255 accept
		icmpv6 type echo-request limit rate 5/second burst 10 packets accept

		# VPS-002: the only public ports. Headscale control protocol, DERP and TLS-ALPN-01
		# on 443/tcp; STUN on 3478/udp; WireGuard (tailscaled) on 41641/udp.
		tcp dport 443 accept
		udp dport 3478 accept
		udp dport 41641 accept

		# VPS-001, D-6: SSH only through the VPN interface. `iifname` (not `iif`) because
		# tailscale0 does not exist yet when this file loads at boot.
		iifname "tailscale0" tcp dport 22 accept
	}

	# No forward chain: Docker owns forwarding for its containers, and a drop policy here
	# would break them. Docker-published ports are bound to 127.0.0.1 by default instead
	# (daemon.json "ip", D-10).
	# No output chain: outbound traffic is allowed.
}
