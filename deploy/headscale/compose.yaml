# Headscale on the VPS (WP-03 D-9; spec VPS-002, VPS-003).
# Project folder on the VPS: /opt/anima/headscale, holding config/ (rendered config.yaml
# and policy.hujson, mounted read-only) and lib/ (database, keys, ACME cache).
# The guide replaces the tag below with tag@sha256 digest at install.
# Admin is the CLI over the unix socket only:
#   docker compose exec headscale headscale <args>
services:
  headscale:
    image: docker.io/headscale/headscale:0.29.7
    command: serve
    restart: unless-stopped
    # Host network: Headscale binds 443/tcp and 3478/udp on the public interface and keeps
    # gRPC and metrics on the host's loopback. No `ports:`, so Docker publishes nothing.
    network_mode: host
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ./config:/etc/headscale:ro
      - ./lib:/var/lib/headscale
    security_opt:
      - no-new-privileges:true
    # Assumption for the guide to verify on first start: the image runs as root and
    # lib/ is owned by root, so writing the volume needs no DAC_OVERRIDE or CHOWN.
    # NET_BIND_SERVICE is the only capability, for port 443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
