# The gates of the repository on GitHub: the same list as `bun run gates` (quality/src/gates/gates.ts),
# split into jobs that run at the same time. It holds no secret and can write nothing.
#
# It runs for each pushed branch but `main`. A workflow that needs the gates of a commit calls
# it (`workflow_call`), so there is one definition of "the gates on GitHub". The workflow
# `merge-to-dev` starts it for `dev` (`workflow_dispatch`) after a merge.
#
# What a run tests (R-252). A push of a branch tests the branch as merged with the
# `dev` of that moment: the job `base` reads the commit of `dev`, each job merges that commit
# into its checkout, and the artifact `tested-base` keeps it. A run for `dev`, and a run that a
# workflow calls with `ref`, tests that commit as it is.
#
# Safety (PRO-044, OD-W18): each job runs on a machine of GitHub, never on a self-hosted
# runner. No pull request starts it, so a fork gets nothing; a person with the right to push
# puts the branch of a fork in this repository to check it. No `run` script holds an
# expression: each value comes in through `env`. Each action is pinned to a commit.
#
# What a Linux machine does not run or prove, so a Mac must (`bun run gates:fast` or
# `bun run gates` there): the tests of `check-mach-o.sh` and one test of
# `trial-bundle.sh --marks`, which skip off macOS; the Keychain store of the daemon and its
# LaunchAgent; the access-control tests of `link/statedir`; the macOS parts of the desktop
# shell, with the trust hook that `pinning` proves.
#
name: gates

on:
  push:
    branches-ignore:
      - main
      # The conductor starts the gates of a train itself (`workflow_dispatch`). A train that a
      # person pushed from a checkout must not start a second run, which stops the first.
      - "train/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "The commit to check. The default is the commit of the event."
        required: false
        type: string
        default: ""
      base_ref:
        description: "The ref that the baseline gate compares with. The default is origin/phase-2."
        required: false
        type: string
        default: ""

# A new push to a branch stops the run of the older commit of that branch.
concurrency:
  group: gates-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  BUN_VERSION: "1.3.14"
  CI: "true"
  # The baseline gate compares with this ref (CQ-011); the checkout has the whole history.
  BASE_REF: ${{ inputs.base_ref || 'origin/phase-2' }}

jobs:
  # The commit of `dev` that a push of a branch is tested with; empty for `dev` and for a call.
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # A push to dev reads the runs of the gates, to find the trees that already passed.
      actions: read
    outputs:
      dev_sha: ${{ steps.dev.outputs.dev_sha }}
      rust: ${{ steps.jobs.outputs.rust }}
      go: ${{ steps.jobs.outputs.go }}
      documents_only: ${{ steps.jobs.outputs.documents_only }}
      proved: ${{ steps.jobs.outputs.proved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # The jobs that a branch needs come from its changes against `dev`: the merge base needs the history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - id: dev
        name: Read the commit of dev
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CALLED_REF: ${{ inputs.ref }}
        run: |
          set -eu
          dev_sha=""
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" != "dev" ] && [ -z "$CALLED_REF" ]; then
            dev_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          fi
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$dev_sha" > tested-base
          echo "tested with dev at: ${dev_sha:-nothing, the commit as it is}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-base
          path: tested-base
          if-no-files-found: error
          retention-days: 7
      # The push of a branch runs only the jobs that its changes need (quality/src/gates/jobs.ts):
      # no Rust job for a change that no Rust build reads, no Go job without `link/`, only the
      # quality gates for documents. The train runs each job again before `dev` moves.
      # A push to `dev` (devPushJobs): only the quality gates when a run on `dev` or a train
      # already passed for its tree, or when it changed only documents on such a tree; each job
      # for each other tree, so `dev` never holds a tree that no run proved. A train or a call
      # runs each job.
      - id: jobs
        name: Read the jobs that the changes need
        env:
          DEV_SHA: ${{ steps.dev.outputs.dev_sha }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CALLED_REF: ${{ inputs.ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          if [ -n "$DEV_SHA" ]; then
            FAST_BASE="$DEV_SHA" bun quality/bin/gates.ts --jobs | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ "$REF_NAME" = "dev" ] && [ -z "$CALLED_REF" ]; then
            bun quality/bin/gates.ts --dev-push "$BEFORE" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'rust=true\ngo=true\ndocuments_only=false\n' | tee -a "$GITHUB_OUTPUT"
          fi

  windows:
    needs: base
    # dev, a train, or a run that a person started by hand (`gh workflow run gates.yml --ref <branch>`),
    # the only way to run the Windows gates for a branch before it reaches dev.
    if: (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/train/') || github.event_name == 'workflow_dispatch') && needs.base.outputs.documents_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-trial.yml
    with:
      ref: ${{ inputs.ref }}
      dev_sha: ${{ needs.base.outputs.dev_sha }}
      base_ref: ${{ inputs.base_ref || 'origin/phase-2' }}

  rust-lint:
    needs: base
    if: needs.base.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Merge the dev of this run into the checkout
        env:
          DEV_SHA: ${{ needs.base.outputs.dev_sha }}
        run: /bin/sh .github/workflows/gates-merge.sh
      - name: Install the packages that the Tauri shell needs
        run: /bin/sh .github/workflows/gates-packages.sh shell
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gates-lint
          # Only the workflow rust-cache writes these caches, under `main`, which each branch can read.
          save-if: false
      - name: Run the gates fmt and clippy
        run: bun quality/bin/gates.ts --group rust --gate fmt,clippy
      # The workspace turns on the union of the features of its crates; the release builds `anima`
      # and the application alone, so each crate must build alone (anima-cli at 6364bb038).
      - name: Check each crate alone
        run: bun quality/bin/gates.ts --alone

  rust-test:
    needs: base
    if: needs.base.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Merge the dev of this run into the checkout
        env:
          DEV_SHA: ${{ needs.base.outputs.dev_sha }}
        run: /bin/sh .github/workflows/gates-merge.sh
      - name: Install the packages that the Tauri shell needs, PostgreSQL 17 and a display
        run: /bin/sh .github/workflows/gates-packages.sh shell postgres display
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gates-test
          # Only the workflow rust-cache writes these caches, under `main`, which each branch can read.
          save-if: false
      # The pinning test of the desktop shell starts the event loop of Tauri, which needs a display.
      - name: Run the gates rust-test, doctest and pinning
        run: |
          set -eu
          unset DATABASE_URL
          xvfb-run --auto-servernum bun quality/bin/gates.ts --group rust --gate rust-test,doctest,pinning

  go:
    needs: base
    if: needs.base.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Merge the dev of this run into the checkout
        env:
          DEV_SHA: ${{ needs.base.outputs.dev_sha }}
        run: /bin/sh .github/workflows/gates-merge.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: link/go.mod
          cache: true
          cache-dependency-path: link/go.sum
      - name: Run the six Go gates
        env:
          GOFLAGS: -mod=readonly
        run: bun quality/bin/gates.ts --group go

  bun:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # The documents gate compares screens with the commit of their mockup (PLN-019), and
          # the baseline gate reads `BASE_REF`: they need the history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Merge the dev of this run into the checkout
        env:
          DEV_SHA: ${{ needs.base.outputs.dev_sha }}
        run: /bin/sh .github/workflows/gates-merge.sh
      # A test of the quality package runs Clippy on its fixtures, three tests of
      # deploy/headscale need shellcheck, and the tests of deploy start a PostgreSQL 17.
      - name: Install shellcheck and PostgreSQL 17
        run: /bin/sh .github/workflows/gates-packages.sh shellcheck postgres
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gates-bun
          # Only the workflow rust-cache writes these caches, under `main`, which each branch can read.
          save-if: false
      - name: Run the bun gates and the quality gates
        env:
          GATES_DOCUMENTS_ONLY: ${{ needs.base.outputs.documents_only }}
        run: bun quality/bin/gates.ts --group bun,quality

  # One name for a rule of the repository: it passes when each job above passed.
  passed:
    if: always()
    needs: [base, rust-lint, rust-test, go, bun, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Each job of the gates passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUST_NEEDED: ${{ needs.base.outputs.rust }}
          GO_NEEDED: ${{ needs.base.outputs.go }}
        run: |
          set -eu
          echo "results: $RESULTS"
          # windows runs only for dev and trains. A Rust or Go job may be skipped only when the job
          # base said that the changes do not need it (`--jobs`); any other skip fails.
          echo "$RESULTS" | jq -e --arg rust "${RUST_NEEDED:-}" --arg go "${GO_NEEDED:-}" 'to_entries | all(.value.result == "success" or (.value.result == "skipped" and (.key == "windows" or ($rust == "false" and (.key == "rust-lint" or .key == "rust-test")) or ($go == "false" and .key == "go"))))' > /dev/null
