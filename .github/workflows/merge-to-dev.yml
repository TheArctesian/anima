# The merge train of `dev` (R-252): branches whose gates passed land in `dev` with no person and
# no session. `quality/merge-rule.json` on `dev` is the switch: `"mergeWithoutCheck": true`.
# Nothing here touches `main`: `main` stays a deliberate step (R-198).
#
# GitHub has a merge queue that does this work, but only for a repository that an
# organization owns. This repository belongs to a personal account, so this file does it.
#
# Each start does one step of the conductor (`quality/bin/train.ts` of `dev`). It takes each
# branch whose own gates passed, merges them in a fixed order on the `dev` of the moment in a
# branch `train/<name>`, and starts the gates one time for that commit. When they pass and `dev`
# did not move, `dev` moves to that commit: the tree that was tested is the tree of `dev`. When
# they fail, the next train holds the first half; a branch that fails alone stays out. A branch
# never runs again only because `dev` moved, and the gates never run for a `dev` that a train moved.
#
# It starts when a run of `gates` ends for a push of a branch (a branch can be ready). GitHub
# sends no event when the gates of a train end, because the token of this workflow started them:
# so while a train is on the way, `merge-to-dev.sh` stays, does a step each minute, and starts
# this workflow again before the time of its job ends. The clock is for a start that was lost. GitHub
# takes this file from the default branch, so it works only when it is on `main`; the checkout
# is `dev`, so the conductor and `merge-to-dev.sh` are those of `dev`.
name: merge-to-dev

on:
  workflow_run:
    workflows: [gates]
    types: [completed]
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-to-dev
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: "1.3.14"

jobs:
  merge:
    # A push of a branch of this repository whose gates passed (never `dev` or `main`, never a
    # fork), or the end of the gates of a train, or the clock.
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main' && (
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'dev' &&
      !startsWith(github.event.workflow_run.head_branch, 'train/')) ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.head_branch, 'train/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: One step of the merge train
        env:
          GH_TOKEN: ${{ github.token }}
        run: /bin/sh .github/workflows/merge-to-dev.sh
