# Merges a branch into `dev` when its gates passed on GitHub, with no person and no session
# (R-252). `quality/merge-rule.json` on `dev` is the switch: `"mergeWithoutCheck": true`.
# Nothing here touches `main`: `main` stays a deliberate step (R-198).
#
# GitHub has a merge queue that does this work, but only for a repository that an
# organization owns. This repository belongs to a personal account, so this file does it.
#
# It starts when a run of the workflow `gates` ends. GitHub takes this file from the default
# branch, so a branch cannot change what runs here; thus it works only when it is on `main`.
# The run of the gates tested the branch as merged with one commit of `dev` (artifact
# `tested-base`). If `dev` is still at that commit, the merge script of `dev` merges the branch
# and pushes. If `dev` moved, the gates run again, with the new `dev`, and this file starts
# again when they end. After a merge it starts the gates for `dev`, because a push by a
# workflow starts no workflow.
#
# This file was never run on GitHub when it was written: see the entry of
# docs/need-human-testing.md for the first trial.
name: merge-to-dev

on:
  workflow_run:
    workflows: [gates]
    types: [completed]

concurrency:
  group: merge-to-dev
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: "1.3.14"

jobs:
  merge:
    # Only a push of a branch of this repository whose gates passed; never `dev` or `main`, never a fork.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'dev' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Merge the branch into dev
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: /bin/sh .github/workflows/merge-to-dev.sh
