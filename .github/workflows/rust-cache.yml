# The compiled Rust dependencies of the workflow `gates`, kept where each branch can read them.
#
# GitHub lets a run read the caches of its own branch and of the default branch (`main`) only.
# When each branch wrote its own cache, no other branch could read it: each run of a new branch
# compiled the dependencies again (7 minutes in rust-test), and the caches of many branches pushed
# each other out of the 10 GB of the repository. Now the jobs of `gates` only read, and this
# workflow writes: it runs on `main` (a schedule runs on the default branch), compiles the tree of
# `dev`, whose dependencies the branches share, and saves the caches under `main`. A branch whose
# Cargo.lock is different takes the newest cache of the same key and compiles only what changed.
#
# Safety: it holds no secret and can write nothing but the cache. The release workflow reads no
# Rust cache. The same actions and the same pins as gates.yml.
#
# The schedule starts only when this file is on `main`; until then a person can start it there.
name: rust-cache

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rust-cache
  cancel-in-progress: true

permissions: {}

env:
  BUN_VERSION: "1.3.14"
  CI: "true"

jobs:
  # The cache of the job rust-test: the test binaries of the workspace and the pinning test.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: dev
      - name: Install the packages that the Tauri shell needs
        run: /bin/sh .github/workflows/gates-packages.sh shell
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gates-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the tests as the gates do
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -eu
          cargo nextest run --workspace --no-run --locked
          cargo test --workspace --test pinning --no-run --locked

  # The cache of the job rust-lint: Clippy of the workspace and the check of each crate alone.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Install the packages that the Tauri shell needs
        run: /bin/sh .github/workflows/gates-packages.sh shell
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gates-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile as Clippy and the check of each crate alone do
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -eu
          cargo clippy --workspace --all-targets --locked
          bun quality/bin/gates.ts --alone
