name: CI

on:
  push:
    branches: [phase-1, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test

  javascript:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
      # The Clippy limits proof in quality/tests runs `cargo clippy`, so this job needs the toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Client lint (ESLint and Stylelint)
        run: bun run lint
      - name: Client types
        run: bun run check
      - name: Client and quality tests
        run: bun run test
      - name: Client build
        run: bun run --cwd apps/client build

  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      # The push fallback needs `phase-1` on the remote.
      # Pull requests compare with their base branch. Pushes compare with the integration branch.
      BASE_REF: origin/${{ github.base_ref || 'phase-1' }}
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Code limits
        run: bun run quality:limits
      - name: Banned names
        run: bun run quality:names
      - name: Import graph
        run: bun run quality:imports
      - name: Baseline does not grow
        run: bun run quality:baseline -- --base "$BASE_REF"
