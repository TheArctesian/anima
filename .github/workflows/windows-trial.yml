name: windows-trial

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      dev_sha:
        type: string
        default: ""
      base_ref:
        type: string
        default: "origin/phase-2"
  workflow_dispatch:

concurrency:
  group: windows-trial-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  BUN_VERSION: "1.3.14"
  CI: "true"
  BASE_REF: ${{ inputs.base_ref || 'origin/phase-2' }}

jobs:
  # Three jobs (operator decision overnight 2026-11-21, (a), (c) and (d)): the installer and its
  # installation check, and the Windows gates, run side by side on two runners; a Linux job
  # publishes the trial only when both passed, so a downloadable trial still passed the gates.
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      updater_sha256: ${{ steps.digest.outputs.updater_sha256 }}
      cli_sha256: ${{ steps.digest.outputs.cli_sha256 }}
    env: &windows-env
      VERSION: "0.0.1"
      RUSTC_WRAPPER: ""
      # Four parallel compilers on the four cores of the runner; three if a run fails for memory.
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GOENV: "off"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - &autocrlf
        name: Keep source line endings consistent with the Unix gates
        shell: pwsh
        run: git config --global core.autocrlf false
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - &bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - &merge
        name: Merge the dev of this run into the checkout
        shell: bash
        env:
          DEV_SHA: ${{ inputs.dev_sha }}
        run: sh .github/workflows/gates-merge.sh
      - &go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: link/go.mod
          cache: false
      - name: Build the native installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC build tools are missing' }
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & ./deploy/bin/windows-bundle.ps1 -Version $env:VERSION
      - id: digest
        name: Give the installer its stable name and digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory out | Out-Null
          $installer = "Anima_$($env:VERSION)_x64-setup.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/bundle/nsis/Anima.ing_$($env:VERSION)_x64-setup.exe" "out/$installer"
          $digest = (Get-FileHash "out/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          "updater_sha256=$digest" >> $env:GITHUB_OUTPUT
          "$digest  $installer" | Set-Content out/SHA256SUMS
          "Commit: $(git rev-parse HEAD)`nUnsigned Windows trial. Updates disabled. Version 0.0.1." | Set-Content out/README.txt
          $cli = "target/x86_64-pc-windows-msvc/release/anima.exe"
          if ((& $cli --version) -ne "anima $env:VERSION" -or $LASTEXITCODE -ne 0) { throw 'The standalone CLI did not start at the release version' }
          New-Item -ItemType Directory out-cli | Out-Null
          Compress-Archive -Path $cli -DestinationPath out-cli/anima-windows-x86_64.zip
          $cliDigest = (Get-FileHash out-cli/anima-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "cli_sha256=$cliDigest" >> $env:GITHUB_OUTPUT
          "$cliDigest  anima-windows-x86_64.zip" | Set-Content out-cli/SHA256SUMS
      - name: Install and check the packaged programs
        shell: pwsh
        run: ./deploy/windows/install.ps1 -Installer "out/Anima_$($env:VERSION)_x64-setup.exe" -Version $env:VERSION
      # Not the trial: the job windows-trial publishes it when the gates passed too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed
          path: |
            out/
            out-cli/
          if-no-files-found: error
          retention-days: 1

  windows-gates:
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    env: *windows-env
    steps:
      - *autocrlf
      - *checkout
      - *bun
      - *merge
      - *go
      - name: Install cargo-nextest 0.9.151, the version of the Linux gates, with its checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP/cargo-nextest.zip"
          Invoke-WebRequest 'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.151/cargo-nextest-0.9.151-x86_64-pc-windows-msvc.zip' -OutFile $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'ba35ee0ce14ace65cd8c7aaa9613adb7d2644b0fe3866e85131eb4c269786efb') { throw "cargo-nextest has the digest $digest" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/nextest"
          "$env:RUNNER_TEMP/nextest" >> $env:GITHUB_PATH
      - name: Run the Windows gates
        shell: pwsh
        env:
          # A run started by hand is a proof run: the gates go on after a failure and list each one.
          EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC build tools are missing' }
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          # The PostgreSQL tree of the installer, built from the same verified archives.
          $env:ANIMA_POSTGRES_TREE = "$pwd/apps/desktop/src-tauri/database"
          & bun apps/desktop/src-tauri/database-tree/windows.ts "$pwd/target/windows-database-work" $env:ANIMA_POSTGRES_TREE
          if ($LASTEXITCODE -ne 0) { throw 'The PostgreSQL tree failed' }
          $env:PATH = "$env:ANIMA_POSTGRES_TREE/bin;C:/msys64/mingw64/bin;$env:PATH"
          $proof = $env:EVENT -eq 'workflow_dispatch'
          $keepGoing = @(); if ($proof) { $keepGoing = @('--keep-going') }
          & bun run gates @keepGoing 2>&1 | Tee-Object -FilePath windows-gates.log
          $gates = $LASTEXITCODE
          if ($gates -ne 0 -and -not $proof) { throw 'Windows gates failed' }
          & bun deploy/bin/windows-command.ts cargo test -p anima-app --lib start_menu_environment_builds_with_the_discovered_windows_compiler -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Start-menu compiler discovery failed' }
          if ($gates -ne 0) { throw 'Windows gates failed' }
      - name: Keep the gate log even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gates
          path: windows-gates.log
          if-no-files-found: ignore
          retention-days: 14

  windows-trial:
    needs: [windows, windows-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-trial
          path: out/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-trial-cli
          path: out-cli/
          if-no-files-found: error
          retention-days: 14
